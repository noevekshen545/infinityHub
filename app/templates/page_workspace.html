      } else {
        attHtml += '<div class="att-item" onclick="window.open(\'' + a.url + '\',\'_blank\')"><i class="fa-solid ' + (a.ext === '.pdf' ? 'fa-file-pdf' : a.ext === '.zip'||a.ext === '.rar' ? 'fa-file-zipper' : 'fa-file') + '"></i></div>';
      }
    });
    attHtml += '</div></div>';
  }

  const content = (note.content || '').replace(/</g, '<').replace(/>/g, '>').replace(/\n/g, '<br>');
  body.innerHTML = '\
    <div class="note-title">' + escHtml(note.title) + '</div>\
    <div class="note-meta">\
      <span><i class="fa-solid fa-folder"></i> ' + escHtml(note.folder) + '</span>\
      <span><i class="fa-regular fa-clock"></i> ' + fmtDate(note.updated) + '</span>\
      ' + tags + '\
      <span><i class="fa-solid fa-code"></i> ' + note.mode + '</span>\
    </div>\
    <div class="note-content">' + content + '</div>\
    ' + attHtml + '\
  ';

  panel.querySelector('.detail-footer .primary').onclick = () => { window.location.href = '/notes/edit?id=' + note.id; };
  panel.classList.add('open');
};

window.closeDetailPanel = function() {
  const panel = document.getElementById('detailPanel');
  if (panel) panel.classList.remove('open');
};

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleDateString('ru', { day: 'numeric', month: 'short', year: 'numeric' });
}

// === Chat ===
let chatMessages = [];

function addChatMessage(role, text) {
  chatMessages.push({ role, text });
  renderChat();
}

function renderChat() {
  const container = document.getElementById('chatMessages');
  if (!container) return;
  container.innerHTML = chatMessages.map(m => {
    if (m.role === 'system') {
      return '<div class="chat-msg system">' + escHtml(m.text) + '</div>';
    }
    const aiClass = m.role === 'user' ? 'user' : 'ai';
    const icon = m.role === 'user' ? 'fa-user' : 'fa-brain';
    if (m.loading) {
      return '<div class="chat-msg ai"><div class="typing"><span></span><span></span><span></span></div></div>';
    }
    return '<div class="chat-msg ' + aiClass + '"><i class="fa-solid ' + icon + '" style="margin-right:6px;font-size:11px"></i>' + escHtml(m.text).replace(/\n/g, '<br>') + '</div>';
  }).join('');
  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage(text) {
  if (!text) {
    const input = document.getElementById('chatPanelInput');
    text = input ? input.value.trim() : '';
    if (!text) return;
    if (input) input.value = '';
  }
  addChatMessage('user', text);

  const loadingIdx = chatMessages.push({ role: 'ai', text: '', loading: true }) - 1;
  renderChat();

  const result = await queryAI(text);
  chatMessages[loadingIdx] = { role: 'ai', text: result.response || result.error || 'Ошибка запроса', loading: false };
  renderChat();

  document.getElementById('chatPanel').classList.add('open');
}

function toggleChat() {
  const panel = document.getElementById('chatPanel');
  if (!panel.classList.contains('open') && chatMessages.length === 0) {
    addChatMessage('system', 'Задайте вопрос по всем заметкам в этой рабочей области. AI проанализирует их содержимое и даст ответ.');
  }
  panel.classList.toggle('open');
}

function toggleChatPanel() {
  document.getElementById('chatPanel').classList.remove('open');
}

function sendChatMessagePanel() {
  const input = document.getElementById('chatPanelInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('chatInput').value = '';
  sendChatMessage(text);
}

// === Create Note ===
async function createNoteInWorkspace() {
  const input = document.getElementById('newNoteInput');
  const title = input.value.trim();
  if (!title) {
    toast('Введите название заметки', 'warning');
    return;
  }

  try {
    const r = await fetch('/api/notes/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content: '', folder: FOLDER })
    });
    const d = await r.json();
    if (d.ok) {
      input.value = '';
      toast('Заметка создана', 'success');
      const notes = await loadNotes();
      const el = document.getElementById('noteCountDisplay');
      if (el) el.textContent = notes.length + ' зам.';
      // Add white note card to canvas
      if (canvas && d.id) {
        const note = notesCache.find(n => n.id === d.id) || { id: d.id, title: title };
        const existingIds = new Set();
        canvas.forEachObject(obj => { if (obj.noteId) existingIds.add(obj.noteId); });
        if (!existingIds.has(note.id)) {
          const CW = 320, CH = 200, PAD = 14;
          const NT = wsThemeColors();
          const cx = 80, cy = 80, gx = cx + CW/2, gy = cy + CH/2, titleW = CW - PAD * 2 - 44;
          const bg = new fabric.Rect({ left: gx + CW/2, top: gy + CH/2, width: CW, height: CH,
            fill: NT.card, rx: 10, ry: 10, stroke: NT.border, strokeWidth: 1,
            shadow: new fabric.Shadow({ color: NT.shadow, blur: 16, offsetX: 0, offsetY: 4 })});
          const hdr = new fabric.Rect({ left: gx + CW/2, top: gy + 2, width: CW, height: 4, fill: NT.accent, rx: 2, ry: 2 });
          const ttl = new fabric.Textbox(truncate(note.title, 40), {
            left: gx + PAD + titleW/2, top: gy + 18 + 13*1.2/2, fontSize: 13, fontWeight: 700,
            fontFamily: "'Inter', sans-serif", fill: NT.text,
            width: titleW, splitByGrapheme: false,
            lineHeight: 1.2, overflow: 'hidden' });
          const badgeBg = new fabric.Rect({ left: gx + CW - PAD - 17, top: gy + 18 + 10, width: 34, height: 20, rx: 10, ry: 10, fill: NT.accentSoft });
          const badgeTxt = new fabric.Text('MD', { left: gx + CW - PAD - 17, top: gy + 18 + 10, fontSize: 9, fontWeight: 700, fontFamily: "'Inter', sans-serif", fill: NT.accent, originX: 'center' });
          const dispTop = 44;
          const dispW = CW - PAD * 2, dispH = CH - dispTop - PAD;
          const disp = new fabric.Textbox('', {
            left: gx + PAD + dispW/2, top: gy + dispTop + dispH/2, fontSize: 11, lineHeight: 1.6,
            fontFamily: "'Inter', sans-serif", fill: NT.dim, width: dispW, height: dispH, splitByGrapheme: false, selectable: false, overflow: 'hidden' });
          const g = new fabric.Group([bg, hdr, ttl, badgeBg, badgeTxt, disp], {
            left: gx, top: gy, noteId: note.id, noteMode: 'markdown',
            selectable: true, hasControls: true });
          canvas.add(g);
          notePositions[note.id] = { left: g.left, top: g.top, scaleX: g.scaleX, scaleY: g.scaleY, noteMode: 'markdown' };
          saveNotePositions();
          canvas.requestRenderAll(); snapCanvas();
        }
      }
    } else {
      toast('Ошибка: ' + (d.error || 'Unknown'), 'error');
    }
  } catch (e) {
    toast('Ошибка: ' + e.message, 'error');
  }
}

// === Main App ===
function App() {
  const [folderName, setFolderName] = React.useState(FOLDER);
  const [noteCount, setNoteCount] = React.useState(0);
  const [bottomBarPos, setBottomBarPos] = React.useState(
    localStorage.getItem('ws_bottom_pos') || 'bottom'
  );

  React.useEffect(() => {
    async function init() {
      try {
        const [notes, state] = await Promise.all([loadNotes(), loadWorkspaceState()]);
        // Server-side positions are a fallback when localStorage has no entry for a note
        if (state && state.note_windows) {
          for (const id in state.note_windows) {
            if (!notePositions[id]) notePositions[id] = state.note_windows[id];
          }
          saveNotePositions();
        }
        console.log('[WS] init: notes loaded, count=', notes.length);
        setNoteCount(notes.length);
        try {
          const r = await fetch('/api/notes/tree');
          const d = await r.json();
          if (d.tree) {
            function findFolder(nodes, id) {
              for (const n of nodes) {
                if (n.id === id) return n.name || n.id;
                if (n.children) { const r = findFolder(n.children, id); if (r) return r; }
              }
              return null;
            }
            const name = findFolder(d.tree, FOLDER) || FOLDER;
            setFolderName(name);
          }
        } catch(e) {}
        notesReady = true; checkRenderNotes();
      } catch(e) {
        notesReady = true; checkRenderNotes();
      }
    }
    init();
  }, []);

  React.useEffect(() => {
    console.log('[WS] initFabricCanvas effect fired');
    initFabricCanvas();
    showLoading(false);
  }, []);

  // Auto-save workspace state periodically
  React.useEffect(() => {
    const timer = setInterval(async () => {
      try {
        collectNotePositions();
        const canvasData = localStorage.getItem(CANVAS_KEY);
        const data = {
          folder: FOLDER,
          canvas_data: canvasData,
          updated: Date.now() / 1000,
          note_windows: notePositions,
        };
        await saveWorkspaceState(data);
        const ind = document.getElementById('saveIndicator');
        if (ind) { ind.textContent = 'Сохранено'; ind.style.opacity = '1'; setTimeout(() => ind.style.opacity = '0', 2000); }
      } catch(e) {}
    }, 30000);
    return () => clearInterval(timer);
  }, []);

  return React.createElement(React.Fragment, null,
    // Top bar
    React.createElement('div', { className: 'top-bar', style: { position: 'fixed' } },
      React.createElement('a', { className: 'back-link', href: '/notes' },
        React.createElement('i', { className: 'fa-solid fa-arrow-left' }),
        'Назад'
      ),
      React.createElement('div', { className: 'sep' }),
      React.createElement('div', { className: 'title' },
        React.createElement('i', { className: 'fa-solid fa-border-all' }),
        folderName,
        React.createElement('span', { id: 'noteCountDisplay', className: 'note-count' }, noteCount + ' зам.')
      ),
      React.createElement('div', { className: 'sep' }),
      React.createElement('span', { id: 'saveIndicator', className: 'save-ind' }, ''),
      React.createElement('div', { className: 'sep' }),
      React.createElement('button', { className: 'btn', onClick: () => toggleChat(), title: 'AI чат' },
        React.createElement('i', { className: 'fa-solid fa-brain' }),
        'AI чат'
      ),
      React.createElement('button', { className: 'btn', onClick: () => refreshNotesCanvas(), title: 'Обновить заметки' },
        React.createElement('i', { className: 'fa-solid fa-rotate' })
      )
    ),

    // Bottom bar
    React.createElement('div', { className: 'bottom-bar' + (bottomBarPos !== 'bottom' ? ' pos-' + bottomBarPos : '') },
      React.createElement('div', { className: 'input-wrap', style: { flex: 1 } },
        React.createElement('textarea', {
          id: 'newNoteInput',
          placeholder: 'Новая заметка...',
          rows: '2',
          style: { border: 'none', background: 'none', outline: 'none', fontSize: '13px', color: 'var(--text)', fontFamily: 'inherit', width: '100%', resize: 'vertical', minHeight: '40px', maxHeight: '200px', lineHeight: '1.5' },
          onKeyDown: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); createNoteInWorkspace(); } }
        }),
        React.createElement('div', { className: 'input-actions' },
          React.createElement('div', { className: 'pos-toggle' },
            React.createElement('button', {
              onClick: () => { setBottomBarPos('bottom'); localStorage.setItem('ws_bottom_pos', 'bottom'); },
              className: bottomBarPos === 'bottom' ? 'active' : '',
              title: 'Снизу'
            }, React.createElement('i', { className: 'fa-solid fa-arrow-down' })),
            React.createElement('button', {
              onClick: () => { setBottomBarPos('left'); localStorage.setItem('ws_bottom_pos', 'left'); },
              className: bottomBarPos === 'left' ? 'active' : '',
              title: 'Слева'
            }, React.createElement('i', { className: 'fa-solid fa-arrow-left' })),
            React.createElement('button', {
              onClick: () => { setBottomBarPos('right'); localStorage.setItem('ws_bottom_pos', 'right'); },
              className: bottomBarPos === 'right' ? 'active' : '',
              title: 'Справа'
            }, React.createElement('i', { className: 'fa-solid fa-arrow-right' }))
          ),
          React.createElement('button', {
            className: 'btn primary',
            style: { padding: '4px 12px', fontSize: '12px' },
            onClick: createNoteInWorkspace
          },
            React.createElement('i', { className: 'fa-solid fa-plus' }),
            'Создать'
          )
        )
      )
    ),

    // Chat panel (static HTML, not in React — prevents DOM conflicts with renderChat)
    React.createElement('div', { id: 'chatPanel', className: 'chat-panel' },
      React.createElement('div', { className: 'chat-panel-header' },
        React.createElement('i', { className: 'fa-solid fa-brain' }),
        'AI чат — ' + folderName,
        React.createElement('button', { onClick: () => toggleChatPanel() },
          React.createElement('i', { className: 'fa-solid fa-xmark' })
        )
      ),
      React.createElement('div', { id: 'chatMessages', className: 'chat-messages' }),
      React.createElement('div', { className: 'chat-panel-input' },
        React.createElement('textarea', {
          id: 'chatPanelInput',
          placeholder: 'Спросить AI... (Enter для отправки)',
          rows: 2,
          onKeyDown: (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessagePanel(); }
          }
        }),
        React.createElement('button', { className: 'btn primary', onClick: sendChatMessagePanel },
          React.createElement('i', { className: 'fa-solid fa-paper-plane' })
        )
      )
    ),

    // Detail panel
    React.createElement('div', { id: 'detailPanel', className: 'detail-panel' },
      React.createElement('div', { className: 'detail-header' },
        React.createElement('h3', null, React.createElement('i', { className: 'fa-solid fa-note-sticky' }), 'Заметка'),
        React.createElement('button', { onClick: () => window.closeDetailPanel() },
          React.createElement('i', { className: 'fa-solid fa-xmark' })
        )
      ),
      React.createElement('div', { className: 'detail-body' },
        React.createElement('div', { style: { textAlign: 'center', padding: '40px', color: 'var(--text3)' } },
          React.createElement('i', { className: 'fa-solid fa-note-sticky', style: { fontSize: '32px', opacity: 0.5, marginBottom: '12px', display: 'block' } }),
          'Выберите заметку на холсте чтобы просмотреть'
        )
      ),
      React.createElement('div', { className: 'detail-footer' },
        React.createElement('button', { className: 'primary', onClick: () => {} },
          React.createElement('i', { className: 'fa-solid fa-external-link-alt' }),
          'Открыть в редакторе'
        )
      )
    ),

    // Welcome hint
    React.createElement('div', { id: 'welcomeHint', className: 'welcome-hint' },
      React.createElement('i', { className: 'fa-solid fa-lightbulb' }),
      'Инструменты слева, AI чат внизу, правая кнопка — меню заметки',
      React.createElement('button', {
        title: 'Скрыть подсказку',
        onClick: (e) => {
          const box = e.target.closest('div');
          box.style.opacity = '0';
          setTimeout(() => box.remove(), 600);
        }
      }, React.createElement('i', { className: 'fa-solid fa-xmark' }))
    )
  );
}

// === Mount ===
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
