<!DOCTYPE html>
<html class="pg-canvas" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Холст — Бесконечный канвас</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f8f9fa; }
  #c { display: block; }

  .loading {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; color: #666;
    background: #f8f9fa;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #e0e0e0; border-top-color: #4f46e5;
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toolbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border: 1px solid rgba(0,0,0,0.08); border-radius: 12px;
    padding: 6px 10px; display: flex; align-items: center; gap: 2px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08); user-select: none;
  }
  .toolbar .sep {
    width: 1px; height: 24px; background: rgba(0,0,0,0.08); margin: 0 4px;
  }
  .toolbar .group { display: flex; align-items: center; gap: 2px; }
  .toolbar button {
    width: 34px; height: 34px; border: none; background: transparent;
    border-radius: 8px; cursor: pointer; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    color: #555; transition: all 0.12s;
  }
  .toolbar button:hover { background: #f0f0f0; color: #111; }
  .toolbar button.active { background: #e8eaff; color: #4f46e5; }
  .toolbar button:disabled { opacity: 0.3; cursor: default; }

  .toolbar .color-wrap {
    position: relative; width: 28px; height: 28px;
  }
  .toolbar .color-wrap input[type="color"] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 2px solid #ddd; border-radius: 6px; cursor: pointer; padding: 0;
  }
  .toolbar input[type="range"] {
    width: 60px; height: 4px; accent-color: #4f46e5;
  }
  .toolbar .size-label {
    font-size: 11px; color: #999; min-width: 18px; text-align: center;
  }
  .toolbar .hint {
    font-size: 10px; color: #bbb; padding: 0 6px;
  }

  .save-indicator {
    position: fixed; bottom: 20px; right: 20px; z-index: 100;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
    padding: 6px 14px; border-radius: 8px; font-size: 12px; color: #2da44e;
    border: 1px solid rgba(0,0,0,0.06); opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }

  .zoom-display {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 100; font-size: 12px; color: #999;
    background: rgba(255,255,255,0.8); padding: 4px 12px;
    border-radius: 6px; border: 1px solid rgba(0,0,0,0.06);
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }

  @media (max-width: 768px) {
    .toolbar { flex-wrap: wrap; max-width: 95vw; font-size: 13px; }
    .toolbar button { width: 30px; height: 30px; font-size: 14px; }
    .toolbar input[type="range"] { width: 40px; }
  }
</style>
<script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="/static/js/mobile.js" defer></script>
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
  <script src="/static/js/dialogs.js" defer></script>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>Загрузка холста...</div>
</div>

<canvas id="c"></canvas>

<div class="toolbar" id="toolbar">
  <div class="group">
    <button data-tool="select" class="active" title="Выделить (V)"><i class="fa-solid fa-mouse-pointer"></i></button>
    <button data-tool="pan" title="Рука (H / Space+клик)"><i class="fa-solid fa-hand"></i></button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button data-tool="rect" title="Прямоугольник (R)"><i class="fa-solid fa-square"></i></button>
    <button data-tool="ellipse" title="Эллипс (O)"><i class="fa-solid fa-circle"></i></button>
    <button data-tool="line" title="Линия (L)"><i class="fa-solid fa-slash"></i></button>
    <button data-tool="arrow" title="Стрелка (A)"><i class="fa-solid fa-arrow-right"></i></button>
    <button data-tool="draw" title="Рисовать от руки (D)"><i class="fa-solid fa-pen"></i></button>
    <button data-tool="text" title="Текст (T)"><i class="fa-solid fa-font"></i></button>
    <button data-tool="sticky" title="Стикер (S)"><i class="fa-solid fa-clipboard"></i></button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <div class="color-wrap"><input type="color" id="strokeColor" value="#4f46e5" title="Обводка"></div>
    <div class="color-wrap"><input type="color" id="fillColor" value="#e8eaff" title="Заливка"></div>
  </div>
  <div class="sep"></div>
  <div class="group">
    <input type="range" id="strokeWidth" min="1" max="20" value="2">
    <span class="size-label" id="sizeDisplay">2</span>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="undoBtn" disabled title="Отменить (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
    <button id="redoBtn" disabled title="Повторить (Ctrl+Shift+Z)"><i class="fa-solid fa-rotate-right"></i></button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="clearBtn" title="Очистить"><i class="fa-solid fa-trash-can"></i></button>
  </div>
  <span class="hint">Space+drag — pan</span>
</div>

<div class="save-indicator" id="saveIndicator">✓ Сохранено</div>
<div class="zoom-display" id="zoomDisplay">100%</div>

<script src="/static/libs/fabric.min.js"></script>
<script>
(function() {
  const STORAGE_KEY = 'canvas_data';
  const UNDO_LIMIT = 60;

  let canvas, currentTool = 'select', isPanning = false, lastPan = null;
  let isDrawing = false, startPoint = null, shape = null, isSpace = false;
  let undoStack = [], redoStack = [], isRestoring = false;
  let saveTimer = null, hideZoomTimer = null;

  const $ = id => document.getElementById(id);
  const strokeColor = () => $('strokeColor').value;
  const fillColor = () => $('fillColor').value;
  const strokeW = () => parseInt($('strokeWidth').value);

  function init() {
    const el = $('c');

    canvas = new fabric.Canvas(el, {
      width: window.innerWidth, height: window.innerHeight,
      backgroundColor: '#ffffff', preserveObjectStacking: true,
      stopContextMenu: true, fireRightClick: true,
    });

    bindEvents();
    bindToolbar();
    bindKeys();

    window.addEventListener('resize', () => {
      canvas.setDimensions({ width: window.innerWidth, height: window.innerHeight });
      canvas.requestRenderAll();
    });

    loadData();
    $('loading').style.display = 'none';
  }

  // ─── Events ──────────────────────────────────────────
  function bindEvents() {
    canvas.on('mouse:wheel', opt => {
      const d = opt.e.deltaY, z = canvas.getZoom();
      const zoom = Math.min(Math.max(z * (0.999 ** d), 0.05), 50);
      canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
      showZoom(zoom);
      opt.e.preventDefault();
      opt.e.stopPropagation();
    });

    canvas.on('mouse:down', opt => {
      const e = opt.e, p = canvas.getScenePoint(e);

      if (e.button === 1 || (e.button === 0 && (e.altKey || isSpace))) {
        isPanning = true; lastPan = { x: e.clientX, y: e.clientY };
        canvas.selection = false; e.preventDefault(); return;
      }

      if (['rect','ellipse','line','arrow'].includes(currentTool) && e.button === 0) {
        isDrawing = true; startPoint = p; canvas.selection = false;
        const c = strokeColor(), w = strokeW(), f = fillColor();
        if (currentTool === 'rect') {
          shape = new fabric.Rect({ left: p.x, top: p.y, width: 0, height: 0,
            fill: f, stroke: c, strokeWidth: w, strokeUniform: true });
        } else if (currentTool === 'ellipse') {
          shape = new fabric.Ellipse({ left: p.x, top: p.y, rx: 0, ry: 0,
            fill: f, stroke: c, strokeWidth: w, strokeUniform: true });
        } else {
          shape = new fabric.Line([p.x, p.y, p.x, p.y],
            { stroke: c, strokeWidth: w, strokeUniform: true });
        }
        canvas.add(shape); canvas.setActiveObject(shape);
        return;
      }

      if (currentTool === 'draw' && e.button === 0) {
        canvas.isDrawingMode = true;
        const brush = new fabric.PencilBrush(canvas);
        brush.color = strokeColor();
        brush.width = strokeW();
        canvas.freeDrawingBrush = brush;
        return;
      }

      if (currentTool === 'text' && e.button === 0) {
        const t = new fabric.IText('Текст', {
          left: p.x, top: p.y, fontSize: Math.max(16, strokeW() * 8),
          fill: strokeColor(), fontFamily: 'Inter, Arial, sans-serif',
        });
        canvas.add(t); canvas.setActiveObject(t); t.enterEditing();
        snap();
        return;
      }

      if (currentTool === 'sticky' && e.button === 0) {
        const w = 200, h = 120, c = strokeColor();
        const r = new fabric.Rect({ left: 0, top: 0, width: w, height: h,
          fill: c, rx: 8, ry: 8 });
        const txt = new fabric.IText('Новая заметка', {
          left: 12, top: 12, width: w - 24, fontSize: 14,
          fill: '#fff', fontFamily: 'Inter, Arial, sans-serif',
        });
        const g = new fabric.Group([r, txt], { left: p.x, top: p.y });
        canvas.add(g); canvas.setActiveObject(g);
        snap();
        return;
      }
    });

    canvas.on('mouse:move', opt => {
      if (isPanning && lastPan) {
        const v = canvas.viewportTransform;
        v[4] += opt.e.clientX - lastPan.x;
        v[5] += opt.e.clientY - lastPan.y;
        canvas.requestRenderAll();
        lastPan = { x: opt.e.clientX, y: opt.e.clientY };
        opt.e.preventDefault(); return;
      }
      if (isDrawing && shape && startPoint) {
        const p = canvas.getScenePoint(opt.e), sx = startPoint.x, sy = startPoint.y;
        if (currentTool === 'rect') {
          shape.set({ left: Math.min(sx, p.x), top: Math.min(sy, p.y),
            width: Math.abs(p.x - sx), height: Math.abs(p.y - sy) });
        } else if (currentTool === 'ellipse') {
          shape.set({ left: Math.min(sx, p.x), top: Math.min(sy, p.y),
            rx: Math.abs(p.x - sx) / 2, ry: Math.abs(p.y - sy) / 2 });
        } else {
          shape.set({ x2: p.x, y2: p.y });
        }
        shape.setCoords(); canvas.requestRenderAll();
      }
    });

    canvas.on('mouse:up', () => {
      if (isPanning) {
        isPanning = false; lastPan = null;
        canvas.selection = currentTool === 'select'; return;
      }
      if (isDrawing && shape) {
        isDrawing = false;
        if (shape.width < 3 && shape.height < 3 && !(shape instanceof fabric.Line)) {
          canvas.remove(shape);
        } else if (currentTool === 'arrow') {
          const x1 = shape.x1, y1 = shape.y1, x2 = shape.x2, y2 = shape.y2;
          const dx = x2 - x1, dy = y2 - y1;
          const len = Math.sqrt(dx * dx + dy * dy);
          if (len < 5) { canvas.remove(shape); }
          else {
            const ang = Math.atan2(dy, dx) * 180 / Math.PI;
            const hl = Math.max(10, strokeW() * 5);
            const line = new fabric.Line([0, 0, len, 0],
              { stroke: shape.stroke, strokeWidth: shape.strokeWidth, strokeUniform: true });
            const head = new fabric.Triangle({
              left: len, top: 0, pointX: len, pointY: 0,
              width: hl, height: hl, angle: 90, fill: shape.stroke,
              originX: 'center', originY: 'center',
            });
            const g = new fabric.Group([line, head], {
              left: x1, top: y1, angle: ang,
            });
            canvas.remove(shape); canvas.add(g);
          }
        }
        shape = null; canvas.selection = true; snap();
      }
    });

    canvas.on('path:created', () => {
      canvas.isDrawingMode = false;
      currentTool = 'select'; updateToolbar(); snap();
    });

    canvas.on('object:modified', () => snap());
    canvas.on('selection:created', () => updateProps());
    canvas.on('selection:updated', () => updateProps());
    canvas.on('selection:cleared', () => updateProps());
  }

  // ─── Toolbar ──────────────────────────────────────────
  function bindToolbar() {
    document.querySelectorAll('[data-tool]').forEach(b => {
      b.addEventListener('click', () => setTool(b.dataset.tool));
    });
    $('strokeColor').addEventListener('input', applyProps);
    $('fillColor').addEventListener('input', applyProps);
    $('strokeWidth').addEventListener('input', e => {
      $('sizeDisplay').textContent = e.target.value;
      applyProps();
    });
    $('undoBtn').addEventListener('click', undo);
    $('redoBtn').addEventListener('click', redo);
    $('clearBtn').addEventListener('click', () => {
      if (confirm('Очистить холст? Все данные будут удалены.')) {
        canvas.clear(); canvas.backgroundColor = '#ffffff';
        canvas.requestRenderAll(); snap();
      }
    });
  }

  function setTool(t) {
    currentTool = t;
    canvas.isDrawingMode = t === 'draw';
    if (t === 'draw') {
      const brush = new fabric.PencilBrush(canvas);
      brush.color = strokeColor(); brush.width = strokeW();
      canvas.freeDrawingBrush = brush;
    }
    canvas.selection = t === 'select';
    updateToolbar();
  }

  function updateToolbar() {
    document.querySelectorAll('[data-tool]').forEach(b => {
      b.classList.toggle('active', b.dataset.tool === currentTool);
    });
  }

  function updateProps() {
    const obj = canvas.getActiveObject();
    if (obj && obj.type !== 'activeSelection') {
      $('strokeColor').value = obj.stroke || '#000000';
      $('fillColor').value = obj.fill || '#ffffff';
      $('strokeWidth').value = obj.strokeWidth || 1;
      $('sizeDisplay').textContent = obj.strokeWidth || 1;
    }
  }

  function applyProps() {
    const obj = canvas.getActiveObject();
    if (!obj) return;
    const c = strokeColor(), f = fillColor(), w = strokeW();
    if (obj.type === 'activeSelection') {
      obj.forEachObject(o => { o.set({ stroke: c, fill: f, strokeWidth: w }); o.setCoords(); });
    } else {
      obj.set({ stroke: c, fill: f, strokeWidth: w });
      obj.setCoords();
    }
    canvas.requestRenderAll();
  }

  // ─── Undo / Redo ──────────────────────────────────────
  function snap() {
    if (isRestoring) return;
    const s = JSON.stringify(canvas.toJSON(['id']));
    undoStack.push(s);
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    redoStack = [];
    updateUndo();
    save();
  }

  function undo() {
    if (undoStack.length < 2) return;
    redoStack.push(undoStack.pop());
    restore(undoStack[undoStack.length - 1]);
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(redoStack.pop());
    restore(undoStack[undoStack.length - 1]);
  }

  function restore(s) {
    isRestoring = true;
    canvas.loadFromJSON(JSON.parse(s), () => {
      canvas.requestRenderAll();
      isRestoring = false;
      updateUndo();
    });
  }

  function updateUndo() {
    $('undoBtn').disabled = undoStack.length < 2;
    $('redoBtn').disabled = redoStack.length === 0;
  }

  // ─── Save / Load ──────────────────────────────────────
  function save() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(canvas.toJSON(['id'])));
        const ind = $('saveIndicator'); ind.style.opacity = '1';
        setTimeout(() => ind.style.opacity = '0', 2000);
      } catch (e) { console.warn('Save error:', e); }
    }, 500);
  }

  function loadData() {
    try {
      const d = localStorage.getItem(STORAGE_KEY);
      if (d) {
        canvas.loadFromJSON(JSON.parse(d), () => {
          canvas.requestRenderAll();
          undoStack = [d]; updateUndo();
        });
        return;
      }
    } catch (e) { console.warn('Load error:', e); }
    undoStack = [JSON.stringify(canvas.toJSON(['id']))];
    updateUndo();
  }

  // ─── Zoom display ─────────────────────────────────────
  function showZoom(z) {
    const el = $('zoomDisplay');
    el.textContent = Math.round(z * 100) + '%';
    el.style.opacity = '1';
    if (hideZoomTimer) clearTimeout(hideZoomTimer);
    hideZoomTimer = setTimeout(() => el.style.opacity = '0', 1500);
  }

  // ─── Keyboard ─────────────────────────────────────────
  function bindKeys() {
    document.addEventListener('keydown', e => {
      if (e.key === ' ') { isSpace = true; e.preventDefault(); }
      const ctrl = e.ctrlKey || e.metaKey;
      if (ctrl && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      if (ctrl && e.key === 'z' && e.shiftKey) { e.preventDefault(); redo(); }
      if (ctrl && e.key === 'y') { e.preventDefault(); redo(); }
      if (!ctrl && !e.altKey && !e.shiftKey && !e.target.closest('input,textarea,canvas')) {
        const map = {
          v:'select', h:'pan', r:'rect', o:'ellipse',
          l:'line', a:'arrow', d:'draw', t:'text', s:'sticky',
        };
        if (map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);
      }
      if ((e.key === 'Delete' || e.key === 'Backspace') &&
          !e.target.closest('input,textarea')) {
        const obj = canvas.getActiveObject();
        if (obj) { canvas.remove(obj); canvas.discardActiveObject();
          canvas.requestRenderAll(); snap(); }
      }
    });
    document.addEventListener('keyup', e => {
      if (e.key === ' ') isSpace = false;
    });
  }

  init();
})();
</script>
</body>
</html>
