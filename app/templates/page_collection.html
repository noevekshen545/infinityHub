<!DOCTYPE html>
<html class="pg-page_collection" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Коллекция Flibusta — Infinity</title>
<link rel="stylesheet" href="/static/css/font-awesome.min.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box }
:root {
--bg: #fafbfc; --bg2: #ffffff; --bg3: #f3f4f6; --bg4: #e5e7eb;
--border: rgba(0, 0, 0, 0.06); --border2: rgba(0, 0, 0, 0.1);
--text: #111827; --text2: #4b5563; --text3: #9ca3af;
--accent: #4f46e5; --accent2: #4338ca;
--accent-glow: rgba(79, 70, 229, 0.15); --accent-light: rgba(79, 70, 229, 0.1);
--link: #4338ca; --card: rgba(255, 255, 255, 0.8); --hover: rgba(0, 0, 0, 0.03);
--red: #dc2626; --green: #059669; --yellow: #d97706; --purple: #7c3aed; --blue: #2563eb; --orange: #ea580c;
--shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
--shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
--shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.08);
--radius: 16px; --radius-sm: 10px; --radius-lg: 24px;
--tr: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
--glass: rgba(255, 255, 255, 0.72); --glass-border: rgba(0, 0, 0, 0.08);
--font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
body.dark {
--bg: #0a0e14; --bg2: #111820; --bg3: #1a222e; --bg4: #252f3d;
--border: rgba(255, 255, 255, 0.06); --border2: rgba(255, 255, 255, 0.1);
--text: #e8ecf4; --text2: #a0aec0; --text3: #64748b;
--accent: #818cf8; --accent2: #6366f1;
--accent-glow: rgba(129, 140, 248, 0.2); --accent-light: rgba(129, 140, 248, 0.12);
--link: #a5b4fc; --card: rgba(17, 24, 32, 0.7); --hover: rgba(255, 255, 255, 0.04);
--red: #f87171; --green: #34d399; --yellow: #fbbf24; --purple: #a78bfa; --blue: #60a5fa; --orange: #fb923c;
--shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
--shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
--shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
--glass: rgba(17, 24, 32, 0.65); --glass-border: rgba(255, 255, 255, 0.08);
}
body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh; transition: var(--tr) }
.toolbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 6px;
  padding: 10px 16px; flex-wrap: wrap;
  background: var(--glass); backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: var(--shadow-sm);
}
.toolbar:hover { box-shadow: var(--shadow-lg), 0 0 60px var(--accent-glow) }
.toolbar .btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: var(--radius-sm);
  background: transparent; border: none; color: var(--text2);
  cursor: pointer; font-size: 13px; font-weight: 500; text-decoration: none;
  transition: var(--tr); white-space: nowrap;
}
.toolbar .btn i { font-size: 14px; transition: var(--tr) }
.toolbar .btn:hover { background: var(--hover); color: var(--text) }
.toolbar .btn:hover i { color: var(--accent) }
.toolbar .btn.active { background: var(--accent-light); color: var(--accent); font-weight: 600 }
.toolbar .btn.active i { color: var(--accent) }
.toolbar .sep { width: 1px; height: 24px; background: var(--border2); margin: 0 4px }
.toolbar .spacer { flex: 1 }
.search-box { display: flex; align-items: center; gap: 4px; background: var(--bg3); border-radius: 8px; padding: 4px 8px; border: 1px solid transparent; transition: var(--tr) }
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); background: var(--bg2) }
.search-box i { color: var(--text3); font-size: 13px }
.search-box input { background: none; border: none; outline: none; color: var(--text); font-size: 13px; width: 180px; padding: 4px }
.search-box input::placeholder { color: var(--text3) }
.content { padding: 20px; max-width: 1400px; margin: 0 auto }
.page-header { margin-bottom: 24px }
.page-header h1 { font-size: 24px; font-weight: 700; color: var(--text) }
.page-header .subtitle { color: var(--text3); font-size: 14px; margin-top: 4px }
.stats { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap }
.stat-card {
  background: var(--card); border-radius: var(--radius-sm); padding: 16px 24px;
  flex: 1; min-width: 120px; text-align: center;
  box-shadow: var(--shadow-sm); border: 1px solid var(--border); backdrop-filter: blur(10px);
  transition: var(--tr);
}
.stat-card:hover { box-shadow: var(--shadow); transform: translateY(-1px) }
.stat-card .num { font-size: 28px; font-weight: 700; color: var(--accent) }
.stat-card .label { font-size: 12px; color: var(--text3); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px }
.books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px }
.book-card {
  background: var(--card); border-radius: var(--radius-sm); overflow: hidden;
  cursor: pointer; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
  transition: var(--tr); backdrop-filter: blur(10px);
}
.book-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); border-color: var(--accent-light) }
.book-cover { width: 100%; height: 220px; background: var(--bg3); display: flex; align-items: center; justify-content: center; overflow: hidden }
.book-cover img { width: 100%; height: 100%; object-fit: cover }
.book-cover .no-cover { font-size: 42px; color: var(--text3); opacity: 0.5 }
.book-info { padding: 10px 12px }
.book-info .title { font-size: 13px; font-weight: 600; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3 }
.book-info .author { font-size: 11px; color: var(--text3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.book-info .meta { font-size: 10px; color: var(--text3); margin-top: 4px; opacity: 0.7 }
.loading { text-align: center; padding: 60px; color: var(--text3) }
.loading .spinner { width: 32px; height: 32px; border: 3px solid var(--bg4); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px }
@keyframes spin { to { transform: rotate(360deg) } }
.error { text-align: center; padding: 40px; color: var(--red) }
.load-more { text-align: center; padding: 24px }
.load-more button {
  padding: 10px 36px; background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-weight: 500;
  transition: var(--tr);
}
.load-more button:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: var(--shadow) }
.load-more button:disabled { opacity: 0.5; cursor: default; transform: none }
.list-view { display: flex; flex-direction: column; gap: 6px }
.list-item {
  background: var(--card); border-radius: var(--radius-sm); padding: 12px 16px;
  cursor: pointer; border: 1px solid var(--border); backdrop-filter: blur(10px);
  display: flex; justify-content: space-between; align-items: center;
  transition: var(--tr);
}
.list-item:hover { background: var(--hover); border-color: var(--accent-light); transform: translateX(2px) }
.list-item .name { font-weight: 500; color: var(--text); font-size: 14px }
.list-item .count { font-size: 12px; color: var(--text3) }
.list-item .count-num { background: var(--accent-light); color: var(--accent); padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600 }
.pagination { display: flex; justify-content: center; gap: 6px; padding: 20px; flex-wrap: wrap }
.pagination button {
  padding: 6px 14px; border: 1px solid var(--border2); border-radius: 6px;
  background: var(--bg2); color: var(--text2); cursor: pointer; font-size: 13px; transition: var(--tr)
}
.pagination button:hover { border-color: var(--accent); color: var(--accent) }
.pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent) }
.pagination button:disabled { opacity: 0.4; cursor: default }
.scan-ui {
  background: var(--card); border-radius: var(--radius-sm); padding: 24px; margin-bottom: 24px;
  border: 1px solid var(--border); backdrop-filter: blur(10px); box-shadow: var(--shadow-sm)
}
.scan-ui h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px }
.scan-ui .hint { color: var(--text3); font-size: 13px; margin-bottom: 12px }
.path-input { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap }
.path-input input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--border2); border-radius: 6px; background: var(--bg2); color: var(--text); font-size: 14px; transition: var(--tr) }
.path-input input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow) }
.path-input button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: var(--tr); color: #fff }
.path-input .btn-start { background: var(--green) }
.path-input .btn-start:hover { opacity: 0.9; transform: translateY(-1px) }
.path-input .btn-stop { background: var(--red) }
.path-input .btn-stop:hover { opacity: 0.9 }
.path-input .btn-clear { background: var(--text3) }
.path-input .btn-clear:hover { opacity: 0.9 }
.scan-progress { margin-top: 12px }
.scan-progress .bar { height: 6px; background: var(--bg4); border-radius: 3px; overflow: hidden }
.scan-progress .bar-inner { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s }
.scan-progress .info { font-size: 12px; color: var(--text3); margin-top: 6px }
.reader-view { max-width: 800px; margin: 0 auto; padding: 0 }
.reader-view .back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; background: var(--accent); color: #fff; border: none;
  border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
  margin-bottom: 20px; transition: var(--tr);
}
.reader-view .back-btn:hover { background: var(--accent2); transform: translateY(-1px) }
.reader-view h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px }
.reader-view h2 { font-size: 15px; color: var(--text2); font-weight: 400; margin-bottom: 20px }
.reader-view .annotation {
  padding: 16px 20px; background: var(--card); border-radius: var(--radius-sm);
  margin-bottom: 20px; line-height: 1.6; color: var(--text2); font-size: 14px;
  border: 1px solid var(--border); box-shadow: var(--shadow-sm)
}
.chapter-nav { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap }
.chapter-nav button {
  padding: 6px 14px; border: 1px solid var(--border2); border-radius: 6px;
  background: var(--bg2); color: var(--text2); cursor: pointer; font-size: 12px; transition: var(--tr)
}
.chapter-nav button:hover { border-color: var(--accent); color: var(--accent) }
.chapter-nav button.active { background: var(--accent); color: #fff; border-color: var(--accent) }
.reader-text {
  background: var(--card); border-radius: var(--radius-sm); padding: 24px 32px;
  line-height: 1.8; font-size: 16px; border: 1px solid var(--border);
  box-shadow: var(--shadow-sm); min-height: 200px
}
.reader-text .chapter-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; color: var(--text) }
@media(max-width:700px){
  .toolbar { padding: 8px 12px; gap: 4px }
  .toolbar .btn { padding: 5px 8px; font-size: 12px; gap: 4px }
  .toolbar .btn span { display: none }
  .toolbar .sep { display: none }
  .search-box input { width: 100px }
  .books-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px }
  .book-cover { height: 170px }
  .content { padding: 12px }
  .reader-text { padding: 16px }
  .stats { gap: 8px }
  .stat-card { padding: 12px 16px; min-width: 80px }
  .stat-card .num { font-size: 22px }
}
</style>
<script src="/static/js/i18n.js"></script>

    <script src="/static/js/mobile.js" defer></script>
  <script src="/static/js/dialogs.js" defer></script>
</head>
<body>
<div class="toolbar">
  <a class="btn" href="/"><i class="fa fa-home"></i><span>Главная</span></a>
  <div class="sep"></div>
  <button class="btn active" data-view="books" onclick="switchView('books')"><i class="fa fa-book"></i><span>Книги</span></button>
  <button class="btn" data-view="genres" onclick="switchView('genres')"><i class="fa fa-tags"></i><span>Жанры</span></button>
  <button class="btn" data-view="authors" onclick="switchView('authors')"><i class="fa fa-users"></i><span>Авторы</span></button>
  <button class="btn" data-view="series" onclick="switchView('series')"><i class="fa fa-list"></i><span>Серии</span></button>
  <button class="btn" data-view="scan" onclick="switchView('scan')"><i class="fa fa-database"></i><span>Сканирование</span></button>
  <div class="spacer"></div>
  <div class="search-box">
    <i class="fa fa-search"></i>
    <input id="searchInput" placeholder="Поиск..." onkeydown="if(event.key==='Enter')searchBooks()">
  </div>
  <div class="sep"></div>
  <a class="btn" href="/books" title="Библиотека"><i class="fa fa-arrow-left"></i><span>Библиотека</span></a>
  <button class="btn" onclick="cycleTheme()" title="Сменить тему"><i class="fa fa-moon" id="themeIcon"></i></button>
</div>

<div class="content" id="mainContent">
  <div class="loading"><div class="spinner"></div>Загрузка...</div>
</div>

<script>
let state = { view: 'books', page: 1, totalPages: 1, loading: false, hasMore: false,
  genreId: null, authorId: null, seriesId: null, search: '', books: [], reading: null,
  chapterIdx: 0, chapters: [] };

// ─── Theme ──────────────────────────────────────────────────
const themes = ['', 'dark', 'sepia', 'warm', 'paper', 'ocean', 'forest', 'midnight'];
let ti = 0;
const saved = localStorage.getItem('collection-theme');
if (saved) { ti = themes.indexOf(saved); if (ti < 0) ti = 0; document.body.className = saved; }
function cycleTheme() {
  ti = (ti + 1) % themes.length;
  document.body.className = themes[ti];
  localStorage.setItem('collection-theme', themes[ti]);
  document.getElementById('themeIcon').className = themes[ti] ? 'fa fa-sun' : 'fa fa-moon';
}
document.getElementById('themeIcon').className = themes[ti] ? 'fa fa-sun' : 'fa fa-moon';

// ─── Navigation ──────────────────────────────────────────────
function switchView(view) {
  state.view = view; state.page = 1; state.genreId = null; state.authorId = null; state.seriesId = null;
  state.search = ''; state.reading = null;
  document.querySelectorAll('.toolbar .btn[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  render();
}

async function render() {
  const el = document.getElementById('mainContent');
  if (state.reading) { renderReader(el); return }
  if (state.loading) { el.innerHTML = '<div class="loading"><div class="spinner"></div><span>Загрузка...</span></div>'; return }
  try {
    switch (state.view) {
      case 'books': await renderBooks(el); break;
      case 'genres': await renderGenres(el); break;
      case 'authors': await renderAuthors(el); break;
      case 'series': await renderSeries(el); break;
      case 'scan': renderScan(el); break;
    }
  } catch (e) { el.innerHTML = '<div class="error">Ошибка: ' + esc(e.message) + '</div>' }
}

// ─── Books View ──────────────────────────────────────────────
async function renderBooks(el) {
  let url = `/api/collection/books?page=${state.page}&page_size=50`;
  if (state.genreId) url += `&genre_id=${state.genreId}`;
  if (state.authorId) url += `&author_id=${state.authorId}`;
  if (state.seriesId) url += `&series_id=${state.seriesId}`;
  if (state.search) url += `&search=${encodeURIComponent(state.search)}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  state.totalPages = d.pages || 1;
  state.hasMore = state.page < state.totalPages;
  state.books = d.books || [];

  let html = '<div class="page-header"><h1>Коллекция Flibusta</h1><div class="subtitle">' + d.total + ' книг в коллекции</div></div>';
  if (state.genreId || state.authorId || state.seriesId) {
    html += '<button class="btn" style="background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;margin-bottom:16px;font-size:13px" onclick="clearFilter()"><i class="fa fa-arrow-left"></i> Все книги</button>';
  }
  html += '<div class="books-grid">';
  for (const b of state.books) {
    const cover = b.has_cover ? '<img src="/api/collection/cover/' + b.id + '" alt="" loading="lazy">' : '<span class="no-cover"><i class="fa fa-book"></i></span>';
    html += '<div class="book-card" onclick="openReader(' + b.id + ')">';
    html += '<div class="book-cover">' + cover + '</div>';
    html += '<div class="book-info"><div class="title">' + esc(b.title) + '</div>';
    html += '<div class="author">' + esc(b.authors || '') + '</div>';
    html += '<div class="meta">' + (b.year || '') + (b.lang ? ' &middot; ' + b.lang : '') + '</div>';
    html += '</div></div>';
  }
  html += '</div>';
  if (state.books.length === 0) html += '<div class="error" style="margin-top:40px">Книги не найдены</div>';
  el.innerHTML = html;
  if (state.hasMore) {
    const div = document.createElement('div');
    div.className = 'load-more';
    div.innerHTML = '<button onclick="loadMore()">Показать ещё</button>';
    el.appendChild(div);
  }
}

function clearFilter() { state.genreId = null; state.authorId = null; state.seriesId = null; state.page = 1; render() }

async function loadMore() {
  state.page++;
  let url = `/api/collection/books?page=${state.page}&page_size=50`;
  if (state.genreId) url += `&genre_id=${state.genreId}`;
  if (state.authorId) url += `&author_id=${state.authorId}`;
  if (state.seriesId) url += `&series_id=${state.seriesId}`;
  if (state.search) url += `&search=${encodeURIComponent(state.search)}`;
  const r = await fetch(url);
  if (!r.ok) return;
  const d = await r.json();
  state.totalPages = d.pages || 1;
  state.hasMore = state.page < state.totalPages;
  state.books = state.books.concat(d.books || []);
  const grid = document.querySelector('.books-grid');
  for (const b of d.books || []) {
    const cover = b.has_cover ? '<img src="/api/collection/cover/' + b.id + '" alt="" loading="lazy">' : '<span class="no-cover"><i class="fa fa-book"></i></span>';
    const card = document.createElement('div');
    card.className = 'book-card';
    card.onclick = function() { openReader(b.id) };
    card.innerHTML = '<div class="book-cover">' + cover + '</div><div class="book-info"><div class="title">' + esc(b.title) + '</div><div class="author">' + esc(b.authors || '') + '</div><div class="meta">' + (b.year || '') + (b.lang ? ' &middot; ' + b.lang : '') + '</div></div>';
    grid.appendChild(card);
  }
  const lm = document.querySelector('.load-more');
  if (lm) {
    if (state.hasMore) lm.innerHTML = '<button onclick="loadMore()">Показать ещё</button>';
    else lm.remove();
  }
}

// ─── Genres View ─────────────────────────────────────────────
async function renderGenres(el) {
  const r = await fetch('/api/collection/genres');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const genres = await r.json();
  let html = '<div class="page-header"><h1>Жанры</h1><div class="subtitle">' + genres.length + ' жанров</div></div>';
  html += '<div class="list-view">';
  for (const g of genres) {
    html += '<div class="list-item" onclick="filterByGenre(' + g.id + ')">';
    html += '<span class="name">' + esc(g.code) + '</span>';
    html += '<span class="count"><span class="count-num">' + g.books_count + '</span></span>';
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function filterByGenre(id) { state.genreId = id; state.view = 'books'; state.page = 1;
  document.querySelectorAll('.toolbar .btn[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'books'));
  render() }

// ─── Authors View ────────────────────────────────────────────
async function renderAuthors(el) {
  const r = await fetch(`/api/collection/authors?page=${state.page}&page_size=50`);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  let html = '<div class="page-header"><h1>Авторы</h1><div class="subtitle">' + d.total + ' авторов</div></div>';
  html += '<div class="list-view">';
  for (const a of d.authors || []) {
    html += '<div class="list-item" onclick="filterByAuthor(' + a.id + ')">';
    html += '<span class="name">' + esc(a.full_name) + '</span>';
    html += '<span class="count"><span class="count-num">' + a.books_count + '</span></span>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="pagination">';
  for (let i = 1; i <= d.pages; i++) {
    html += '<button ' + (i === state.page ? 'class="active"' : '') + ' onclick="authorPage(' + i + ')" ' + (i === state.page ? 'disabled' : '') + '>' + i + '</button>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function filterByAuthor(id) { state.authorId = id; state.view = 'books'; state.page = 1;
  document.querySelectorAll('.toolbar .btn[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'books'));
  render() }

function authorPage(p) { state.page = p; render() }

// ─── Series View ─────────────────────────────────────────────
async function renderSeries(el) {
  const r = await fetch(`/api/collection/series?page=${state.page}&page_size=50`);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  let html = '<div class="page-header"><h1>Серии</h1><div class="subtitle">' + d.total + ' серий</div></div>';
  html += '<div class="list-view">';
  for (const s of d.series || []) {
    html += '<div class="list-item" onclick="filterBySeries(' + s.id + ')">';
    html += '<span class="name">' + esc(s.name) + '</span>';
    html += '<span class="count"><span class="count-num">' + s.books_count + '</span></span>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="pagination">';
  for (let i = 1; i <= d.pages; i++) {
    html += '<button ' + (i === state.page ? 'class="active"' : '') + ' onclick="seriesPage(' + i + ')" ' + (i === state.page ? 'disabled' : '') + '>' + i + '</button>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function filterBySeries(id) { state.seriesId = id; state.view = 'books'; state.page = 1;
  document.querySelectorAll('.toolbar .btn[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'books'));
  render() }

function seriesPage(p) { state.page = p; render() }

// ─── Scan View ───────────────────────────────────────────────
function renderScan(el) {
  el.innerHTML = `
    <div class="page-header"><h1>Сканирование</h1><div class="subtitle">Импорт ZIP-архивов Flibusta</div></div>
    <div class="scan-ui">
      <h3>База данных</h3>
      <div class="hint">Путь к SQLite-файлу коллекции (можно подключить существующий)</div>
      <div class="path-input">
        <input id="dbPath" placeholder="E:\reader\flibusta.db" value="">
        <button class="btn-start" onclick="setDbPath()"><i class="fa fa-check"></i> Применить</button>
        <button class="btn-clear" onclick="resetDbPath()"><i class="fa fa-undo"></i> Сброс</button>
      </div>
      <div id="dbPathInfo" style="font-size:12px;color:var(--text3);margin-bottom:16px"></div>
    </div>
    <div class="scan-ui">
      <h3>Путь к архивам</h3>
      <div class="hint">Укажите папку с ZIP-файлами, содержащими FB2-книги</div>
      <div class="path-input">
        <input id="scanPath" placeholder="E:\reader\flibusta\" value="">
        <button class="btn-start" onclick="startScan()"><i class="fa fa-play"></i> Запустить</button>
        <button class="btn-stop" onclick="stopScan()"><i class="fa fa-stop"></i> Стоп</button>
        <button class="btn-clear" onclick="clearScan()"><i class="fa fa-trash"></i> Сброс</button>
      </div>
      <div class="scan-progress">
        <div class="bar"><div class="bar-inner" id="scanBar" style="width:0%"></div></div>
        <div class="info" id="scanInfo">Ожидание...</div>
      </div>
    </div>
    <div id="scanStats"></div>`;
  loadDbPath();
  loadScanStatus();
}

async function loadDbPath() {
  try {
    const r = await fetch('/api/collection/db/path');
    const d = await r.json();
    document.getElementById('dbPath').value = d.path;
    document.getElementById('dbPathInfo').textContent = (d.override ? 'Подключена внешняя БД' : 'БД по умолчанию') + ' | файлов: ' + os.path.basename(d.path);
  } catch(e) {}
}

async function setDbPath() {
  const raw = document.getElementById('dbPath').value;
  const path = raw.trim();
  console.log('Sending path:', JSON.stringify(path));
  console.log('Path chars:', path.split('').map(function(c){return c.charCodeAt(0)}));
  if (!path) return;
  try {
    const r = await fetch('/api/collection/db/path', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({path}) });
    const d = await r.json();
    if (d.error) { alert('Ошибка: ' + d.error + '\n\nПуть: ' + path); return }
    document.getElementById('dbPathInfo').textContent = 'Подключена: ' + d.path;
    // Reload stats
    updateScanStats(document.getElementById('scanStats'));
  } catch(e) { alert('Ошибка: ' + e.message) }
}

async function resetDbPath() {
  try {
    const r = await fetch('/api/collection/db/path', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({path: ''}) });
    await r.json();
    loadDbPath();
    updateScanStats(document.getElementById('scanStats'));
  } catch(e) {}
}
var os = { basename: function(p) { var parts = p.replace(/\\/g,'/').split('/'); return parts[parts.length-1] || p; } };

async function loadScanStatus() {
  try {
    const r = await fetch('/api/collection/scan/status');
    const d = await r.json();
    const bar = document.getElementById('scanBar');
    const info = document.getElementById('scanInfo');
    const statsEl = document.getElementById('scanStats');
    if (d.running) {
      const pct = d.total_archives > 0 ? Math.round(d.processed_archives / d.total_archives * 100) : 0;
      bar.style.width = pct + '%';
      info.textContent = (d.processed_archives || 0) + '/' + (d.total_archives || 0) + ' архивов · ' + (d.total_books || 0) + ' книг' + (d.current_archive ? ' · ' + d.current_archive : '');
      setTimeout(loadScanStatus, 1000);
    } else if (d.status === 'completed') {
      bar.style.width = '100%';
      info.textContent = 'Сканирование завершено!';
      updateScanStats(statsEl);
    } else if (d.status === 'error') {
      info.textContent = 'Ошибка сканирования';
    } else if (d.status === 'stopped') {
      info.textContent = 'Сканирование остановлено';
    } else {
      info.textContent = 'Ожидание...';
      bar.style.width = '0%';
      updateScanStats(statsEl);
    }
  } catch (e) {}
}

async function updateScanStats(el) {
  try {
    const r = await fetch('/api/collection/stats');
    const d = await r.json();
    if (d.error) { el.innerHTML = '<div style="color:var(--red);padding:10px">Ошибка: ' + esc(d.error) + '</div>'; return }
    el.innerHTML = '<div class="stats"><div class="stat-card"><div class="num">' + (d.books||0) + '</div><div class="label">Книг</div></div><div class="stat-card"><div class="num">' + (d.authors||0) + '</div><div class="label">Авторов</div></div><div class="stat-card"><div class="num">' + (d.genres||0) + '</div><div class="label">Жанров</div></div><div class="stat-card"><div class="num">' + (d.series||0) + '</div><div class="label">Серий</div></div><div class="stat-card"><div class="num">' + (d.archives||0) + '</div><div class="label">Архивов</div></div></div>';
  } catch (e) { el.innerHTML = '<div style="color:var(--red);padding:10px">Ошибка: ' + e.message + '</div>' }
}

async function startScan() {
  const path = document.getElementById('scanPath').value.trim();
  if (!path) { alert('Укажите путь к папке с архивами'); return }
  try {
    const r = await fetch('/api/collection/scan/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path, parallel: true, store_content: true }) });
    const d = await r.json();
    if (d.started) loadScanStatus(); else alert('Сканирование уже запущено');
  } catch (e) { alert('Ошибка: ' + e.message) }
}

async function stopScan() { try { await fetch('/api/collection/scan/stop', { method: 'POST' }); loadScanStatus() } catch (e) {} }
async function clearScan() { if (!confirm('Сбросить прогресс сканирования?')) return; try { await fetch('/api/collection/scan/clear', { method: 'POST' }); loadScanStatus() } catch (e) {} }

// ─── Search ──────────────────────────────────────────────────
function searchBooks() {
  const q = document.getElementById('searchInput').value.trim();
  state.search = q; state.page = 1; state.view = 'books'; state.genreId = null; state.authorId = null; state.seriesId = null;
  document.querySelectorAll('.toolbar .btn[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'books'));
  render();
}

// ─── Reader ──────────────────────────────────────────────────
async function openReader(bookId) {
  state.loading = true; render();
  try {
    const r = await fetch('/api/collection/read/' + bookId);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    state.reading = d; state.chapters = d.chapters || []; state.chapterIdx = 0;
  } catch (e) { alert('Ошибка загрузки: ' + e.message) }
  state.loading = false; render();
}

function closeReader() { state.reading = null; state.chapters = []; state.chapterIdx = 0; render() }
function goChapter(i) { state.chapterIdx = i; render() }

function renderReader(el) {
  const b = state.reading;
  if (!b) { switchView('books'); return }
  const ch = state.chapters;
  const idx = state.chapterIdx;
  const cur = ch[idx] || { title: '', text: '' };
  let html = '<div class="reader-view">';
  html += '<button class="back-btn" onclick="closeReader()"><i class="fa fa-arrow-left"></i> Назад к списку</button>';
  html += '<h1>' + esc(b.title) + '</h1>';
  html += '<h2>' + esc(b.author || '') + '</h2>';
  if (b.annotation) html += '<div class="annotation">' + esc(b.annotation) + '</div>';
  html += '<div class="chapter-nav">';
  for (let i = 0; i < ch.length; i++) {
    html += '<button class="' + (i === idx ? 'active' : '') + '" onclick="goChapter(' + i + ')">' + esc(ch[i].title || 'Глава ' + (i + 1)) + '</button>';
  }
  html += '</div>';
  html += '<div class="reader-text">';
  if (cur.title && cur.title !== 'Текст') html += '<div class="chapter-title">' + esc(cur.title) + '</div>';
  html += cur.text.replace(/\n/g, '<br>');
  html += '</div></div>';
  el.innerHTML = html;
}

// ─── Utils ───────────────────────────────────────────────────
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML }

// ─── Init ────────────────────────────────────────────────────
function handleHash() {
  const hash = window.location.hash.replace('#', '');
  if (['genres', 'authors', 'series', 'scan'].includes(hash)) switchView(hash);
}
window.addEventListener('hashchange', handleHash);
if (window.location.hash) handleHash(); else render();
</script>
</body>
</html>
