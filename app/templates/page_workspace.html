<!DOCTYPE html>
<html class="pg-page_workspace" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рабочее пространство</title>
<link rel="stylesheet" href="/static/css/font-awesome.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter','SF Pro Display',-apple-system,sans-serif }

:root {
  --bg: #f7f8fa; --bg2: #ffffff; --bg3: #f1f3f6; --bg4: #e7eaef;
  --border: rgba(0,0,0,0.06); --border2: rgba(0,0,0,0.1);
  --text: #1a1f26; --text2: #5a6472; --text3: #8b95a3;
  --accent: #3b6ef5; --accent2: #2d55c9;
  --accent-light: rgba(59,110,245,0.09);
  --accent-glow: rgba(59,110,245,0.15);
  --hover: rgba(15,23,42,0.04);
  --active: rgba(15,23,42,0.07);
  --red: #d64545; --green: #1f9254; --amber: #c98a12;
  --radius: 12px; --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16,24,40,0.05);
  --shadow-md: 0 4px 14px rgba(16,24,40,0.07);
  --shadow-lg: 0 16px 44px rgba(16,24,40,0.13);
  --glass: rgba(255,255,255,0.9);
  --panel: #ffffff;
  --canvas-bg: #eef0f4;
  --ws-top-h: 52px;   /* высота верхней панели — от неё отступает холст */
}
/* Тёмная тема.
   ВАЖНО: theme.js не добавляет класс "dark" на <body> (dark — базовое
   состояние :root), а ставит атрибут data-theme на <html> и доливает
   переменные инлайном на body. Поэтому ориентируемся на [data-theme],
   а не на body.dark — иначе правила просто не срабатывали бы. */
[data-theme="dark"] body,
body.dark, body.midnight {
  --bg: #0f1319; --bg2: #161b23; --bg3: #1d232d; --bg4: #262d39;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.12);
  --text: #e6eaf0; --text2: #9aa5b4; --text3: #6b7686;
  --accent: #5b8cff; --accent2: #3f7ae0;
  --accent-light: rgba(91,140,255,0.14);
  --accent-glow: rgba(91,140,255,0.22);
  --hover: rgba(255,255,255,0.05); --active: rgba(255,255,255,0.08);
  --red: #ff6b6b; --green: #3ecf8e; --amber: #e5a13a;
  --shadow: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.35);
  --shadow-lg: 0 16px 44px rgba(0,0,0,0.5);
  --glass: rgba(22,27,35,0.92);
  --panel: #161b23;
  --canvas-bg: #0d1117;
}
[data-theme="midnight"] body, body.midnight {
  --bg: #08090f; --bg2: #0e1018; --bg3: #141824; --bg4: #1c2130;
  --canvas-bg: #05060a;
}
[data-theme="sepia"] body, [data-theme="paper"] body {
  --bg: #f4ecd8; --bg2: #fbf6ea; --bg3: #ece1ca; --bg4: #e0d3b6;
  --border: #ded0b2; --border2: #cbb894; --text: #4a3a28;
  --text2: #6d5b46; --text3: #94806a;
}

/* Холст живёт под верхней панелью: иначе она перекрывала бы верх рисунка */
#c {
  display: block;
  position: fixed;
  top: var(--ws-top-h);
  left: 0; right: 0; bottom: 0;
}

/* Top bar */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--ws-top-h); z-index: 1000; pointer-events: auto;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
}
.top-bar .back-link {
  background: none; border: none; color: var(--text2); padding: 6px 10px;
  border-radius: var(--radius-sm); cursor: pointer; font-size: 12px;
  font-weight: 500; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, color .15s;
}
.top-bar .back-link:hover { background: var(--hover); color: var(--text) }
.top-bar .title {
  font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.top-bar .title i { color: var(--accent); font-size: 14px }
.top-bar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px }
.top-bar .btn {
  background: transparent; border: 1px solid transparent;
  color: var(--text2); padding: 6px 10px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 5px;
  font-family: inherit; transition: background .15s, color .15s;
}
.top-bar .btn:hover { background: var(--hover); color: var(--text) }
.top-bar .btn.on { background: var(--accent-light); color: var(--accent) }
.top-bar .save-ind { color: var(--green); font-size: 11px; opacity: 0; transition: opacity .3s }
.top-bar .note-count { color: var(--text3); font-size: 11px }

/* Floating drawing toolbar */
/* Компактная панель инструментов: сетка 2×N вместо длинной ленты.
   Один столбец тянулся на весь экран — инструменты терялись внизу. */
.draw-toolbar {
  position: fixed; left: 12px; top: calc(var(--ws-top-h) + 12px);
  z-index: 1000;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px;
  display: grid; grid-template-columns: repeat(2, 30px);
  gap: 3px; justify-content: center;
  box-shadow: var(--shadow-md);
  max-height: calc(100vh - var(--ws-top-h) - 130px);
  overflow-y: auto; overflow-x: hidden;
  transition: padding .2s, width .2s;
}
/* при сворачивании остаётся только один столбец активных кнопок */
.draw-toolbar.collapsed { grid-template-columns: 30px; }
.draw-toolbar.collapsed .dt-secondary,
.draw-toolbar.collapsed .dt-sep,
.draw-toolbar.collapsed .dt-head,
.draw-toolbar.collapsed .draw-toolbar .color-row,
.draw-toolbar.collapsed .size-row { display: none; }
.draw-toolbar::-webkit-scrollbar { width: 4px; height: 4px }
.draw-toolbar::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px }

.draw-toolbar button {
  width: 30px; height: 30px; border: none; background: transparent;
  border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  color: var(--text2); transition: background .12s, color .12s;
  font-family: inherit; padding: 0;
}
.draw-toolbar button:hover { background: var(--hover); color: var(--text) }
/* было #e8eaff — хардкод, в тёмной теме подсветка была не видна */
.draw-toolbar button.active { background: var(--accent); color: #fff }
.draw-toolbar button:disabled { opacity: .3; cursor: default; background: transparent }
/* разделитель групп занимает всю ширину сетки */
.draw-toolbar .dt-sep {
  grid-column: 1 / -1; height: 1px; background: var(--border);
  margin: 3px 2px;
}
/* кнопка свернуть/развернуть шапки */
.draw-toolbar .collapse-btn {
  grid-column: 1 / -1; width: 100%; height: 24px;
  border: none; background: transparent; border-radius: 6px;
  cursor: pointer; font-size: 12px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  color: var(--text3); transition: background .15s, color .15s;
  font-family: inherit;
}
.draw-toolbar .collapse-btn:hover { background: var(--hover); color: var(--text) }

/* всплывающие настройки фигуры */
.dt-style {
  grid-column: 1 / -1;
  display: flex; flex-direction: column; gap: 5px;
  padding: 5px 2px 2px;
}
.dt-style .color-row { display: flex; gap: 4px; justify-content: center }
.dt-style .color-row input[type="color"] {
  width: 26px; height: 22px; border: 1px solid var(--border2);
  border-radius: 5px; cursor: pointer; padding: 0; background: none;
}
.dt-style .size-row {
  display: flex; align-items: center; gap: 4px; justify-content: center;
}
.dt-style .size-row input[type="range"] {
  width: 44px; height: 3px; accent-color: var(--accent); cursor: pointer;
}
.dt-style .size-row span {
  font-size: 10px; color: var(--text3); min-width: 15px; text-align: center;
  font-variant-numeric: tabular-nums;
}

/* Bottom bar */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 1000; pointer-events: auto;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; align-items: flex-end; gap: 10px;
  transition: all .3s cubic-bezier(0.34,1.56,0.64,1);
}
.bottom-bar.pos-left {
  bottom: auto; top: 50%; transform: translateY(-50%);
  left: 0; right: auto; width: 300px; max-height: 40vh;
  border-top: none; border-right: 1px solid var(--border);
  flex-direction: column; align-items: stretch;
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 12px;
}
.bottom-bar.pos-right {
  bottom: auto; top: 50%; transform: translateY(-50%);
  right: 0; left: auto; width: 300px; max-height: 40vh;
  border-top: none; border-left: 1px solid var(--border);
  flex-direction: column; align-items: stretch;
  border-radius: var(--radius) 0 0 var(--radius);
  padding: 12px;
}
.bottom-bar .pos-toggle {
  display: flex; gap: 2px; align-items: center;
}
.bottom-bar .pos-toggle button {
  width: 26px; height: 26px; border: none; background: transparent;
  border-radius: 5px; cursor: pointer; font-size: 11px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  color: var(--text3); transition: background .15s, color .15s;
}
.bottom-bar .pos-toggle button:hover { background: var(--hover); color: var(--text) }
.bottom-bar .pos-toggle button.active { background: var(--accent-light); color: var(--accent) }
.bottom-bar .input-wrap {
  flex: 1; display: flex; flex-direction: column; gap: 4px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 12px;
  transition: border-color .2s;
}
.bottom-bar .input-wrap:focus-within { border-color: var(--accent) }
.bottom-bar .input-wrap textarea {
  border: none; background: none; resize: none;
  font-size: 14px; color: var(--text); outline: none;
  font-family: inherit; min-height: 24px; max-height: 120px;
  line-height: 1.5;
}
.bottom-bar .input-wrap textarea::placeholder { color: var(--text3) }
.bottom-bar .input-actions {
  display: flex; gap: 8px; align-items: center;
}
.bottom-bar .input-actions .mode-hint {
  font-size: 11px; color: var(--text3);
  display: flex; align-items: center; gap: 6px;
}
.bottom-bar .input-actions .mode-hint i { font-size: 10px; color: var(--accent) }
.bottom-bar .btn {
  padding: 8px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg2);
  color: var(--text); cursor: pointer; font-size: 13px;
  font-weight: 500; font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, color .15s, border-color .15s; white-space: nowrap;
}
.bottom-bar .btn:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent) }
.bottom-bar .btn.primary {
  background: var(--accent); border-color: transparent; color: #fff;
}
.bottom-bar .btn.primary:hover { background: var(--accent2); color: #fff; border-color: transparent }

/* Chat messages panel */
.chat-panel {
  position: fixed; bottom: 96px; right: 16px;
  width: 400px; max-height: 50vh;
  z-index: 999; pointer-events: auto;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  display: none; flex-direction: column;
  overflow: hidden;
  animation: slideUp .2s cubic-bezier(0.4,0,0.2,1);
}
.chat-panel.open { display: flex }
.chat-panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  font-weight: 600; font-size: 13px; color: var(--text);
}
.chat-panel-header i { color: var(--accent) }
.chat-panel-header button {
  margin-left: auto; background: none; border: none;
  color: var(--text3); cursor: pointer; font-size: 14px; padding: 4px 8px;
  border-radius: var(--radius-sm);
}
.chat-panel-header button:hover { background: var(--hover); color: var(--text) }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  max-height: 300px; font-size: 13px; line-height: 1.6;
}
.chat-msg {
  max-width: 88%; padding: 9px 13px; border-radius: 12px;
  font-size: 13px; line-height: 1.6; margin-bottom: 8px;
}
.chat-msg.user {
  align-self: flex-end;
  background: var(--accent); color: #fff;
  border-bottom-right-radius: 4px; margin-left: auto;
}
.chat-msg.ai {
  align-self: flex-start;
  background: var(--bg3); color: var(--text);
  border-bottom-left-radius: 4px;
}
.chat-msg.system {
  align-self: center; color: var(--text3);
  font-size: 11px; font-style: italic; background: none; padding: 4px;
}
.chat-msg .typing { display: flex; gap: 4px; align-items: center }
.chat-msg .typing span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text3); animation: typing 1.4s infinite;
}
.chat-msg .typing span:nth-child(2) { animation-delay: .2s }
.chat-msg .typing span:nth-child(3) { animation-delay: .4s }
@keyframes typing { 0%,60%,100% { opacity: 0.3 } 30% { opacity: 1 } }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }

/* Chat panel input */
.chat-panel-input {
  padding: 8px 12px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end;
  background: var(--bg2); border-radius: 0 0 var(--radius) var(--radius);
}
.chat-panel-input textarea {
  flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none;
  resize: none; background: var(--bg); color: var(--text); min-height: 36px;
}
.chat-panel-input textarea:focus { border-color: var(--accent) }
.chat-panel-input button {
  padding: 8px 14px; border-radius: var(--radius-sm);
  border: none; background: var(--accent); color: #fff; cursor: pointer;
  font-size: 15px; min-height: 36px;
}
.chat-panel-input button:hover { background: var(--accent2) }

/* Note detail panel */
.detail-panel {
  position: fixed; right: -480px; top: 0; width: 480px; height: 100vh;
  z-index: 2000; pointer-events: auto;
  background: var(--bg2);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  transition: right .3s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.detail-panel.open { right: 0 }
.detail-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.detail-header h3 { flex: 1; font-size: 16px; font-weight: 700; color: var(--text) }
.detail-header h3 i { color: var(--accent); font-size: 16px }
.detail-header button {
  background: none; border: none; color: var(--text3);
  cursor: pointer; font-size: 16px; padding: 6px 10px;
  border-radius: var(--radius-sm);
}
.detail-header button:hover { background: var(--hover); color: var(--text) }
.detail-body {
  flex: 1; overflow-y: auto; padding: 20px;
  font-size: 14px; line-height: 1.7;
}
.detail-body .note-title {
  font-size: 22px; font-weight: 700; margin-bottom: 16px; color: var(--text);
}
.detail-body .note-meta {
  font-size: 12px; color: var(--text3); margin-bottom: 16px;
  display: flex; gap: 12px; flex-wrap: wrap;
}
.detail-body .note-content { line-height: 1.8; }
.detail-body .note-content h1 { font-size: 24px; margin: 20px 0 10px }
.detail-body .note-content h2 { font-size: 20px; margin: 16px 0 8px }
.detail-body .note-content h3 { font-size: 17px; margin: 12px 0 6px }
.detail-body .note-content p { margin-bottom: 10px }
.detail-body .note-content code {
  background: var(--bg3); padding: 2px 6px; border-radius: 4px; font-size: 13px;
}
.detail-body .note-content pre {
  background: var(--bg); padding: 16px; border-radius: var(--radius-sm);
  overflow-x: auto; margin: 12px 0; border: 1px solid var(--border);
}
.detail-body .note-content pre code { background: none; padding: 0 }
.detail-body .note-content img { max-width: 100%; border-radius: var(--radius-sm); margin: 10px 0 }
.detail-body .attachments { margin-top: 20px }
.detail-body .attachments h4 { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 10px; display: flex; align-items: center; gap: 6px }
.detail-body .attachments .att-grid { display: flex; gap: 8px; flex-wrap: wrap }
.detail-body .attachments .att-item {
  width: 72px; height: 72px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); overflow: hidden; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3); font-size: 24px; color: var(--accent);
  transition: all .2s;
}
.detail-body .attachments .att-item:hover { border-color: var(--accent); transform: scale(1.05) }
.detail-body .attachments .att-item img { width: 100%; height: 100%; object-fit: cover }
.detail-footer {
  padding: 12px 20px; border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.detail-footer button {
  flex: 1; padding: 10px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg2);
  color: var(--text); cursor: pointer; font-size: 13px;
  font-weight: 500; font-family: inherit; transition: all .2s;
}
.detail-footer button:hover { border-color: var(--accent); color: var(--accent) }
.detail-footer button.primary {
  background: var(--accent);
  border-color: transparent; color: #fff;
}
.detail-footer button.primary:hover { background: var(--accent2); color: #fff }

/* Loading */
.loading {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px; color: var(--text2);
  background: var(--bg);
}
.spinner { width: 40px; height: 40px; border: 3px solid var(--bg4); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }

/* Toast */
.toast {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 18px;
  box-shadow: var(--shadow-lg); min-width: 280px;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; animation: slideIn .3s cubic-bezier(0.34,1.56,0.64,1);
  cursor: pointer;
}
.toast.success { border-left: 3px solid var(--green) }
.toast.error { border-left: 3px solid var(--red) }
.toast.info { border-left: 3px solid var(--accent) }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0 } to { transform: translateX(0); opacity: 1 } }

/* Note context menu */
.note-context-menu {
  position: fixed; z-index: 7000; min-width: 190px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  padding: 4px; display: none; font-size: 13px;
}
.note-context-menu.open { display: block }
.note-context-menu .ctx-item {
  padding: 7px 12px; cursor: pointer; border-radius: 6px;
  display: flex; align-items: center; gap: 8px; color: var(--text);
  transition: background .1s;
}
.note-context-menu .ctx-item:hover { background: var(--bg3) }
.note-context-menu .ctx-item i { width: 16px; color: var(--text2); font-size: 12px }
.note-context-menu .ctx-item.danger { color: var(--red) }
.note-context-menu .ctx-item.danger i { color: var(--red) }
.note-context-menu .ctx-sep { height: 1px; background: var(--border); margin: 3px 4px }

/* Welcome hint — раньше стили задавались инлайном в React,
   из-за чего подсказка не подхватывала тёмную тему */
.welcome-hint {
  position: fixed; bottom: 118px; left: 50%; transform: translateX(-50%);
  z-index: 999;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 13px; color: var(--text2);
  display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow-md);
  transition: opacity .6s;
}
.welcome-hint i { color: var(--accent) }
.welcome-hint button {
  background: none; border: none; cursor: pointer;
  color: var(--text3); font-size: 14px; padding: 2px 4px;
  border-radius: 4px;
}
.welcome-hint button:hover { background: var(--hover); color: var(--text) }

@media (max-width: 768px) {
  .chat-panel { width: calc(100% - 16px); right: 8px; max-height: 300px }
  .detail-panel { width: 100% }
  .bottom-bar { flex-wrap: wrap }
  .top-bar { font-size: 12px; padding: 6px 10px }
  .draw-toolbar { left: 8px; padding: 4px }
  .draw-toolbar button { width: 30px; height: 30px; font-size: 13px }
}
/* Inline editor overlay */
.note-inline-editor {
  position: fixed; z-index: 5000;
  background: var(--bg2); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
  display: none; flex-direction: column;
