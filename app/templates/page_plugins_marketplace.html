<!DOCTYPE html>
<html class="pg-page_plugins_marketplace" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASIO Plugins & Marketplace</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#c9d1d9;--text2:#8b949e;--accent:#58a6ff;--purple:#8b5cf6;--green:#238636;--orange:#f97316;--red:#da3633;--gradient:linear-gradient(135deg,#58a6ff,#8b5cf6)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

.topnav{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px}
.topnav .logo{font-size:18px;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topnav .back{padding:6px 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:12px;text-decoration:none}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:6px 14px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:12px;font-weight:600}
.tab.active{background:var(--gradient);border-color:transparent;color:#fff}

.container{display:flex;height:calc(100vh - 52px)}
.sidebar{width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-header h3{font-size:14px}
.sidebar-content{flex:1;overflow-y:auto;padding:16px}

.main{flex:1;overflow-y:auto;padding:20px}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.section{margin-bottom:24px}
.section h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}

.plugin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.plugin-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;transition:all .2s}
.plugin-card:hover{border-color:var(--accent)}
.plugin-card .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.plugin-card .name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.plugin-card .version{font-size:10px;padding:2px 6px;background:var(--bg3);border-radius:4px;color:var(--text2)}
.plugin-card .desc{font-size:12px;color:var(--text2);margin-bottom:8px}
.plugin-card .meta{display:flex;gap:12px;font-size:10px;color:var(--text3)}
.plugin-card .status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.plugin-card .status.enabled{background:var(--green);color:#fff}
.plugin-card .status.disabled{background:var(--bg3);color:var(--text2)}
.plugin-card .status.error{background:var(--red);color:#fff}
.plugin-card .actions{margin-top:8px;display:flex;gap:6px}
.plugin-card .actions button{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-size:10px;font-weight:600}
.plugin-card .actions button:hover{border-color:var(--accent)}
.plugin-card .actions button.primary{background:var(--gradient);border-color:transparent;color:#fff}

.marketplace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.marketplace-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s}
.marketplace-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.marketplace-card .name{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.marketplace-card .author{font-size:10px;color:var(--text2);margin-bottom:6px}
.marketplace-card .desc{font-size:12px;color:var(--text2);margin-bottom:8px}
.marketplace-card .stats{display:flex;gap:12px;font-size:10px;color:var(--text3)}
.marketplace-card .tags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.marketplace-card .tag{padding:2px 6px;background:var(--bg3);border-radius:4px;font-size:9px;color:var(--text2)}

.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-content{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:90%;max-width:600px;max-height:90vh;overflow-y:auto;padding:20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h3{font-size:16px}
.modal-close{background:none;border:none;color:var(--text2);font-size:24px;cursor:pointer}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:100px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal-footer button{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-size:12px;font-weight:600}
.modal-footer button.primary{background:var(--gradient);border-color:transparent;color:#fff}

.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-bar input,.filter-bar select{padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--accent)}

.page{display:none}
.page.active{display:block}
</style>
<script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="/static/js/mobile.js" defer></script>
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
  <script src="/static/js/dialogs.js" defer></script>
</head>
<body>
<nav class="topnav">
  <a href="/agent" class="back"><i class="fa-solid fa-arrow-left"></i> К агенту</a>
  <div class="logo"><i class="fa-solid fa-plug"></i> Plugins & Marketplace</div>
  <div class="tabs">
    <div class="tab active" onclick="switchPage('plugins')">Плагины</div>
    <div class="tab" onclick="switchPage('marketplace')">Marketplace</div>
    <div class="tab" onclick="switchPage('publish')">Опубликовать</div>
  </div>
</nav>

<div id="pluginsPage" class="page active">
  <div class="main">
    <div class="section">
      <h2>🔌 Установленные плагины</h2>
      <div class="plugin-grid" id="pluginsGrid"></div>
    </div>
  </div>
</div>

<div id="marketplacePage" class="page">
  <div class="main">
    <div class="section">
      <h2>🛒 Marketplace навыков</h2>
      <div class="filter-bar">
        <input type="text" placeholder="Поиск..." id="searchSkills">
        <select id="categoryFilter"><option value="">Все категории</option></select>
        <button onclick="loadMarketplace()">🔍 Найти</button>
      </div>
      <div class="marketplace-grid" id="marketplaceGrid"></div>
    </div>
  </div>
</div>

<div id="publishPage" class="page">
  <div class="main" style="max-width:600px">
    <div class="section">
      <h2>📤 Опубликовать навык</h2>
      <div class="form-group">
        <label>Название</label>
        <input type="text" id="pubName" placeholder="my_awesome_tool">
      </div>
      <div class="form-group">
        <label>Версия</label>
        <input type="text" id="pubVersion" value="1.0.0">
      </div>
      <div class="form-group">
        <label>Описание</label>
        <input type="text" id="pubDesc" placeholder="Описание навыка">
      </div>
      <div class="form-group">
        <label>Автор</label>
        <input type="text" id="pubAuthor" value="me">
      </div>
      <div class="form-group">
        <label>Категория</label>
        <select id="pubCategory">
          <option value="utility">Утилита</option>
          <option value="web">Веб</option>
          <option value="data">Данные</option>
          <option value="ai">AI</option>
          <option value="dev">Разработка</option>
        </select>
      </div>
      <div class="form-group">
        <label>Код (Python)</label>
        <textarea id="pubCode" rows="10" placeholder="def my_tool():\n    pass"></textarea>
      </div>
      <div class="form-group">
        <label>Теги (через запятую)</label>
        <input type="text" id="pubTags" placeholder="web, scraper, api">
      </div>
      <div class="modal-footer">
        <button class="primary" onclick="publishSkill()">📤 Опубликовать</button>
      </div>
    </div>
  </div>
</div>

<script>
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  
  if (page === 'plugins') {
    document.getElementById('pluginsPage').classList.add('active');
  } else if (page === 'marketplace') {
    document.getElementById('marketplacePage').classList.add('active');
    loadMarketplace();
  } else {
    document.getElementById('publishPage').classList.add('active');
  }
  
  event.target.classList.add('active');
}

async function loadPlugins() {
  try {
    const res = await fetch('/api/agent/plugins');
    const data = await res.json();
    const plugins = data.plugins || [];
    
    if (plugins.length === 0) {
      document.getElementById('pluginsGrid').innerHTML = '<div style="color:var(--text2);padding:20px">Нет плагинов. Создайте файл в ~/.infinity/asio_agent/plugins/</div>';
      return;
    }
    
    document.getElementById('pluginsGrid').innerHTML = plugins.map(p => `
      <div class="plugin-card">
        <div class="header">
          <div class="name">📦 ${p.name}</div>
          <span class="version">${p.version}</span>
        </div>
        <div class="desc">${p.description || ''}</div>
        <div class="meta">
          <span>Автор: ${p.author || '-'}</span>
          <span>Хуки: ${(p.hooks || []).join(', ') || '-'}</span>
        </div>
        <div style="margin-top:6px">
          <span class="status ${p.enabled ? 'enabled' : 'disabled'}">${p.enabled ? '✅ Включен' : '❌ Отключен'}</span>
          ${p.error ? `<span class="status error">⚠️ ${p.error}</span>` : ''}
        </div>
        <div class="actions">
          <button class="primary" onclick="togglePlugin('${p.name}', ${!p.enabled})">${p.enabled ? 'Отключить' : 'Включить'}</button>
          <button onclick="reloadPlugin('${p.name}')">🔄 Перезагрузить</button>
        </div>
      </div>
    `).join('');
  } catch(e) {
    console.error('Load plugins error:', e);
  }
}

async function togglePlugin(name, enable) {
  try {
    await fetch(`/api/agent/plugins/${encodeURIComponent(name)}/enable`, { method: 'POST' });
    loadPlugins();
  } catch(e) {
    alert('Ошибка: ' + e.message);
  }
}

async function reloadPlugin(name) {
  try {
    await fetch(`/api/agent/plugins/${encodeURIComponent(name)}/reload`, { method: 'POST' });
    loadPlugins();
  } catch(e) {
    alert('Ошибка: ' + e.message);
  }
}

async function loadMarketplace() {
  const query = document.getElementById('searchSkills').value;
  const category = document.getElementById('categoryFilter').value;
  
  try {
    const res = await fetch(`/api/agent/marketplace/skills?query=${query}&category=${category}`);
    const data = await res.json();
    const skills = data.skills || [];
    
    if (skills.length === 0) {
      document.getElementById('marketplaceGrid').innerHTML = '<div style="color:var(--text2);padding:20px">Нет навыков</div>';
      return;
    }
    
    document.getElementById('marketplaceGrid').innerHTML = skills.map(s => `
      <div class="marketplace-card" onclick="installSkill('${s.package_id}')">
        <div class="name">🔧 ${s.name}</div>
        <div class="author">${s.author} · v${s.version}</div>
        <div class="desc">${s.description}</div>
        <div class="stats">
          <span>⬇️ ${s.downloads || 0}</span>
          <span>⭐ ${(s.rating || 0).toFixed(1)}</span>
          <span>${s.category}</span>
        </div>
        ${s.tags ? `<div class="tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
      </div>
    `).join('');
  } catch(e) {
    console.error('Load marketplace error:', e);
  }
}

async function installSkill(packageId) {
  if (!confirm('Установить этот навык?')) return;
  
  try {
    const res = await fetch('/api/agent/marketplace/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ package_id: packageId })
    });
    const data = await res.json();
    if (data.ok) {
      alert('✅ Навык установлен!');
    } else {
      alert('❌ Ошибка установки');
    }
  } catch(e) {
    alert('Ошибка: ' + e.message);
  }
}

async function publishSkill() {
  const data = {
    name: document.getElementById('pubName').value,
    version: document.getElementById('pubVersion').value,
    description: document.getElementById('pubDesc').value,
    author: document.getElementById('pubAuthor').value,
    code: document.getElementById('pubCode').value,
    category: document.getElementById('pubCategory').value,
    tags: document.getElementById('pubTags').value.split(',').map(t => t.trim()).filter(t => t)
  };
  
  if (!data.name || !data.code) {
    alert('Заполните название и код');
    return;
  }
  
  try {
    const res = await fetch('/api/agent/marketplace/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (result.ok) {
      alert('✅ Навык опубликован!');
      document.getElementById('pubName').value = '';
      document.getElementById('pubCode').value = '';
    } else {
      alert('❌ Ошибка: ' + (result.error || 'Неизвестная'));
    }
  } catch(e) {
    alert('Ошибка: ' + e.message);
  }
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  loadPlugins();
  loadCategories();
});

async function loadCategories() {
  try {
    const res = await fetch('/api/agent/marketplace/categories');
    const data = await res.json();
    const cats = data.categories || [];
    const select = document.getElementById('categoryFilter');
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      select.appendChild(opt);
    });
  } catch(e) {}
}
</script>
</body>
</html>
