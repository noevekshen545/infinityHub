// ========== PROGRESS CHART ==========
function showProgressChart(c){
  const p=c.progress||{};
  const ls=c.plan?.lessons||[];
  const total=ls.length||1;
  const done=p.completed_lessons?.length||0;
  const pct=Math.round(done/total*100);
  const scores=p.quiz_scores||[];
  const avg=scores.length?scores.reduce((a,b)=>a+b.score,0)/scores.length:0;

  let html='<div style="text-align:center">';
  // Donut chart
  const r=50;const circ=2*Math.PI*r;
  const fillLen=circ*pct/100;
  const gapLen=circ-fillLen;
  html+=`<svg width="140" height="140" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--bg4)" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12"
      stroke-dasharray="${fillLen} ${gapLen}" transform="rotate(-90 60 60)" style="transition:stroke-dasharray 0.5s"/>
    <text x="60" y="55" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text)">${pct}%</text>
    <text x="60" y="72" text-anchor="middle" font-size="11" fill="var(--text3)">прогресс</text>
  </svg>`;

  // Mini bars for quiz scores
  if(scores.length){
    html+='<div style="margin-top:12px;text-align:left">';
    html+='<div style="font-size:12px;color:var(--text3);margin-bottom:6px">Результаты тестов:</div>';
    scores.forEach((s,si)=>{
      const bw=Math.min(s.score,100);
      const color=s.score>=80?'var(--green)':s.score>=50?'var(--yellow)':'var(--red)';
      html+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px">
        <span style="width:40px;color:var(--text3)">Урок ${s.lesson+1}</span>
        <div style="flex:1;height:14px;background:var(--bg4);border-radius:7px;overflow:hidden">
          <div style="height:100%;width:${bw}%;background:${color};border-radius:7px;transition:width 0.5s"></div>
        </div>
        <span style="width:30px;text-align:right;font-weight:600">${s.score}%</span>
      </div>`;
    });
    html+='</div>';
  }

  // Stats grid
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:12px">
    <div style="background:var(--bg3);border-radius:8px;padding:8px"><div style="color:var(--text3)">Пройдено</div><div style="font-weight:700;font-size:16px">${done}/${total}</div></div>
    <div style="background:var(--bg3);border-radius:8px;padding:8px"><div style="color:var(--text3)">Средний балл</div><div style="font-weight:700;font-size:16px">${avg>0?Math.round(avg)+'%':'—'}</div></div>
    <div style="background:var(--bg3);border-radius:8px;padding:8px"><div style="color:var(--text3)">Экзамен</div><div style="font-weight:700;font-size:16px">${p.exam_score!=null?(p.exam_passed?'✅ '+p.exam_score+'%':'❌ '+p.exam_score+'%'):'—'}</div></div>
    <div style="background:var(--bg3);border-radius:8px;padding:8px"><div style="color:var(--text3)">Статус</div><div style="font-weight:700;font-size:16px">${c.status==='completed'?'✅ Завершён':c.status==='learning'?'📖 В процессе':'⏳ Начат'}</div></div>
  </div>`;
  html+='</div>';
  showModal(html,'📊 Прогресс курса');
}

  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1001;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';
  m.innerHTML='<div class="card" style="max-width:660px;width:94%;max-height:88vh;overflow-y:auto;padding:22px;margin:20px">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><h3 style="margin:0"><i class="fas fa-brain" style="color:var(--accent)"></i> Векторный поиск</h3><span style="flex:1"></span><button class="btn-icon" onclick="closeVectorSearch()" title="Закрыть"><i class="fas fa-times"></i></button></div>'
    +'<div id="vecBody"><div class="spinner" style="margin:30px auto"></div></div></div>';
  m.onclick=e=>{if(e.target===m)closeVectorSearch()};
  document.body.appendChild(m);
  _vecRefresh();
}
function closeVectorSearch(){
  if(_vecPollTimer){clearInterval(_vecPollTimer);_vecPollTimer=null}
  const m=document.getElementById('vecModal');if(m)m.remove();
}
function _vecOpenIndex(el){_vecCourseId=el.getAttribute('data-cid')||null;_vecResults=null;_vecRefresh()}
async function _vecRefresh(){
  const body=document.getElementById('vecBody');if(!body)return;
  if(_vecPollTimer){clearInterval(_vecPollTimer);_vecPollTimer=null}
  try{
    const r=await fetch('/api/education/vector/status?course_id='+encodeURIComponent(_vecCourseId||''));
    const d=await r.json();
    _vecRender(d);
  }catch(e){
    body.innerHTML='<div style="color:var(--red)">Ошибка соединения: '+esc(e.message||'')+'</div>';
  }
}
function _vecRender(d){
  const body=document.getElementById('vecBody');if(!body)return;
  if(!d.enabled){
    body.innerHTML='<div style="font-size:13px;line-height:1.6;color:var(--text2)">'
      +'<p style="margin:0 0 10px">Векторный поиск находит ответ <b>в материалах курса по смыслу</b>, а не по совпадению слов. Индекс и эмбеддинги считаются локально на этом компьютере.</p>'
      +'<div style="background:var(--bg3);border-radius:10px;padding:12px;font-size:12px;margin-bottom:14px">'
      +'<div><i class="fas fa-lock"></i> Функция выключена по умолчанию.</div>'
      +'<div style="margin-top:6px"><i class="fas fa-database"></i> При включении создаётся каталог <code>data/education/vector</code> — его можно удалить в любой момент.</div></div>'
      +'<button class="btn btn-primary" style="width:100%" onclick="vecSetEnabled(true)"><i class="fas fa-power-off"></i> Включить векторный поиск</button></div>';
    return;
  }
  const st=d.state||{};
  const building=!!st.building&&st.course_id===_vecCourseId;
  if(building){
    const total=st.total||0, done=st.processed||0;
    const pct=total?Math.round(done*100/total):0;
    body.innerHTML='<div style="font-size:13px;color:var(--text2);margin-bottom:8px"><i class="fas fa-spinner fa-pulse" style="color:var(--accent)"></i> '
      +(total?('Строю индекс: '+done+' из '+total+' фрагментов'):'Читаю материалы курса…')+'</div>'
      +'<div style="height:8px;border-radius:6px;background:var(--bg3);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--accent);transition:width .4s"></div></div>'
      +'<div style="font-size:11px;color:var(--text3);margin-top:8px">Считаются эмбеддинги на этом ПК. Окно можно закрыть — индексация продолжится.</div>';
    if(!_vecPollTimer)_vecPollTimer=setInterval(_vecRefresh,1200);
    return;
  }
  if(!_vecCourseId){
    const idx=d.indexes||[];
    let opt=(_coursesCache||[]).map(c=>'<option value="'+c.id+'">'+esc(c.title||'Курс')+'</option>').join('');
    let h='<div style="font-size:12px;color:var(--text3);margin-bottom:6px">Курс</div>';
    h+='<select class="search-inp" style="width:100%;margin-bottom:12px" onchange="_vecCourseId=this.value;_vecRefresh()"><option value="">— выберите курс —</option>'+opt+'</select>';
    if(idx.length){
      h+='<div style="font-size:12px;color:var(--text3);margin:10px 0 6px">Готовые индексы</div>';
      idx.forEach(m=>{
        h+='<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;font-size:12px">'
          +'<i class="fas fa-database" style="color:var(--accent)"></i><b style="flex:1">'+esc(m.title||_vecCourseTitle(m.course_id))+'</b>'
          +'<span style="color:var(--text3)">'+m.chunks+' фрагм.</span>'
          +'<button class="btn btn-sm" data-cid="'+esc(m.course_id)+'" onclick="_vecOpenIndex(this)">Открыть</button></div>';
      });
    }else{
      h+='<div style="font-size:12px;color:var(--text3)">Откройте курс или выберите его выше, чтобы построить индекс.</div>';
    }
    body.innerHTML=h;
    return;
  }
  const meta=d.index||null;
  let h='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">'
    +'<div style="font-size:13px;font-weight:600;flex:1">'+esc(meta&&meta.title||_vecCourseTitle(_vecCourseId))+'</div>'
    +'<button class="btn btn-sm" onclick="_vecCourseId=S.currentId;_vecRefresh()" title="Выбрать другой курс"><i class="fas fa-arrow-right-arrow-left"></i> Курс</button>'
    +'<button class="btn btn-sm" onclick="vecSetEnabled(false)" title="Выключить функцию"><i class="fas fa-power-off"></i></button>'
    +'</div>';
  if(meta){
    const dt=meta.built_at?new Date(meta.built_at*1000).toLocaleString('ru-RU'):'';
    h+='<div style="background:var(--bg3);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text2);margin-bottom:10px">'
      +'<div><i class="fas fa-database" style="color:var(--accent)"></i> Индекс: <b>'+meta.chunks+'</b> фрагментов · '+esc(dt)+'</div>'
      +'<div style="color:var(--text3);margin-top:3px">Модель: '+esc(meta.model||'')+' · '+meta.dim+' измерений</div>'
      +(meta.truncated?'<div style="color:var(--yellow);margin-top:4px">Материалов больше лимита — проиндексирована равномерная выборка ('+d.max_chunks+' фрагм.).</div>':'')
      +'</div>';
  }else{
    h+='<div style="background:var(--bg3);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text3);margin-bottom:10px">Индекс этого курса ещё не построен.</div>';
  }
  h+='<div style="display:flex;gap:8px;margin-bottom:12px">'
    +'<button class="btn btn-sm btn-primary" onclick="vecBuild()"><i class="fas fa-rotate"></i> '+(meta?'Перестроить индекс':'Построить индекс')+'</button>'
    +(meta?'<button class="btn btn-sm btn-danger" onclick="vecPurge()"><i class="fas fa-trash"></i> Удалить индекс</button>':'')
    +'</div>';
  if(meta){
    h+='<div style="display:flex;gap:8px;margin-bottom:10px">'
      +'<input class="search-inp" id="vecQuery" style="flex:1" placeholder="Например: как работает фотосинтез?" value="'+esc(_vecQuery).replace(/"/g,'&quot;')+'" onkeydown="if(event.key===\'Enter\')vecSearchGo()">'
      +'<button class="btn btn-primary" onclick="vecSearchGo()"><i class="fas fa-magnifying-glass"></i></button></div>'
      +'<div id="vecResults"></div>';
  }
  if(st.error&&(!st.course_id||st.course_id===_vecCourseId))h+='<div style="color:var(--red);font-size:12px;margin-top:8px">Ошибка индексации: '+esc(st.error)+'</div>';
  body.innerHTML=h;
  if(meta&&_vecResults)_vecPaintResults(_vecResults);
}
function _vecPaintResults(data){
  const box=document.getElementById('vecResults');if(!box)return;
  if(!data)return;
  if(!data.ok){
    box.innerHTML='<div style="font-size:12px;color:var(--red)">'+esc(data.message||data.error||'Ошибка поиска')+'</div>';
    return;
  }
  const rows=data.results||[];
  if(!rows.length){box.innerHTML='<div style="font-size:12px;color:var(--text3)">Ничего не найдено.</div>';return}
  box.innerHTML=rows.map(r=>'<div style="border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px">'
    +'<div style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3);margin-bottom:4px">'
    +'<i class="fas '+(r.kind==='lesson'?'fa-book-open':'fa-file-lines')+'"></i>'
    +'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.source||'')+'</span>'
    +'<span style="color:var(--accent)">'+r.score+'%</span></div>'
    +'<div style="font-size:12.5px;line-height:1.55;white-space:pre-wrap">'+esc(r.text||'')+'</div></div>').join('');
}
async function vecSetEnabled(v){
  try{
    const r=await fetch('/api/education/vector/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!!v})});
    const d=await r.json();
    if(!d.ok){toast('Не удалось переключить','err');return}
    toast(v?'Векторный поиск включён':'Векторный поиск выключен',v?'ok':'info');
    _vecRefresh();
  }catch(e){toast('Ошибка соединения','err')}
}
async function vecBuild(){
  if(!_vecCourseId){toast('Выберите курс','info');return}
  try{
    const r=await fetch('/api/education/vector/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course_id:_vecCourseId})});
    const d=await r.json();
    if(!d.ok){toast(d.message||d.error||'Не удалось запустить','err');return}
    _vecResults=null;
    toast('Индексация запущена','info');
    _vecRefresh();
  }catch(e){toast('Ошибка соединения','err')}
}
async function vecPurge(){
  if(!_vecCourseId)return;
  if(!confirm('Удалить векторный индекс этого курса? Материалы курса не пострадают.'))return;
  try{
    const r=await fetch('/api/education/vector/purge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course_id:_vecCourseId})});
    const d=await r.json();
    if(!d.ok){toast(d.error||'Ошибка','err');return}
    _vecResults=null;toast('Индекс удалён','ok');_vecRefresh();
  }catch(e){toast('Ошибка соединения','err')}
}
async function vecSearchGo(){
  const inp=document.getElementById('vecQuery');
  const q=(inp&&inp.value||'').trim();
  if(!q||!_vecCourseId)return;
  _vecQuery=q;
  const box=document.getElementById('vecResults');
  if(box)box.innerHTML='<div style="font-size:12px;color:var(--text3)"><i class="fas fa-spinner fa-pulse"></i> Ищу…</div>';
  try{
    const r=await fetch('/api/education/vector/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course_id:_vecCourseId,query:q,limit:8})});
    const d=await r.json();
    _vecResults=d;_vecPaintResults(d);
  }catch(e){
    if(box)box.innerHTML='<div style="font-size:12px;color:var(--red)">Ошибка соединения</div>';
  }
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded',()=>{loadCourses()});
</script>
