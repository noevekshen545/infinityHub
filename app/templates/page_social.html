<!DOCTYPE html>
<html class="pg-page_social" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social — Infinity</title>
<link rel="stylesheet" href="/static/css/font-awesome.min.css">
<link rel="stylesheet" href="/static/fonts/google-fonts.css">
<link rel="stylesheet" href="/static/css/social-theme.css?v=9">
<style>
.main-content { max-width: 85%; margin: 76px auto 90px; padding: 0 20px; min-height: calc(100vh - 166px) }
@media (max-width: 900px) { .main-content { max-width: 100% } }

.persistent-player {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000;
  background: var(--glass); backdrop-filter: blur(32px) saturate(200%);
  border-top: 1px solid var(--glass-border);
  padding: 8px 20px; display: flex; align-items: center; gap: 16px;
  transition: var(--transition-normal);
  box-shadow: 0 -4px 30px var(--shadow);
}
.persistent-player .pp-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px }
.persistent-player .pp-cover {
  width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
  background: var(--bg3); display: flex; align-items: center; justify-content: center;
  overflow: hidden; font-size: 20px; color: var(--text3)
}
.persistent-player .pp-cover img { width: 100%; height: 100%; object-fit: cover }
.persistent-player .pp-text { min-width: 0 }
.persistent-player .pp-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer }
.persistent-player .pp-title:hover { color: var(--accent) }
.persistent-player .pp-artist { font-size: 12px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.persistent-player .pp-controls { display: flex; align-items: center; gap: 4px }
.persistent-player .pp-controls button {
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: var(--transition-fast); color: var(--text2);
  background: none; border: none; cursor: pointer; font-size: 16px
}
.persistent-player .pp-controls button:hover { background: var(--hover); color: var(--text) }
.persistent-player .pp-controls .pp-play {
  width: 38px; height: 38px; background: var(--accent); color: #fff; font-size: 16px
}
.persistent-player .pp-controls .pp-play:hover {
  background: var(--accent2); transform: scale(1.05); box-shadow: 0 0 20px var(--accent-glow)
}
.persistent-player .pp-progress { flex: 0 0 200px; display: flex; align-items: center; gap: 8px }
.persistent-player .pp-progress .pp-time { font-size: 11px; color: var(--text3); min-width: 32px; text-align: center }
.persistent-player .pp-progress input[type=range] {
  flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px;
  background: var(--border); outline: none; cursor: pointer
}
.persistent-player .pp-progress input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer; box-shadow: 0 0 8px var(--accent-glow)
}
.persistent-player .pp-volume { display: flex; align-items: center; gap: 6px }
.persistent-player .pp-volume input[type=range] {
  width: 80px; -webkit-appearance: none; height: 3px; border-radius: 2px;
  background: var(--border); outline: none; cursor: pointer
}
.persistent-player .pp-volume input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer
}
.persistent-player .pp-extra { display: flex; align-items: center; gap: 2px }
.persistent-player .pp-extra button {
  width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: var(--text3); transition: var(--transition-fast); background: none; border: none; cursor: pointer; font-size: 14px
}
.persistent-player .pp-extra button:hover { color: var(--text); background: var(--hover) }
.persistent-player .pp-extra button.active { color: var(--accent) }
.persistent-player .pp-extra button.pp-close:hover { color: var(--red) }
.persistent-player.hidden { display: none }

.loading-screen { display: flex; align-items: center; justify-content: center; padding: 80px 20px; color: var(--text3) }
.loading-screen i { font-size: 32px; animation: spin 1s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
#content > * { animation: fadeIn 0.3s ease }

.nav-indicator { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; border-radius: 2px; background: var(--accent); transition: var(--transition-normal) }

@media (max-width: 768px) {
  .persistent-player { flex-wrap: wrap; padding: 6px 12px; gap: 6px }
  .persistent-player .pp-progress { flex: 1 1 100%; order: -1 }
  .persistent-player .pp-volume { display: none }
  .persistent-player .pp-extra .pp-close { display: flex }
}
</style>
<script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="/static/js/mobile.js" defer></script>
</head>
<body>
<script>
(function(){var t=localStorage.getItem('infinity_theme')||'dark';document.body.className='';if(t!=='dark')document.body.classList.add(t)})();
</script>

<div class="toolbar">
  <a class="brand" href="/social/feed"><i class="fas fa-users"></i> Social</a>
  <div class="sep"></div>
  <a class="btn" href="/social/feed" data-nav="feed"><i class="fas fa-newspaper"></i><span>Лента</span></a>
  <a class="btn" href="/social/profile" data-nav="profile"><i class="fas fa-user"></i><span>Профиль</span></a>
  <a class="btn" href="/social/friends" data-nav="friends"><i class="fas fa-user-friends"></i><span>Друзья</span></a>
  <a class="btn" href="/social/messages" data-nav="messages"><i class="fas fa-envelope"></i><span>Сообщения</span><span class="count" style="background:var(--red);color:white;padding:1px 6px;border-radius:10px;font-size:10px;display:none" id="msg-count">0</span></a>
  <a class="btn" href="/social/friends?tab=groups" data-nav="groups"><i class="fas fa-users"></i><span>Группы</span></a>
  <a class="btn" href="/social/friends?tab=channels" data-nav="channels"><i class="fas fa-bullhorn"></i><span>Каналы</span></a>
  <div class="sep"></div>
  <a class="btn" href="/social/music" data-nav="music"><i class="fas fa-music"></i><span>Музыка</span></a>
  <a class="btn" href="/social/video" data-nav="video"><i class="fas fa-video"></i><span>Видео</span></a>
  <div class="sep"></div>
  <button class="btn-icon" onclick="openThemePicker()" title="Тема"><i class="fas fa-palette"></i></button>
  <a class="btn-icon" href="/" title="На главную"><i class="fas fa-home"></i></a>
</div>

<div class="main-content" id="content">
  <div class="loading-screen"><i class="fas fa-spinner fa-spin"></i></div>
</div>

<div class="persistent-player hidden" id="persistentPlayer">
  <div class="pp-info">
    <div class="pp-cover" id="ppCover"><i class="fas fa-music"></i></div>
    <div class="pp-text">
      <div class="pp-title" id="ppTitle" onclick="window.player?.toggleExpand?.()">Нет трека</div>
      <div class="pp-artist" id="ppArtist">—</div>
    </div>
  </div>
  <div class="pp-progress">
    <span class="pp-time" id="ppCurrent">0:00</span>
    <input type="range" id="ppSeek" value="0" oninput="window.player?.seek?.(this.value)">
    <span class="pp-time" id="ppTotal">0:00</span>
  </div>
  <div class="pp-controls">
    <button onclick="window.player?.prev?.()" title="Предыдущий"><i class="fas fa-step-backward"></i></button>
    <button class="pp-play" onclick="window.player?.togglePlay?.()" title="Воспр./Пауза"><i class="fas fa-play" id="ppPlayIcon"></i></button>
    <button onclick="window.player?.next?.()" title="Следующий"><i class="fas fa-step-forward"></i></button>
  </div>
  <div class="pp-volume">
    <i class="fas fa-volume-up" style="font-size:13px;color:var(--text3)"></i>
    <input type="range" id="ppVolume" value="80" oninput="window.player?.setVolume?.(this.value)">
  </div>
  <div class="pp-extra">
    <button onclick="window.player?.toggleShuffle?.()" id="ppShuffle" title="Перемешать"><i class="fas fa-random"></i></button>
    <button onclick="window.player?.toggleRepeat?.()" id="ppRepeat" title="Повтор"><i class="fas fa-repeat"></i></button>
    <button class="pp-close" onclick="window.player?.close?.()" title="Закрыть"><i class="fas fa-chevron-down"></i></button>
  </div>
</div>
<audio id="globalAudio" style="display:none"></audio>

<div class="modal-overlay" id="themeModal">
  <div class="modal">
    <div class="modal-title"><i class="fas fa-palette"></i> Выбор темы</div>
    <div class="theme-grid">
      <div class="theme-btn" data-theme="dark" onclick="setTheme('dark')"><span class="icon"><i class="fas fa-moon"></i></span>Тёмная</div>
      <div class="theme-btn" data-theme="light" onclick="setTheme('light')"><span class="icon"><i class="fas fa-sun"></i></span>Светлая</div>
      <div class="theme-btn" data-theme="sepia" onclick="setTheme('sepia')"><span class="icon"><i class="fas fa-scroll"></i></span>Сепия</div>
      <div class="theme-btn" data-theme="warm" onclick="setTheme('warm')"><span class="icon"><i class="fas fa-fire"></i></span>Тёплая</div>
      <div class="theme-btn" data-theme="paper" onclick="setTheme('paper')"><span class="icon"><i class="fas fa-file"></i></span>Бумага</div>
      <div class="theme-btn" data-theme="ocean" onclick="setTheme('ocean')"><span class="icon"><i class="fas fa-water"></i></span>Океан</div>
      <div class="theme-btn" data-theme="forest" onclick="setTheme('forest')"><span class="icon"><i class="fas fa-tree"></i></span>Лес</div>
      <div class="theme-btn" data-theme="midnight" onclick="setTheme('midnight')"><span class="icon"><i class="fas fa-star"></i></span>Полночь</div>
      <div class="theme-btn" data-theme="rose" onclick="setTheme('rose')"><span class="icon"><i class="fas fa-rose"></i></span>Роза</div>
    </div>
    <div class="m-actions"><button class="btn-primary" onclick="closeThemePicker()"><i class="fas fa-check"></i> Готово</button></div>
  </div>
</div>

<script>
// ===== THEME =====
function getTheme() { return localStorage.getItem('infinity_theme') || 'dark' }
function setTheme(t) {
  document.body.className = '';
  if (t !== 'dark') document.body.classList.add(t);
  localStorage.setItem('infinity_theme', t);
  document.querySelectorAll('.theme-btn').forEach(el => el.classList.toggle('active', el.dataset.theme === t));
}
function openThemePicker() {
  openModal('themeModal');
  document.querySelectorAll('.theme-btn').forEach(el => el.classList.toggle('active', el.dataset.theme === getTheme()));
}
function closeThemePicker() { closeModal('themeModal') }
function openModal(id) { document.getElementById(id).classList.add('active') }
function closeModal(id) { document.getElementById(id).classList.remove('active') }
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active') });
});

// ===== GLOBAL AUDIO PLAYER (VK-style) =====
window.player = (function() {
  const audio = document.getElementById('globalAudio');
  const bar = document.getElementById('persistentPlayer');
  const playIcon = document.getElementById('ppPlayIcon');
  const seek = document.getElementById('ppSeek');
  const volume = document.getElementById('ppVolume');
  const currentT = document.getElementById('ppCurrent');
  const totalT = document.getElementById('ppTotal');
  const title = document.getElementById('ppTitle');
  const artist = document.getElementById('ppArtist');
  const cover = document.getElementById('ppCover');

  let queue = [];
  let currentIdx = -1;
  let isShuffle = false;
  let isRepeat = false;

  function formatTime(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function updateUI() {
    if (audio.duration) {
      seek.value = (audio.currentTime / audio.duration) * 100;
      currentT.textContent = formatTime(audio.currentTime);
      totalT.textContent = formatTime(audio.duration);
    }
  }

  function play(idx) {
    if (idx < 0 || idx >= queue.length) return;
    currentIdx = idx;
    const track = queue[idx];
    audio.src = track.src;
    title.textContent = track.title || 'Нет трека';
    artist.textContent = track.artist || '—';
    if (track.cover) cover.innerHTML = '<img src="' + track.cover + '" alt="">';
    else cover.innerHTML = '<i class="fas fa-music"></i>';
    bar.classList.remove('hidden');
    audio.play().then(() => { playIcon.className = 'fas fa-pause' }).catch(console.error);
  }

  function playTrack(track) {
    queue = [track];
    currentIdx = 0;
    play(0);
  }

  function playQueue(tracks, startIdx) {
    queue = tracks;
    currentIdx = startIdx || 0;
    play(currentIdx);
  }

  function togglePlay() {
    if (!audio.src) return;
    if (audio.paused) { audio.play(); playIcon.className = 'fas fa-pause' }
    else { audio.pause(); playIcon.className = 'fas fa-play' }
  }

  function next() {
    if (queue.length === 0) return;
    if (isShuffle) {
      let nextIdx;
      do { nextIdx = Math.floor(Math.random() * queue.length) } while (nextIdx === currentIdx && queue.length > 1);
      play(nextIdx);
    } else if (currentIdx < queue.length - 1) {
      play(currentIdx + 1);
    } else if (isRepeat) {
      play(0);
    } else {
      close();
    }
  }

  function prev() {
    if (queue.length === 0) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return }
    if (currentIdx > 0) play(currentIdx - 1);
  }

  function seekTo(val) {
    if (audio.duration) audio.currentTime = (val / 100) * audio.duration;
  }

  function setVolume(val) { audio.volume = val / 100 }

  function toggleShuffle() {
    isShuffle = !isShuffle;
    document.getElementById('ppShuffle').classList.toggle('active', isShuffle);
  }

  function toggleRepeat() {
    isRepeat = !isRepeat;
    document.getElementById('ppRepeat').classList.toggle('active', isRepeat);
  }

  function close() {
    audio.pause(); audio.src = '';
    bar.classList.add('hidden');
    currentIdx = -1; queue = [];
  }

  audio.addEventListener('timeupdate', updateUI);
  audio.addEventListener('ended', next);

  return { playTrack, playQueue, togglePlay, next, prev, seek: seekTo, setVolume, toggleShuffle, toggleRepeat, close, getQueue: () => queue, getCurrentIdx: () => currentIdx };
})();

// ===== SPA ROUTER =====
let currentPath = '';

function navigate(url) {
  if (!url || url === currentPath) return;
  currentPath = url;
  const target = url.startsWith('/social') ? url : '/social' + url;
  const fetchUrl = target + (target.includes('?') ? '&' : '?') + 'partial=1';

  document.getElementById('content').innerHTML = '<div class="loading-screen"><i class="fas fa-spinner fa-spin"></i></div>';

  // Update nav active state
  document.querySelectorAll('.toolbar .btn').forEach(b => b.classList.remove('active'));
  const navMap = { '/social/feed': 'feed', '/social/profile': 'profile', '/social/friends': 'friends', '/social/messages': 'messages', '/social/music': 'music', '/social/video': 'video' };
  const activeNav = Object.keys(navMap).find(k => url.startsWith(k));
  if (activeNav) {
    const navBtn = document.querySelector(`.toolbar .btn[data-nav="${navMap[activeNav]}"]`);
    if (navBtn) navBtn.classList.add('active');
  }

  fetch(fetchUrl)
    .then(r => r.text())
    .then(html => {
      document.getElementById('content').innerHTML = html;
      history.pushState({ url: target }, '', target);
      // Execute inline scripts in the fragment
      document.getElementById('content').querySelectorAll('script:not([src])').forEach(s => {
        const ns = document.createElement('script');
        ns.textContent = s.textContent;
        document.body.appendChild(ns).remove();
      });
      // Init page if it has an init function
      if (typeof window.pageInit === 'function') window.pageInit();
    })
    .catch(err => {
      document.getElementById('content').innerHTML = '<div style="text-align:center;padding:60px;color:var(--red)"><i class="fas fa-exclamation-triangle" style="font-size:48px;margin-bottom:16px;display:block"></i>Ошибка загрузки страницы</div>';
    });
}

// Intercept toolbar navigation clicks
document.querySelector('.toolbar').addEventListener('click', function(e) {
  const a = e.target.closest('a[href^="/social/"]');
  if (a && !a.hasAttribute('download')) {
    e.preventDefault();
    navigate(a.getAttribute('href'));
  }
});

// Handle back/forward
window.addEventListener('popstate', function(e) {
  if (e.state && e.state.url) {
    currentPath = '';
    navigate(e.state.url);
  } else {
    currentPath = '';
    navigate('/social/feed');
  }
});

// Load initial page
navigate('/social/feed');
</script>
<script src="/static/js/social-ui.js?v=6"></script>
<script src="/static/js/social-dock.js?v=7"></script>
</body>
</html>
