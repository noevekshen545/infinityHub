<!DOCTYPE html>
<html class="pg-page_social_video" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Видео — Infinity AI</title>
<link rel="stylesheet" href="/static/css/font-awesome.min.css">
<link rel="stylesheet" href="/static/css/social-theme.css?v=9">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:var(--bg-gradient)}
.toolbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius-xl);padding:6px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 24px);transition:var(--tr)}
.toolbar:hover{box-shadow:var(--shadow-lg),0 0 60px var(--accent-glow)}
.toolbar .brand{font-size:15px;font-weight:800;color:var(--accent);padding:6px 12px;border-radius:10px;cursor:pointer;transition:var(--tr);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.toolbar .brand:hover{background:var(--accent-light);transform:scale(1.05)}
.toolbar .sep{width:1px;height:20px;background:var(--border2);margin:0 4px}
.toolbar .btn{background:transparent;border:1px solid transparent;color:var(--text2);padding:8px 14px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:500;transition:var(--tr);display:inline-flex;align-items:center;gap:7px;font-family:inherit;text-decoration:none;white-space:nowrap}
.toolbar .btn:hover{background:var(--hover);color:var(--text);transform:translateY(-1px)}
.toolbar .btn:hover i{color:var(--accent)}
.toolbar .btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px var(--accent-glow)}
.toolbar .btn.active i{color:#fff}
.toolbar .btn-icon{background:transparent;border:1px solid transparent;color:var(--text2);padding:8px 10px;border-radius:12px;cursor:pointer;font-size:15px;transition:var(--tr);display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px}
.toolbar .btn-icon:hover{background:var(--hover);color:var(--accent);transform:rotate(15deg)}
body{padding-top:76px}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme-btn{padding:14px 10px;border:2px solid var(--border);border-radius:14px;cursor:pointer;font-size:12px;font-weight:600;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg);color:var(--text)}
.theme-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.theme-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.theme-btn .icon{font-size:26px}

.container{max-width:85%;margin:0 auto;padding:20px}
.page-title{font-size:28px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.page-sub{color:var(--text2);font-size:14px;margin-bottom:24px}
.search-bar{display:flex;gap:10px;margin-bottom:24px}
.search-bar input{flex:1;padding:12px 18px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:var(--tr)}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.search-bar input::placeholder{color:var(--text3)}
.search-bar button{padding:12px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--radius-md);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;transition:var(--tr)}
.search-bar button:hover{transform:translateY(-2px);box-shadow:0 4px 16px var(--accent-glow)}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat-card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:16px 20px;flex:1;min-width:140px;text-align:center}
.stat-card .num{font-size:24px;font-weight:800;color:var(--accent)}
.stat-card .label{font-size:12px;color:var(--text2);margin-top:4px}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:16px}
.video-card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:var(--tr)}
.video-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px var(--shadow);border-color:var(--accent)}
.video-card .poster{width:100%;aspect-ratio:16/9;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text3);position:relative;overflow:hidden}
.video-card .poster img{width:100%;height:100%;object-fit:cover}
.video-card .poster .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:var(--tr)}
.video-card:hover .poster .play-overlay{opacity:1}
.video-card .poster .play-overlay i{font-size:48px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
.video-card .poster .duration-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.75);color:#fff;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.video-card .body{padding:14px}
.video-card .body .title{font-size:15px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-card .body .year{font-size:12px;color:var(--text3);margin-bottom:4px}
.video-card .body .overview{font-size:12px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.video-card .body .genres{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.video-card .body .genres span{padding:2px 8px;border-radius:10px;background:var(--accent-light);color:var(--accent);font-size:10px;font-weight:600}

.player-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.92);display:none;flex-direction:column;align-items:center;justify-content:center}
.player-overlay.active{display:flex}
.player-overlay video{max-width:95vw;max-height:85vh;border-radius:var(--radius-lg);box-shadow:0 8px 40px rgba(0,0,0,0.6)}
.player-overlay .close-player{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:24px;cursor:pointer;padding:12px 16px;border-radius:12px;transition:var(--tr)}
.player-overlay .close-player:hover{background:rgba(255,255,255,0.2)}
.player-overlay .player-info{color:#fff;text-align:center;margin-bottom:16px;max-width:600px}
.player-overlay .player-info .ptitle{font-size:20px;font-weight:700;margin-bottom:4px}
.player-overlay .player-info .pyear{font-size:14px;opacity:0.7}

@media(max-width:768px){
  .container{padding:12px;max-width:100%}
  .video-grid{grid-template-columns:repeat(1,1fr)}
  .toolbar{gap:2px;padding:4px}
  .toolbar .btn span{display:none}
  .stats{flex-direction:column}
}
</style>
<script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="/static/js/mobile.js" defer></script>
  <script src="/static/js/dialogs.js" defer></script>
<link rel="stylesheet" href="/static/fonts/site-fonts.css">
</head>
<body>
<div class="toolbar">
  <a class="brand" href="/social/feed"><i class="fas fa-users"></i> Social</a>
  <div class="sep"></div>
  <a class="btn" href="/social/feed"><i class="fas fa-newspaper"></i><span>Лента</span></a>
  <a class="btn" href="/social/profile"><i class="fas fa-user"></i><span>Профиль</span></a>
  <a class="btn" href="/social/friends"><i class="fas fa-user-friends"></i><span>Друзья</span></a>
  <a class="btn" href="/social/messages"><i class="fas fa-envelope"></i><span>Сообщения</span></a>
  <a class="btn" href="/social/friends?tab=groups"><i class="fas fa-users"></i><span>Группы</span></a>
  <a class="btn" href="/social/friends?tab=channels"><i class="fas fa-bullhorn"></i><span>Каналы</span></a>
  <div class="sep"></div>
  <a class="btn" href="/social/music"><i class="fas fa-music"></i><span>Музыка</span></a>
  <a class="btn active" href="/social/video"><i class="fas fa-video"></i><span>Видео</span></a>
  <div class="sep"></div>
  <button class="btn-icon" onclick="openThemePicker()" title="Тема"><i class="fas fa-palette"></i></button>
  <a class="btn-icon" href="/" title="На главную"><i class="fas fa-home"></i></a>
</div>

<!-- PAGE_START -->
<div class="container">
  <h1 class="page-title"><i class="fas fa-video"></i> Видеотека</h1>
  <p class="page-sub">Все ваши фильмы и видео</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Поиск по названию, жанру, году..." onkeydown="if(event.key==='Enter')searchVideos()">
    <button onclick="searchVideos()"><i class="fas fa-search"></i> Поиск</button>
  </div>
  <div class="stats" id="stats">
    <div class="stat-card"><div class="num" id="totalVideos">0</div><div class="label">Видео</div></div>
    <div class="stat-card"><div class="num" id="totalMovies">0</div><div class="label">Фильмы</div></div>
    <div class="stat-card"><div class="num" id="totalSeries">0</div><div class="label">Серии/Разное</div></div>
  </div>
  <div class="video-grid" id="videoGrid"></div>
</div>

<div class="player-overlay" id="playerOverlay">
  <button class="close-player" onclick="closeVideoPlayer()"><i class="fas fa-times"></i></button>
  <div class="player-info">
    <div class="ptitle" id="videoPlayerTitle">—</div>
    <div class="pyear" id="videoPlayerYear"></div>
  </div>
  <video id="videoPlayer" controls autoplay></video>
</div>

<!-- PAGE_END -->
<div class="modal-overlay" id="themeModal">
  <div class="modal">
    <div class="modal-title"><i class="fas fa-palette"></i> Выбор темы</div>
    <div class="theme-grid">
      <div class="theme-btn" data-theme="dark" onclick="setTheme('dark')"><span class="icon"><i class="fas fa-moon"></i></span>Тёмная</div>
      <div class="theme-btn" data-theme="light" onclick="setTheme('light')"><span class="icon"><i class="fas fa-sun"></i></span>Светлая</div>
      <div class="theme-btn" data-theme="sepia" onclick="setTheme('sepia')"><span class="icon"><i class="fas fa-scroll"></i></span>Сепия</div>
      <div class="theme-btn" data-theme="warm" onclick="setTheme('warm')"><span class="icon"><i class="fas fa-fire"></i></span>Тёплая</div>
      <div class="theme-btn" data-theme="paper" onclick="setTheme('paper')"><span class="icon"><i class="fas fa-file"></i></span>Бумага</div>
      <div class="theme-btn" data-theme="ocean" onclick="setTheme('ocean')"><span class="icon"><i class="fas fa-water"></i></span>Океан</div>
      <div class="theme-btn" data-theme="forest" onclick="setTheme('forest')"><span class="icon"><i class="fas fa-tree"></i></span>Лес</div>
      <div class="theme-btn" data-theme="midnight" onclick="setTheme('midnight')"><span class="icon"><i class="fas fa-star"></i></span>Полночь</div>
      <div class="theme-btn" data-theme="rose" onclick="setTheme('rose')"><span class="icon"><i class="fas fa-rose"></i></span>Роза</div>
    </div>
    <div class="m-actions"><button class="btn-primary" onclick="closeThemePicker()"><i class="fas fa-check"></i> Готово</button></div>
  </div>
</div>

<script>
const savedTheme = localStorage.getItem('infinity_theme') || 'dark';
document.body.className = '';
if (savedTheme !== 'dark') document.body.classList.add(savedTheme);

function getTheme() { return localStorage.getItem('infinity_theme') || 'dark' }
function setTheme(t) {
  document.body.className = '';
  if (t !== 'dark') document.body.classList.add(t);
  localStorage.setItem('infinity_theme', t);
  document.querySelectorAll('.theme-btn').forEach(el => el.classList.toggle('active', el.dataset.theme === t));
}
function openThemePicker() {
  openModal('themeModal');
  document.querySelectorAll('.theme-btn').forEach(el => el.classList.toggle('active', el.dataset.theme === getTheme()));
}
function closeThemePicker() { closeModal('themeModal') }

let allVideos = [];
let filteredVideos = [];

function formatDuration(seconds) {
  if (!seconds || isNaN(seconds)) return '';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + 'ч ' + m + 'м';
  return m + ' мин';
}

function formatRuntime(minutes) {
  if (!minutes) return '';
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h > 0) return h + 'ч ' + m + 'м';
  return m + ' мин';
}

function getPosterUrl(video) {
  if (video.has_poster && video.poster_path) return '/api/media/poster/' + video.id;
  if (video.poster_url) return video.poster_url;
  return null;
}

function renderVideos(videos) {
  const grid = document.getElementById('videoGrid');
  if (!videos.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3)"><i class="fas fa-video" style="font-size:48px;display:block;margin-bottom:16px"></i>Видео не найдены</div>';
    return;
  }
  grid.innerHTML = videos.map((v, i) => {
    const posterUrl = getPosterUrl(v);
    const posterHtml = posterUrl
      ? '<img src="' + posterUrl + '" alt="poster" loading="lazy">'
      : '<i class="fas fa-film"></i>';
    const genres = v.genres ? (Array.isArray(v.genres) ? v.genres : JSON.parse(v.genres || '[]')) : [];
    const dur = formatDuration(v.duration) || formatRuntime(v.runtime);
    const year = v.year || '';
    const overview = v.overview || '';
    return '<div class="video-card" onclick="playVideo(' + i + ')">' +
      '<div class="poster">' + posterHtml +
      '<div class="play-overlay"><i class="fas fa-play-circle"></i></div>' +
      (dur ? '<div class="duration-badge">' + dur + '</div>' : '') + '</div>' +
      '<div class="body">' +
      '<div class="title">' + (v.title || v.filename || 'Unknown') + '</div>' +
      (year ? '<div class="year">' + year + '</div>' : '') +
      (overview ? '<div class="overview">' + overview + '</div>' : '') +
      (genres.length ? '<div class="genres">' + genres.map(g => '<span>' + g + '</span>').join('') + '</div>' : '') +
      '</div></div>';
  }).join('');
}

function loadVideos() {
  fetch('/api/media/video-index')
    .then(r => r.json())
    .then(data => {
      allVideos = data.videos || [];
      filteredVideos = allVideos;
      updateStats();
      renderVideos(filteredVideos);
    })
    .catch(err => {
      console.error('Error loading videos:', err);
      document.getElementById('videoGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--red)"><i class="fas fa-exclamation-triangle" style="font-size:48px;display:block;margin-bottom:16px"></i>Ошибка загрузки видео</div>';
    });
}

function searchVideos() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) {
    filteredVideos = allVideos;
    updateStats();
    renderVideos(filteredVideos);
    return;
  }
  const lq = q.toLowerCase();
  filteredVideos = allVideos.filter(v => {
    return (v.title && v.title.toLowerCase().includes(lq)) ||
           (v.filename && v.filename.toLowerCase().includes(lq)) ||
           (v.overview && v.overview.toLowerCase().includes(lq)) ||
           (v.year && String(v.year).includes(lq)) ||
           (v.genres && JSON.stringify(v.genres).toLowerCase().includes(lq));
  });
  updateStats();
  renderVideos(filteredVideos);
}

function updateStats() {
  const movies = filteredVideos.filter(v => !v.is_series && (!v.genres || !JSON.stringify(v.genres).includes('TV')));
  const series = filteredVideos.length - movies.length;
  document.getElementById('totalVideos').textContent = filteredVideos.length;
  document.getElementById('totalMovies').textContent = movies.length;
  document.getElementById('totalSeries').textContent = series;
}

function playVideo(idx) {
  const video = filteredVideos[idx];
  if (!video) return;
  document.getElementById('videoPlayerTitle').textContent = video.title || video.filename || 'Unknown';
  document.getElementById('videoPlayerYear').textContent = video.year || '';
  document.getElementById('videoPlayer').src = '/api/media/video-stream/' + video.id;
  document.getElementById('playerOverlay').classList.add('active');
}

function closeVideoPlayer() {
  document.getElementById('playerOverlay').classList.remove('active');
  const vp = document.getElementById('videoPlayer');
  vp.pause();
  vp.src = '';
}

function openModal(id) { document.getElementById(id).classList.add('active') }
function closeModal(id) { document.getElementById(id).classList.remove('active') }
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active') });
});

loadVideos();
</script>
<script src="/static/js/social-ui.js?v=6"></script>
<script src="/static/js/social-dock.js?v=7"></script>
</body>
</html>
