<!DOCTYPE html>
<html class="pg-page_education" lang="ru" data-education-skin="next">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Обучение — Infinity</title>
<link rel="stylesheet" href="/static/css/font-awesome.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box }
:root {
--bg: #fafbfc; --bg2: #ffffff; --bg3: #f3f4f6; --bg4: #e5e7eb;
--border: rgba(0, 0, 0, 0.06); --border2: rgba(0, 0, 0, 0.1);
--text: #111827; --text2: #4b5563; --text3: #9ca3af;
--accent: #4f46e5; --accent2: #4338ca;
--accent-glow: rgba(79, 70, 229, 0.15); --accent-light: rgba(79, 70, 229, 0.1);
--link: #4338ca; --card: rgba(255, 255, 255, 0.8); --hover: rgba(0, 0, 0, 0.03);
--red: #dc2626; --red-light: rgba(220, 38, 38, 0.08);
--green: #059669; --green-light: rgba(5, 150, 105, 0.08);
--yellow: #d97706; --yellow-light: rgba(217, 119, 6, 0.08);
--purple: #7c3aed; --purple-light: rgba(124, 58, 237, 0.08);
--blue: #2563eb; --orange: #ea580c;
--shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
--shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
--shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.08);
--shadow-glow: 0 0 40px rgba(79, 70, 229, 0.1);
--radius: 16px; --radius-sm: 10px; --radius-lg: 24px; --radius-xl: 32px;
--tr: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
--tr-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
--glass: rgba(255, 255, 255, 0.72); --glass-border: rgba(0, 0, 0, 0.08);
--glass-hover: rgba(255, 255, 255, 0.85);
--font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
--font-serif: 'Literata', 'Merriweather', Georgia, serif;
--font-mono: 'JetBrains Mono', monospace;
--reader-max: 720px;
}
/* Палитры dark/sepia/… убраны: все девять схем и пользовательский акцент
   приходят из design.css + theme.js — как в остальном приложении. */
html { scroll-behavior: smooth }
body {
font-family: var(--font-sans); background: var(--bg); color: var(--text);
min-height: 100vh; transition: background 0.4s, color 0.4s;
line-height: 1.6; -webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale; overflow-x: hidden;
}
body::before {
content: ''; position: fixed; inset: 0;
background:
  radial-gradient(ellipse 80% 50% at 20% -10%, var(--accent-glow), transparent),
  radial-gradient(ellipse 60% 40% at 85% 85%, rgba(168, 85, 247, 0.06), transparent),
  radial-gradient(ellipse 50% 50% at 50% 50%, rgba(59, 130, 246, 0.03), transparent);
pointer-events: none; z-index: 0; transition: opacity 0.4s;
}
::selection { background: var(--accent); color: #fff }
a { color: var(--accent); text-decoration: none; transition: var(--tr) }
a:hover { color: var(--link) }
button { font-family: inherit; border: none; cursor: pointer; outline: none; background: none }
input, textarea, select { font-family: inherit; outline: none }
::-webkit-scrollbar { width: 8px; height: 8px }
::-webkit-scrollbar-track { background: transparent }
::-webkit-scrollbar-thumb {
background: var(--border2); border-radius: 10px;
border: 2px solid var(--bg); transition: background 0.2s;
}
::-webkit-scrollbar-thumb:hover { background: var(--accent) }

.glass-panel {
background: var(--glass); backdrop-filter: blur(24px) saturate(180%);
-webkit-backdrop-filter: blur(24px) saturate(180%);
border: 1px solid var(--glass-border); border-radius: var(--radius);
box-shadow: var(--shadow);
}

.search-inp {
width: 100%; padding: 10px 14px; border: 1px solid var(--border2);
border-radius: var(--radius-sm); background: var(--bg2); color: var(--text);
font-size: 14px; transition: var(--tr-fast); outline: none;
}
.search-inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow) }

.btn {
display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
border: 1px solid var(--border2); border-radius: 12px;
background: transparent; color: var(--text2); font-size: 13px; font-weight: 500;
cursor: pointer; transition: var(--tr); font-family: inherit; white-space: nowrap;
}
.btn:hover { background: var(--hover); color: var(--text); border-color: var(--accent) }
.btn-primary {
background: linear-gradient(135deg, var(--accent), var(--accent2));
color: #fff; border-color: transparent;
box-shadow: 0 4px 16px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
.btn-primary:hover { box-shadow: 0 6px 24px var(--accent-glow); transform: translateY(-1px) }
.btn-success {
background: linear-gradient(135deg, var(--green), #047857); color: #fff; border-color: transparent;
box-shadow: 0 4px 16px rgba(5, 150, 105, 0.2);
}
.btn-success:hover { opacity: 0.9; transform: translateY(-1px) }
.btn-danger {
background: linear-gradient(135deg, var(--red), #b91c1c); color: #fff; border-color: transparent;
box-shadow: 0 4px 16px rgba(220, 38, 38, 0.2);
}
.btn-danger:hover { opacity: 0.9; transform: translateY(-1px) }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 10px }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 8px; border: none; cursor: pointer }
.btn-icon {
width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center;
justify-content: center; border: 1px solid transparent; border-radius: 12px;
background: transparent; color: var(--text2); cursor: pointer; font-size: 15px;
transition: var(--tr);
}
.btn-icon:hover { background: var(--hover); color: var(--accent) }
.btn-icon.recording {
background: var(--red-light); border-color: var(--red);
color: var(--red); animation: pulse 1s ease infinite;
}
.card {
background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 16px;
margin-bottom: 12px; box-shadow: var(--shadow-sm); transition: var(--tr);
}
.card:hover { box-shadow: var(--shadow); border-color: var(--accent); transform: translateY(-2px) }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: var(--text) }
.spinner {
width: 24px; height: 24px; border: 2px solid var(--border2);
border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }
.fb { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-top: 8px }
.fb.ok { background: var(--green-light); color: var(--green); border: 1px solid transparent }
.fb.err { background: var(--red-light); color: var(--red); border: 1px solid transparent }
.diff-badge {
display: inline-block; padding: 2px 10px; border-radius: 12px;
font-size: 11px; font-weight: 500;
}
.diff-beginner { background: var(--green-light); color: var(--green) }
.diff-intermediate { background: var(--yellow-light); color: var(--yellow) }
.diff-advanced { background: var(--red-light); color: var(--red) }

/* Modal / Panel */
.modal-overlay {
position: fixed; top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0, 0, 0, 0.5); z-index: 1000; display: none;
align-items: center; justify-content: center; backdrop-filter: blur(8px);
}
.modal-overlay.show { display: flex }
.modal-content {
background: var(--glass); backdrop-filter: blur(20px) saturate(1.4);
-webkit-backdrop-filter: blur(20px) saturate(1.4);
border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 28px;
max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto;
box-shadow: var(--shadow-lg);
animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes modalIn {
from { opacity: 0; transform: scale(0.92) translateY(16px) }
to { opacity: 1; transform: scale(1) translateY(0) }
}

/* Плавающая таблетка-тулбар убрана: меню живёт в левом рейле
   (module_rail.css), разметка — в начале кузова страницы.
   Буквальный открывающий тег кузова здесь не пишем: add_page_class ищет
   первое вхождение во всём документе и повесил бы pg- класс на комментарий. */

body.reading-mode .toolbar { display: none }
body.reading-mode .edu-sidebar { display: none }
body.reading-mode .main-content { padding-top: 0 !important }
body.reading-mode .section-tabs { display: none }
body.reading-mode .lesson-nav { display: none }
body.reading-mode .reading-bar { display: flex !important }
#readingBar { display: none }
body.reading-mode #readingBar { display: flex !important }

#readingBar {
display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999;
background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
border-bottom: 1px solid var(--glass-border); padding: 8px 16px;
}
#readingBar .rb-inner {
display: flex; align-items: center; gap: 10px; max-width: 1000px; margin: 0 auto;
}
#readingBar .rb-title {
flex: 1; font-size: 13px; font-weight: 600; overflow: hidden;
text-overflow: ellipsis; white-space: nowrap; color: var(--text);
}
#readingBar .rb-btn {
background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
padding: 6px 12px; font-size: 12px; color: var(--text2); cursor: pointer;
transition: var(--tr-fast); font-family: inherit; white-space: nowrap;
}
#readingBar .rb-btn:hover { background: var(--hover); color: var(--text) }
#readingBar .rb-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff }

/* Layout */
.layout { display: flex; height: 100vh; overflow: hidden }
.edu-sidebar {
width: 300px; min-width: 300px; background: var(--glass);
backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
border-right: 1px solid var(--glass-border); display: flex;
flex-direction: column; transition: var(--tr); z-index: 10;
}
.edu-sidebar.collapsed { width: 0; min-width: 0; overflow: hidden; border: none; opacity: 0 }
.edu-sidebar .sb-header {
padding: 16px; display: flex; align-items: center; gap: 8px;
border-bottom: 1px solid var(--glass-border); flex-shrink: 0;
}
.edu-sidebar .sb-title {
font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px;
}
.edu-sidebar .sb-chat {
flex: 1; overflow-y: auto; padding: 12px; display: flex;
flex-direction: column; gap: 8px;
}
.edu-sidebar .sb-chat::-webkit-scrollbar { width: 4px }
.edu-sidebar .sb-chat::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px }
.edu-sidebar .sb-input-area {
padding: 12px; border-top: 1px solid var(--glass-border);
display: flex; gap: 8px; background: var(--glass); flex-shrink: 0;
}
.msg {
padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px;
line-height: 1.5; max-width: 90%; animation: msgIn 0.3s ease;
}
@keyframes msgIn {
from { opacity: 0; transform: translateY(8px) }
to { opacity: 1; transform: translateY(0) }
}
.msg.user { background: var(--accent-light); align-self: flex-end; color: var(--text) }
.msg.assistant { background: var(--glass); align-self: flex-start }
.msg .speak-btn {
font-size: 10px; padding: 2px 6px; border: none; background: transparent;
color: var(--text3); cursor: pointer; float: right; border-radius: 4px;
transition: var(--tr-fast);
}
.msg .speak-btn:hover { background: var(--bg3); color: var(--accent) }

.main-content {
flex: 1; overflow-y: auto; position: relative; z-index: 1;
padding-top: 68px;
}
.main-content::-webkit-scrollbar { width: 6px }
.main-content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px }
.main-content::-webkit-scrollbar-track { background: transparent }
#appContent { padding: 16px 24px 80px; position: relative; z-index: 1; max-width: 960px; margin: 0 auto }
#appContent.reader-mode { max-width: var(--reader-max) }
#appContent.reader-mode .lesson-body {
font-family: var(--font-serif); font-size: 16px; line-height: 1.85;
}
#appContent.reader-mode .lesson-body p { margin-bottom: 14px }

/* Course grid */
.course-grid {
display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
gap: 16px; padding: 4px;
}
.course-card {
background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 18px;
cursor: pointer; transition: var(--tr); box-shadow: var(--shadow-sm);
position: relative; overflow: hidden;
}
.course-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--accent) }
.course-card .mat-count {
position: absolute; top: 8px; right: 8px; font-size: 10px; padding: 2px 8px;
background: var(--accent-light); color: var(--accent); border-radius: 8px; font-weight: 600;
}
.course-card .cc-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; padding-right: 50px }
.course-card .cc-meta { font-size: 12px; color: var(--text2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center }

/* Section tabs */
.section-tabs {
display: flex; gap: 4px; margin-bottom: 16px; overflow-x: auto; padding: 4px;
background: var(--glass); backdrop-filter: blur(12px);
border: 1px solid var(--glass-border); border-radius: var(--radius); width: fit-content;
}
.section-tab {
padding: 8px 16px; border: none; background: transparent; color: var(--text3);
cursor: pointer; font-size: 13px; font-weight: 500; border-radius: 10px;
transition: var(--tr); white-space: nowrap; font-family: inherit;
}
.section-tab:hover { background: var(--hover); color: var(--text) }
.section-tab.active {
background: linear-gradient(135deg, var(--accent), var(--accent2));
color: #fff; box-shadow: 0 2px 8px var(--accent-glow);
}
.slide-up { animation: slideUp 0.35s ease }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }

/* Homework */
.homework-section {
padding: 20px; background: var(--glass); backdrop-filter: blur(8px);
border: 1px solid var(--glass-border); border-radius: var(--radius);
}

/* Quiz */
.quiz-container { max-width: 700px; margin: 0 auto }
.quiz-q {
padding: 16px; background: var(--glass); backdrop-filter: blur(8px);
border: 1px solid var(--glass-border); border-radius: var(--radius-sm); margin-bottom: 10px;
}
.quiz-q .q-text { font-size: 14px; font-weight: 500; margin-bottom: 10px; line-height: 1.5; color: var(--text) }
.quiz-q .q-meta { font-size: 11px; color: var(--text3); margin-bottom: 6px }
.quiz-opt {
padding: 8px 14px; margin: 4px 0; border: 1px solid var(--border2);
border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
transition: var(--tr-fast); background: var(--bg2);
}
.quiz-opt:hover { border-color: var(--accent); background: var(--accent-light) }
.quiz-opt.sel { border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 600 }
.quiz-opt.correct { border-color: var(--green); background: var(--green-light); color: var(--green) }
.quiz-opt.wrong { border-color: var(--red); background: var(--red-light); color: var(--red) }
.quiz-fb { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-top: 8px }
.quiz-fb.correct { background: var(--green-light); color: var(--green) }
.quiz-fb.wrong { background: var(--red-light); color: var(--red) }
.test-ta {
width: 100%; min-height: 80px; padding: 10px 14px; border: 1px solid var(--border2);
border-radius: var(--radius-sm); background: var(--bg2); color: var(--text);
font-size: 13px; resize: vertical; outline: none; transition: var(--tr-fast);
}
.test-ta:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow) }

/* Flashcards */
.flashcard-container { perspective: 1000px; cursor: pointer; margin: 12px auto; max-width: 400px }
.flashcard {
position: relative; width: 100%; min-height: 180px; transition: transform 0.5s;
transform-style: preserve-3d; border-radius: var(--radius); box-shadow: var(--shadow);
}
.flashcard.flipped { transform: rotateY(180deg) }
.flashcard-face {
position: absolute; top: 0; left: 0; width: 100%; min-height: 180px;
backface-visibility: hidden; display: flex; align-items: center;
justify-content: center; padding: 24px; border-radius: var(--radius);
background: var(--card); border: 1px solid var(--glass-border);
}
.flashcard-back { transform: rotateY(180deg); background: var(--accent-light); border-color: var(--accent) }
.flashcard-nav { display: flex; justify-content: center; gap: 12px; align-items: center; margin-top: 8px }
.flashcard-hint { text-align: center; font-size: 12px; color: var(--text3); margin-top: 6px }
.front-text { font-size: 18px; font-weight: 600; text-align: center; color: var(--text) }
.back-text { font-size: 15px; text-align: center; color: var(--text); line-height: 1.5 }

/* Key terms */
.key-terms { display: flex; flex-wrap: wrap; gap: 6px }
.key-term {
display: inline-flex; align-items: baseline; gap: 4px; padding: 4px 10px;
background: var(--glass); border: 1px solid var(--glass-border);
border-radius: 12px; font-size: 12px;
}
.term { font-weight: 600; color: var(--accent) }
.def { color: var(--text2) }

/* Lesson body typography */
.lesson-body { font-size: 15px; line-height: 1.75; color: var(--text) }
.lesson-body p { margin-bottom: 12px }
.lesson-body h2 { margin: 20px 0 10px; font-size: 18px; color: var(--text); font-weight: 700 }
.lesson-body h3 { margin: 18px 0 8px; font-size: 16px; color: var(--accent); font-weight: 600 }
.lesson-body h4 { margin: 14px 0 6px; font-size: 15px; color: var(--text2); font-weight: 600 }
.lesson-body h5 { margin: 12px 0 5px; font-size: 14px; color: var(--text2); font-weight: 600 }
.lesson-body h6 { margin: 10px 0 4px; font-size: 13px; color: var(--text3); font-weight: 600 }
.lesson-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px }
.lesson-body th, .lesson-body td { padding: 8px 12px; border: 1px solid var(--border); text-align: left }
.lesson-body th { background: var(--bg3); font-weight: 600; color: var(--text2) }
.lesson-body hr { border: none; border-top: 1px solid var(--border); margin: 16px 0 }
.lesson-body img { max-width: 100%; border-radius: 8px; margin: 12px 0 }
.lesson-body a { color: var(--accent); text-decoration: underline }
.lesson-body ul, .lesson-body ol { padding-left: 22px; margin: 10px 0 }
.lesson-body li { margin-bottom: 6px }
.lesson-body blockquote {
border-left: 3px solid var(--accent); padding: 10px 16px; margin: 14px 0;
background: var(--glass); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
font-style: italic; color: var(--text2); font-size: 14px;
}
.lesson-body code {
background: var(--bg3); padding: 2px 6px; border-radius: 4px;
font-family: var(--font-mono); font-size: 13px;
}
.lesson-body pre {
background: var(--bg3); padding: 14px; border-radius: var(--radius-sm);
overflow-x: auto; margin: 12px 0; border: 1px solid var(--border);
}
.lesson-body pre code { background: none; padding: 0 }

/* Ordering */
.order-item {
padding: 8px 12px; background: var(--bg2); border: 1px solid var(--border);
border-radius: var(--radius-sm); margin-bottom: 4px; cursor: grab; font-size: 13px;
}
.order-item:active { cursor: grabbing }
.ordering-list .order-item.dragging { opacity: 0.5 }
.ordering-list .order-item.drag-over { border-color: var(--accent); background: var(--accent-light) }

/* Material items */
.material-item {
display: flex; align-items: center; gap: 10px; padding: 8px 12px;
border-radius: var(--radius-sm); cursor: pointer; transition: var(--tr-fast); font-size: 13px;
}
.material-item:hover { background: var(--bg3); color: var(--accent) }
.material-list { max-height: 300px; overflow-y: auto }
.material-list .material-item { border-bottom: 1px solid var(--border) }

/* Toast */
#toast {
position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999;
display: none; font-size: 13px; padding: 10px 20px; border-radius: var(--radius-sm);
box-shadow: var(--shadow-lg); max-width: 400px; text-align: center;
animation: slideUp 0.3s ease;
}
#toast .ok { background: var(--green-light); color: var(--green); border: 1px solid var(--green) }
#toast .err { background: var(--red-light); color: var(--red); border: 1px solid var(--red) }
#toast .info { background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent) }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text3) }
.empty-state i { font-size: 48px; display: block; margin-bottom: 16px; color: var(--text3) }

.progress-bar { height: 4px; background: var(--bg4); border-radius: 4px; overflow: hidden }
.progress-bar .fill {
height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple));
border-radius: 4px; transition: width 0.5s ease;
}
.progress-bar .fill.done { background: var(--green) }

.gen-banner {
background: var(--accent-light); border: 1px solid var(--accent); padding: 10px 16px;
border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 12px;
display: flex; align-items: center; gap: 8px; color: var(--accent);
}
.gen-progress-ring { display: flex; align-items: center; gap: 16px; flex-wrap: wrap }
.gen-phase-dot {
width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px;
}
.gen-phase-dot.done { background: var(--green) }
.gen-phase-dot.active { background: var(--accent); animation: pulse 1.5s infinite }
.gen-phase-dot.pending { background: var(--border2) }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.5 } }

@media (max-width: 768px) {
#appContent { padding: 12px 14px 80px }
.course-grid { grid-template-columns: 1fr }
.section-tabs { width: 100%; overflow-x: auto }
}
</style>

<script>
// ========== STATE ==========
const S={currentId:null,chatId:null,lesson:0,courseView:'list',_quizAnswers:{},_quizSubmitted:false,_quizPage:0,_loadingCourse:false,_fcTerms:[],_fcIdx:0,pollId:null,currentCourse:null,sidebar:false};
let _materialBooks=[],_materialZim=[],_currentZimFile='';

// ========== THEME ==========
// Единая тема приложения: девять схем и акцент из theme.js. Старый
// локальный ключ eduTheme переносим один раз, чтобы выбор не потерялся.
const _THEMES=['light','dark','sepia','warm','paper','ocean','forest','midnight','rose'];
const _THEME_ICONS={light:'fa-sun',dark:'fa-moon',sepia:'fa-book',warm:'fa-fire',paper:'fa-file',ocean:'fa-water',forest:'fa-tree',midnight:'fa-star',rose:'fa-flower'};

function _migrateLegacyTheme(){
  try{
    const legacy=localStorage.getItem('eduTheme');
    if(!legacy)return;
    if(!localStorage.getItem('infinity_theme'))localStorage.setItem('infinity_theme',legacy);
    localStorage.removeItem('eduTheme');
  }catch(e){/* приватный режим */}
}
function getTheme(){
  try{if(window.InfinityTheme)return InfinityTheme.get()}catch(e){/* */}
  try{return document.documentElement.getAttribute('data-theme')||localStorage.getItem('infinity_theme')||'light'}
  catch(e){return 'light'}
}
// theme.js сам снимает предыдущий класс; fallback не трогает другие классы
// кузова страницы (pg-… для mobile.css), которые ставит сервер.
function setTheme(t){
  t=_THEMES.indexOf(t)>=0?t:'light';
  const fb=()=>{
    _THEMES.forEach(c=>document.body.classList.remove(c));
    document.body.classList.add(t);
    document.documentElement.setAttribute('data-theme',t);
    try{localStorage.setItem('infinity_theme',t)}catch(e){/* */}
  };
  try{if(window.InfinityTheme)InfinityTheme.set(t);else fb()}catch(e){fb()}
  _themeIcons(t);
}
function _themeIcons(t){
  const ic=_THEME_ICONS[t]||'fa-sun';
  // Меняем только класс иконки: рейловая кнопка несёт ещё и подпись <span>,
  // а innerHTML с одной иконкой её затирал — в меню оставалась голотая шестерня.
  ['themeBtn','themeBtn2'].forEach(id=>{
    const i=document.querySelector('#'+id+' i');
    if(i)i.className='fas '+ic;
  });
}
function cycleTheme(){
  const next=_THEMES[(_THEMES.indexOf(getTheme())+1)%_THEMES.length];
  setTheme(next);
  toast('Тема: '+next,'info');
}
_migrateLegacyTheme();
setTheme(getTheme());

// ========== UTILITY ==========
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function jsEsc(s){return String(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function nl2br(s){return String(s).replace(/\n/g,'<br>')}
function toast(m,t){const el=document.getElementById('toast');if(!el)return;el.innerHTML='<div class="'+(t==='ok'?'ok':t==='err'?'err':'info')+'">'+esc(m)+'</div>';el.style.display='block';setTimeout(()=>el.style.display='none',3000)}
function diffBadge(d){const m={beginner:'Начинающий',intermediate:'Средний',advanced:'Продвинутый'};return '<span class="diff-badge diff-'+d+'">'+(m[d]||d)+'</span>'}
function _ruPlural(n,one,few,many){const a=n%10,b=n%100;if(a===1&&b!==11)return one;if(a>=2&&a<=4&&(b<12||b>14))return few;return many}
function toggleSidebar(){const el=document.getElementById('sidebar');S.sidebar=!S.sidebar;el.classList.toggle('collapsed')}
function toggleReadingMode(){
  document.body.classList.toggle('reading-mode');
  const btn=document.getElementById('readingBtn');
  if(btn)btn.innerHTML=document.body.classList.contains('reading-mode')?'<i class="icon fas fa-times"></i><span>Выйти из чтения</span>':'<i class="icon fas fa-book-open"></i><span>Читать</span>';
  const ac=document.getElementById('appContent');
  if(ac)ac.classList.toggle('reader-mode');
  const rb=document.getElementById('rbTitle');
  if(rb&&S.currentCourse){const l=S.currentCourse.plan?.lessons?.[S.lesson];if(l)rb.textContent=l.title||''}
}
function exitReadingMode(){
  document.body.classList.remove('reading-mode');
  const btn=document.getElementById('readingBtn');
  if(btn)btn.innerHTML='<i class="icon fas fa-book-open"></i><span>Читать</span>';
  const ac=document.getElementById('appContent');
  if(ac)ac.classList.remove('reader-mode');
}

// ========== MATERIALS MODAL ==========
function openMaterialsModal(){
  let h='<button class="btn btn-sm" onclick="closeMaterialsModal()"><i class="fas fa-times"></i> Закрыть</button>';
  h+='<h3><i class="fas fa-paperclip" style="color:var(--accent)"></i> Прикрепить материалы</h3>';
  h+='<div style="display:flex;gap:8px;margin-bottom:12px">';
  h+='<button class="btn btn-sm" onclick="showBookSearch()"><i class="fas fa-book"></i> Книги</button>';
  h+='<button class="btn btn-sm" onclick="showZimSearch()"><i class="fas fa-archive"></i> ZIM</button>';
  h+='<button class="btn btn-sm" onclick="showFileUpload()"><i class="fas fa-upload"></i> Файл с ПК</button>';
  h+='</div>';
  h+='<div id="materialModalBody"><p style="font-size:13px;color:var(--text3);text-align:center;padding:30px">Выберите источник материалов</p></div>';
  h+='<div id="materialBadge" style="font-size:11px;color:var(--text3);margin-top:8px"></div>';
  const modal=document.createElement('div');modal.id='matModal';
  modal.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1001;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';
  modal.innerHTML='<div class="modal-content">'+h+'</div>';
  modal.onclick=e=>{if(e.target===modal)closeMaterialsModal()};
  document.body.appendChild(modal);
  updateMaterialBadge();
}
function closeMaterialsModal(){const m=document.getElementById('matModal');if(m)m.remove()}
function updateMaterialBadge(){const el=document.getElementById('materialBadge');if(!el)return;fetch('/api/education/buffer').then(r=>r.json()).then(buf=>{const m=buf&&buf.materials?buf.materials:buf||[];if(m.length)el.innerHTML='<i class="fas fa-paperclip" style="color:var(--accent)"></i> Прикреплено: '+m.length+' ('+m.map(x=>esc(x.title||'')).join(', ')+')';else el.innerHTML='<i class="fas fa-paperclip"></i> Нет прикреплённых материалов'}).catch(()=>{})}

// ========== BOOK SEARCH (client-side filter) ==========
let _bookSearchTimer,_allBooks=[];
async function showBookSearch(){
  const body=document.getElementById('materialModalBody');
  let h='<input type="text" class="search-inp" id="bookSearchInp" placeholder="Поиск книг..." oninput="debounceSearchBooks()">';
  h+='<div class="material-list" id="bookList" style="max-height:300px;overflow-y:auto;margin-top:8px">';
  h+='<div class="spinner" style="margin:10px auto;display:block"></div></div>';
  body.innerHTML=h;
  try{
    const r=await fetch('/api/collection/books?page=1&page_size=200');const d=await r.json();
    if(!r.ok)throw new Error('HTTP '+r.status);
    _allBooks=Array.isArray(d)?d:(d.books||d.items||[]);
    renderBookList(document.getElementById('bookSearchInp')?.value||'');
  }catch(e){
    document.getElementById('bookList').innerHTML='<p style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Библиотека недоступна</p>';
    document.getElementById('materialModalBody').innerHTML+='<input type="text" class="search-inp" id="bookManualInp" placeholder="Введите название книги..." style="margin-top:8px"><div style="margin-top:8px"><button class="btn btn-sm btn-primary" onclick="attachManualBook()"><i class="fas fa-paperclip"></i> Прикрепить</button></div><p style="color:var(--text3);font-size:11px;margin-top:4px">Или введите название вручную</p>';
  }
}
function renderBookList(q){
  const list=document.getElementById('bookList');if(!list)return;
  const books=_allBooks||[];
  if(!q){list.innerHTML='<p style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Всего книг: '+books.length+'. Введите название для поиска.</p>';return}
  const ql=q.toLowerCase();
  const filtered=books.filter(b=>(b.title||b.name||'').toLowerCase().includes(ql));
  if(filtered.length===0){list.innerHTML='<p style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Ничего не найдено</p>';return}
  let html='';
  filtered.forEach((b,i)=>{
    const title=b.title||b.name||'Книга';
    const idx=_allBooks.indexOf(b);
    html+='<div class="material-item" onclick="attachBook('+idx+')"><i class="fas fa-book" style="color:var(--accent)"></i><span>'+esc(title)+'</span></div>';
  });
  list.innerHTML=html;
}
function debounceSearchBooks(){clearTimeout(_bookSearchTimer);_bookSearchTimer=setTimeout(()=>renderBookList(document.getElementById('bookSearchInp')?.value||''),150)}
function attachManualBook(){
  const inp=document.getElementById('bookManualInp');if(!inp||!inp.value.trim())return;
  const title=inp.value.trim();
  fetch('/api/education/receive-material',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'book',path:'',title:title})}).then(()=>{toast('Книга прикреплена: '+title,'ok');updateMaterialBadge()}).catch(()=>toast('Ошибка','err'));
}
async function attachBook(idx){
  const book=_allBooks[idx];if(!book)return;
  const title=book.title||book.name||'Книга';const path='collection://'+(book.id||'');
  try{await fetch('/api/education/receive-material',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'book',path:path,title:title})});toast('Книга прикреплена: '+title,'ok');updateMaterialBadge()}catch(e){toast('Ошибка','err')}
}

// ========== ZIM SEARCH (client-side filter) ==========
let _zimSearchTimer,_zimAllEntries=[];
async function showZimSearch(){
  const body=document.getElementById('materialModalBody');
  try{
    const r=await fetch('/api/zim/files');const zips=await r.json();
    if(!Array.isArray(zips))zips=[];_materialZim=zips;
    let h='<select class="search-inp" id="zimSelect" onchange="onZimSelectChange()">';
    h+='<option value="">Выберите ZIM-файл</option>';
    if(zips.length===0)h+='<option value="" disabled>Нет ZIM-файлов</option>';
    else (zips||[]).forEach((z,i)=>{const name=z.name||z.file||z.path||'ZIM '+(i+1);h+='<option value="'+i+'">'+esc(name)+'</option>'});
    h+='</select><input type="text" class="search-inp" id="zimSearchInp" placeholder="Поиск по ZIM..." oninput="debounceSearchZim()" style="margin-top:8px" disabled>';
    h+='<div id="zimResults" style="margin-top:8px;max-height:300px;overflow-y:auto"><p style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Выберите ZIM-файл и введите запрос</p></div>';
    body.innerHTML=h;
  }catch(e){
    body.innerHTML='<input type="text" class="search-inp" id="zimManualInp" placeholder="Введите путь к ZIM-файлу..."><div style="margin-top:8px"><button class="btn btn-sm btn-primary" onclick="attachManualZim()"><i class="fas fa-paperclip"></i> Прикрепить</button></div><p style="color:var(--text3);font-size:11px;margin-top:8px">Не удалось загрузить список ZIM. Укажите путь вручную.</p>';
  }
}
async function onZimSelectChange(){
  const sel=document.getElementById('zimSelect');const inp=document.getElementById('zimSearchInp');
  if(inp)inp.disabled=!sel||!sel.value;
  if(sel&&sel.value){
    const idx=parseInt(sel.value);const zim=_materialZim[idx];_currentZimFile=zim.path||zim.file||zim.name||'';
    _zimAllEntries=[];const res=document.getElementById('zimResults');
    if(res)res.innerHTML='<div class="spinner" style="margin:10px auto;display:block"></div>';
    try{
      const r=await fetch('/api/zim/list?f='+encodeURIComponent(_currentZimFile)+'&p=1&n=300');const d=await r.json();
      _zimAllEntries=d.items||d||[];
      if(res)res.innerHTML='<p style="color:var(--text3);font-size:13px;text-align:center;padding:10px">Загружено '+_zimAllEntries.length+' записей. Введите запрос.</p>';
    }catch(e){
      if(res)res.innerHTML='<p style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Не удалось загрузить список. Используйте поиск.</p>';
    }
  }
}
function debounceSearchZim(){clearTimeout(_zimSearchTimer);_zimSearchTimer=setTimeout(doSearchZim,200)}
async function doSearchZim(){
  const inp=document.getElementById('zimSearchInp');if(!inp)return;
  const q=inp.value.trim();const res=document.getElementById('zimResults');
  if(!q||!_currentZimFile){res.innerHTML='<p style="color:var(--text3);font-size:13px;text-align:center;padding:10px">Введите запрос</p>';return}
  // client-side filter first
  const ql=q.toLowerCase();
  const local=_zimAllEntries.filter(e=>(e.title||e.path||'').toLowerCase().includes(ql));
  if(local.length>0){
    let html='';local.slice(0,50).forEach((e,i)=>{
      const title=e.title||e.path||'Запись';const sel=document.getElementById('zimSelect');const idx=sel?parseInt(sel.value):0;
      html+='<div class="material-item" onclick="attachZim('+idx+',\''+jsEsc(e.path||'')+'\',\''+jsEsc(title)+'\')"><i class="fas fa-file-alt" style="color:var(--green)"></i><span>'+esc(title)+'</span></div>';
    });res.innerHTML=html;return;
  }
  // fallback to server-side search
  res.innerHTML='<div class="spinner" style="margin:10px auto;display:block"></div>';
  try{
    const r=await fetch('/api/zim/search?f='+encodeURIComponent(_currentZimFile)+'&q='+encodeURIComponent(q));const d=await r.json();
    const items=d.items||d||[];let html='';
    if(items.length===0)html='<p style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Ничего не найдено</p>';
    else{items.slice(0,50).forEach((e,i)=>{const title=e.title||e.path||'Запись '+(i+1);const sel=document.getElementById('zimSelect');const idx=sel?parseInt(sel.value):0;html+='<div class="material-item" onclick="attachZim('+idx+',\''+jsEsc(e.path||'')+'\',\''+jsEsc(title)+'\')"><i class="fas fa-file-alt" style="color:var(--green)"></i><span>'+esc(title)+'</span></div>'});}
    res.innerHTML=html;
  }catch(e){res.innerHTML='<p style="color:var(--red);font-size:13px;text-align:center">Ошибка поиска</p>'}
}
function attachManualZim(){
  const inp=document.getElementById('zimManualInp');if(!inp||!inp.value.trim())return;
  const path=inp.value.trim();
  fetch('/api/education/receive-material',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'zim',file:path,path:'/',title:path})}).then(()=>{toast('ZIM прикреплён: '+path,'ok');updateMaterialBadge()}).catch(()=>toast('Ошибка','err'));
}
async function attachZim(zimIdx,entryPath,title){
  const zim=_materialZim[zimIdx];if(!zim)return;const fp=zim.path||zim.file||zim.name||'';
  try{await fetch('/api/education/receive-material',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'zim',file:fp,path:entryPath,title:title})});toast('ZIM-статья прикреплена: '+title,'ok');updateMaterialBadge()}catch(e){toast('Ошибка','err')}
}

// ========== FILE UPLOAD ==========
function showFileUpload(){
  const body=document.getElementById('materialModalBody');
  let h='<p style="font-size:13px;color:var(--text2);margin-bottom:8px">Выберите файл с компьютера (.txt, .pdf, .epub, .fb2, .docx)</p>';
  h+='<input type="file" id="fileUploadInp" class="search-inp" accept=".txt,.pdf,.epub,.fb2,.docx,.md" onchange="uploadFile()">';
  h+='<div id="fileUploadStatus" style="font-size:12px;color:var(--text3);margin-top:8px"></div>';
  body.innerHTML=h;
}
async function uploadFile(){
  const inp=document.getElementById('fileUploadInp');if(!inp||!inp.files||!inp.files.length)return;
  const file=inp.files[0];const status=document.getElementById('fileUploadStatus');status.textContent='Загрузка...';
  const fd=new FormData();fd.append('file',file);
  try{const r=await fetch('/api/education/upload-material',{method:'POST',body:fd});const d=await r.json();if(d.ok){toast('Файл прикреплён: '+file.name,'ok');updateMaterialBadge();status.textContent='Готово'}else{toast(d.error||'Ошибка','err');status.textContent=d.error||'Ошибка'}}catch(e){status.textContent='Ошибка загрузки'}
}

// ========== LIST COURSES ==========
let _foldersCache=[];
let _coursesCache=[];
let _foldCollapse={};
try{_foldCollapse=JSON.parse(localStorage.getItem('eduFoldCollapse')||'{}')}catch(e){_foldCollapse={}}
function _saveFoldCollapse(){try{localStorage.setItem('eduFoldCollapse',JSON.stringify(_foldCollapse))}catch(e){}}
function toggleFolderCollapse(key){_foldCollapse[key]=!_foldCollapse[key];_saveFoldCollapse();loadCourses()}

function _courseCard(c){
  const statusMap={queued:'В очереди',analyzing:'Анализ...',materials_loaded:'Загрузка материалов',analyzed:'Готово к генерации',plan_ready:'План готов',generating:'Генерация...',ready:'Готов',learning:'В процессе',completed:'Завершён',error:'Ошибка'};
  const pct=c.progress?Math.round((c.progress.completed_lessons||[]).length/(c.lessons_count||1)*100):0;
  const sc=statusMap[c.status]||c.status;
  const mc=c.materials_count||0;
  const doneCount=(c.progress&&c.progress.completed_lessons||[]).length;
  const canContinue=['ready','learning','paused','completed'].includes(c.status)&&(c.lessons_count||0)>0;
  return `<div class="course-card" onclick="openCourse('${c.id}')">
        ${mc?`<span class="mat-count"><i class="fas fa-paperclip"></i> ${mc}</span>`:''}
        <h3 style="font-size:15px;font-weight:600;margin-bottom:6px">${esc(c.title||'Без названия')}</h3>
        <div style="font-size:12px;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          ${diffBadge(c.difficulty||'beginner')}
          <span><i class="fas fa-book-open" style="color:var(--accent)"></i> ${c.lessons_count||0} уроков</span>
          <span style="color:${c.status==='error'?'var(--red)':c.status==='completed'?'var(--green)':c.status==='ready'?'var(--accent)':'var(--text3)'}"><i class="fas fa-${c.status==='error'?'exclamation-circle':c.status==='completed'?'check-circle':c.status==='ready'?'check':'spinner fa-pulse'}"></i> ${sc}</span>
        </div>
        <div class="progress-bar" style="margin-top:10px"><div class="fill ${c.status==='completed'?'done':''}" style="width:${pct}%"></div></div>
        <div style="margin-top:8px;font-size:11px;color:var(--text3)">${doneCount} из ${c.lessons_count||0} уроков пройдено</div>
        <div style="margin-top:10px;display:flex;gap:4px">
          ${canContinue?`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();continueCourse('${c.id}')" title="Продолжить с последнего пройденного урока"><i class="fas fa-play"></i> Продолжить</button>`:''}
          ${['queued','analyzing','materials_loaded','analyzed','plan_ready'].includes(c.status)?`<button class="btn btn-sm" style="color:var(--yellow);border-color:var(--yellow)" onclick="event.stopPropagation();fetch('/api/education/course/'+'${c.id}'+'/pause',{method:'POST'});toast('Пауза...','info');loadCourses()"><i class="fas fa-pause"></i></button>`:''}
          ${c.status==='paused'?`<button class="btn btn-sm" style="color:var(--green);border-color:var(--green)" onclick="event.stopPropagation();fetch('/api/education/course/'+'${c.id}'+'/resume',{method:'POST'});toast('Продолжение...','info');loadCourses()"><i class="fas fa-play"></i></button>`:''}
          <button class="btn btn-sm" onclick="event.stopPropagation();openMoveModal('${c.id}')" title="Переместить в папку"><i class="fas fa-folder-tree" style="color:var(--yellow)"></i></button>
          <button class="btn btn-sm" onclick="event.stopPropagation();editCourse('${c.id}')"><i class="fas fa-edit"></i></button>
          <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteCourse('${c.id}')"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
}

async function loadCourses(){
  const el=document.getElementById('appContent');
  let h='<header class="edu-hero">';
  h+='<div class="edu-hero-copy"><span class="edu-hero-kicker"><i class="fas fa-graduation-cap"></i> Лента курсов</span>';
  h+='<h1>Мои курсы</h1><p id="eduHeroSub">Курсы генерирует AI-тьютор по вашим материалам</p></div>';
  h+='<div class="edu-hero-actions">';
  h+='<button class="hero-btn" onclick="showGamification()" title="Достижения"><i class="fas fa-trophy"></i><span>Достижения</span></button>';
  h+='<button class="hero-btn" onclick="createFolderUI()" title="Создать папку для курсов"><i class="fas fa-folder-plus"></i><span>Папка</span></button>';
  h+='<button class="hero-btn" onclick="loadCourses()" title="Обновить список"><i class="fas fa-sync"></i><span>Обновить</span></button>';
  h+='<button class="hero-btn primary" onclick="showCreatePanel()"><i class="fas fa-plus"></i><span>Создать курс</span></button>';
  h+='</div></header>';
  h+='<div id="courseList">';
  h+='<div class="spinner" style="margin:40px auto;display:block"></div></div>';
  el.innerHTML=h;
  try{
    const [rC,rF]=await Promise.all([fetch('/api/education/courses'),fetch('/api/education/folders').catch(()=>null)]);
    const resp=await rC.json();
    const courses=resp.courses||resp||[];
    let folders=[];
    if(rF&&rF.ok){const fr=await rF.json();folders=fr.folders||[]}
    _foldersCache=folders;_coursesCache=courses;
    const list=document.getElementById('courseList');
    if(!courses||!courses.length){list.innerHTML='<div class="empty-state"><i class="fas fa-graduation-cap"></i><h3>Нет курсов</h3><p style="font-size:13px;margin-top:8px">Создайте первый учебный курс</p><button class="btn btn-primary" style="font-size:14px;padding:10px 24px;margin-top:16px" onclick="showCreatePanel()"><i class="fas fa-plus"></i> Создать курс</button></div>';return}
    let g='';
    folders.forEach(f=>{
      const fc=courses.filter(c=>c.folder_id===f.id);
      const key='f_'+f.id;const col=_foldCollapse[key];
      g+=`<div style="margin:${f===folders[0]?'4px':'14px'} 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="toggleFolderCollapse('${key}')" title="${col?'Развернуть':'Свернуть'}"><i class="fas fa-${col?'chevron-right':'chevron-down'}"></i></button>
        <h3 style="margin:0;font-size:15px"><i class="fas fa-folder" style="color:var(--yellow)"></i> ${esc(f.name)} <span style="color:var(--text3);font-weight:400;font-size:12px">(${fc.length})</span></h3>
        <span style="flex:1"></span>
        <button class="btn btn-sm" onclick="renameFolderUI('${f.id}')" title="Переименовать"><i class="fas fa-pen"></i></button>
        <button class="btn btn-sm btn-danger" onclick="deleteFolderUI('${f.id}')" title="Удалить папку"><i class="fas fa-trash"></i></button>
      </div>`;
      if(col){g+='<div style="font-size:12px;color:var(--text3);padding:2px 12px 10px">Папка свернута</div>'}
      else if(fc.length){g+='<div class="course-grid">'+fc.map(_courseCard).join('')+'</div>'}
      else{g+='<div style="font-size:12px;color:var(--text3);padding:2px 12px 10px">Папка пуста</div>'}
    });
    const root=courses.filter(c=>!c.folder_id||!folders.some(f=>f.id===c.folder_id));
    if(folders.length&&root.length){
      g+=`<div style="margin:14px 0 6px;display:flex;align-items:center;gap:8px"><h3 style="margin:0;font-size:15px;color:var(--text2)"><i class="fas fa-folder-open" style="color:var(--text3)"></i> Без папки <span style="color:var(--text3);font-weight:400;font-size:12px">(${root.length})</span></h3></div>`;
    }
    if(root.length){g+='<div class="course-grid">'+root.map(_courseCard).join('')+'</div>'}
    const done=courses.filter(c=>c.status==='completed').length;
    const learning=courses.filter(c=>c.status==='learning'||c.status==='paused').length;
    const sub=document.getElementById('eduHeroSub');
    if(sub)sub.textContent=courses.length
      ? courses.length+' '+_ruPlural(courses.length,'курс','курса','курсов')+
        ' · пройдено '+done+' · в работе '+learning
      : 'Курсы генерирует AI-тьютор по вашим материалам';
    list.innerHTML=g;
  }catch(e){document.getElementById('courseList').innerHTML='<p style="color:var(--red);text-align:center;padding:20px">Ошибка загрузки</p>'}
}

// ========== FOLDERS UI ==========
async function createFolderUI(){
  const name=await InfinityDialogs.prompt({label:'Название новой папки:'});if(name===null)return;
  const n=name.trim();if(!n)return toast('Введите название папки','err');
  try{
    const r=await fetch('/api/education/folders/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
    const d=await r.json();
    if(d.ok){toast('Папка создана','ok');loadCourses()}else toast(d.error||'Ошибка','err');
  }catch(e){toast('Ошибка','err')}
}
async function renameFolderUI(fid){
  const f=_foldersCache.find(x=>x.id===fid);
  const name=await InfinityDialogs.prompt({label:'Новое название папки:', value:f?f.name:''});if(name===null)return;
  const n=name.trim();if(!n)return;
  try{
    const r=await fetch('/api/education/folders/'+fid+'/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
    const d=await r.json();
    if(d.ok){toast('Папка переименована','ok');loadCourses()}else toast(d.error||'Ошибка','err');
  }catch(e){toast('Ошибка','err')}
}
async function deleteFolderUI(fid){
  const f=_foldersCache.find(x=>x.id===fid);
  if(!confirm('Удалить папку «'+(f?f.name:'')+'»? Курсы из неё вернутся в общий список.'))return;
  try{
    const r=await fetch('/api/education/folders/'+fid+'/delete',{method:'POST'});
    const d=await r.json();
    if(d.ok){toast('Папка удалена'+(d.courses_moved?' ('+d.courses_moved+' курсов возвращено в список)':''),'ok');delete _foldCollapse['f_'+fid];_saveFoldCollapse();loadCourses()}else toast(d.error||'Ошибка','err');
  }catch(e){toast('Ошибка','err')}
}
function closeMoveModal(){const m=document.getElementById('moveModal');if(m)m.remove()}
function openMoveModal(cid){
  const cur=_coursesCache.find(c=>c.id===cid);
  let h='<button class="btn btn-sm" onclick="closeMoveModal()"><i class="fas fa-times"></i> Закрыть</button>';
  h+='<h3 style="margin-top:8px"><i class="fas fa-folder-tree" style="color:var(--yellow)"></i> Переместить курс</h3>';
  h+='<p style="font-size:12px;color:var(--text3)">«'+esc(cur?cur.title:'')+'» — выберите папку:</p>';
  h+='<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:50vh;overflow:auto">';
  const isRoot=!cur||!cur.folder_id;
  h+=`<button class="btn btn-sm" ${isRoot?'disabled':''} onclick="moveCourseTo('${cid}','')"><i class="fas fa-folder-open"></i> Без папки${isRoot?' ✓':''}</button>`;
  _foldersCache.forEach(f=>{
    const isCur=cur&&cur.folder_id===f.id;
    h+=`<button class="btn btn-sm" ${isCur?'disabled':''} onclick="moveCourseTo('${cid}','${f.id}')"><i class="fas fa-folder" style="color:var(--yellow)"></i> ${esc(f.name)}${isCur?' ✓':''}</button>`;
  });

  h+='</div>';
  const modal=document.createElement('div');modal.id='moveModal';
  modal.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1001;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';
  modal.innerHTML='<div class="modal-content">'+h+'</div>';
  modal.onclick=e=>{if(e.target===modal)closeMoveModal()};

}
async function moveCourseTo(cid,fid){
  try{
    const r=await fetch('/api/education/course/'+cid+'/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder_id:fid||null})});
    const d=await r.json();
    if(d.ok){toast('Курс перемещён','ok');closeMoveModal();loadCourses()}else toast(d.error||'Ошибка','err');
  }catch(e){toast('Ошибка','err')}

// Опция «взять материал из векторной базы»: сначала проверяем, что по теме
// курса там вообще что-то есть, иначе генерация пойдёт без контекста.
async function probeVectorDb(){
  const q=document.getElementById('cq')?.value?.trim();
  const box=document.getElementById('vecProbeInfo');
  if(!q){toast('Сначала введите тему курса','info');if(box)box.textContent='Сначала введите тему';return}
  if(box)box.textContent='Поиск...';
  try{
    const r=await fetch('/api/qdrant/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,k:5})});
    const d=await r.json();
    if(d.error){if(box)box.textContent='Ошибка: '+d.error;return}
    const res=d.results||[];
    if(box)box.innerHTML=res.length
      ?('<i class="fas fa-check" style="color:var(--green)"></i> Найдено фрагментов: '+res.length+' · '+esc(d.collection||''))
      :('<i class="fas fa-circle-info"></i> В базе «'+esc(d.collection||'')+'» по теме ничего нет');
    if(res.length){const cb=document.getElementById('cvec');if(cb)cb.checked=true}
  }catch(e){if(box)box.textContent='Ошибка сети: '+e}
}

function renderContent(text){
  if(!text)return'';
  // Нормализация «мусорных» управляющих последовательностей из старых генераций
  text=String(text).replace(/\\n/g,'\n').replace(/\\t/g,'\t');
  // Escape HTML first
  let s=esc(text);
  // Code blocks ```
  s=s.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code class="lang-$1">$2</code></pre>');
  // Inline code
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  // Bold **text**
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // Italic *text*
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // Links [text](url)
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Images ![alt](url)
  s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;margin:12px 0">');
  // Unordered lists - lines starting with * or -
  const lines=s.split('\n');
  let out='',inList=false,inOl=false;
  lines.forEach((line,i)=>{
    const ulMatch=line.match(/^(\s*)[*\-]\s+(.*)/);
    const olMatch=line.match(/^(\s*)\d+\.\s+(.*)/);
    const isHeader=line.match(/^#{1,6}\s/);
    const isEmpty=!line.trim();
    if(ulMatch){
      if(inOl){out+='</ol>\n';inOl=false}
      if(!inList){out+='<ul>\n';inList=true}
      out+=`<li>${ulMatch[2]}</li>\n`;
    }else if(olMatch){
      if(inList){out+='</ul>\n';inList=false}
      if(!inOl){out+='<ol>\n';inOl=true}
      out+=`<li>${olMatch[2]}</li>\n`;
    }else if(isHeader){
      if(inList){out+='</ul>\n';inList=false}
      if(inOl){out+='</ol>\n';inOl=false}
      const level=line.match(/^(#+)\s/)[1].length;
      const hText=line.replace(/^#+\s/,'');
      const tag='h'+(level+2>6?6:level+2);
      out+=`<${tag}>${hText}</${tag}>\n`;
    }else if(isEmpty){
      if(inList){out+='</ul>\n';inList=false}
      if(inOl){out+='</ol>\n';inOl=false}
      out+='\n';
    }else{
      if(inList){out+='</ul>\n';inList=false}
      if(inOl){out+='</ol>\n';inOl=false}
      // Check if line is a blockquote
      if(line.trim().startsWith('&gt;')){
        out+=`<blockquote>${line.trim().replace(/^&gt;\s?/,'')}</blockquote>\n`;
      }else{
        out+=`<p>${line}</p>\n`;
      }
    }
  });
  if(inList)out+='</ul>\n';
  if(inOl)out+='</ol>\n';
  return out;
}

// ========== OPEN / LOAD COURSE ==========
// Продолжить обучение: открыть курс и перейти к первому НЕпройденному уроку.
async function continueCourse(id){
  try{
    const r=await fetch('/api/education/course/'+id);const c=await r.json();
    if(!c||c.id===undefined){toast('Курс не найден','err');return}
    const done=c.progress?.completed_lessons||[];
    const ls=c.plan?.lessons||[];
    // Первый урок, который ещё не пройден
    let target=ls.findIndex((_,i)=>!done.includes(i));
    if(target<0)target=Math.max(0,ls.length-1);       // всё пройдено — на последний
    else if(done.length===0)target=0;
    await openCourse(id);
    // openCourse ставит S.lesson из current_lesson — переопределяем на нужный
    if(S.currentCourse&&target>0){S.lesson=target;renderLesson(S.currentCourse,target)}
    toast(done.length?`Продолжаем с урока ${target+1}`:'Начинаем курс','ok');
  }catch(e){toast('Ошибка: '+e.message,'err')}
}

async function openCourse(id){
  S.currentId=id;S.chatId=id;if(S.pollId){clearInterval(S.pollId);S.pollId=null}S._loadingCourse=false;
  // Тьютор раскрываем только когда для него есть докованное место: на
  // узком экране панель — наложение и легла бы поверх урока.
  const sb=document.getElementById('sidebar');
  const docked=window.matchMedia('(min-width: 1361px)').matches;
  if(sb)sb.classList.toggle('collapsed',!docked);
  S.sidebar=docked;
  await loadCourseView(id);
  S.pollId=setInterval(async()=>{
    if(!S.pollId||S._loadingCourse)return;
    try{const r=await fetch('/api/education/course/'+id);const d=await r.json();if(d.status==='ready'||d.status==='learning'||d.status==='completed'||d.status==='error'){clearInterval(S.pollId);S.pollId=null;if(!S._loadingCourse)loadCourseView(id)}}catch(e){}
  },2000);
}

const _PHASE_LABELS={notes:'Анализ материалов',syllabus:'План курса',lessons:'Уроки',quizzes:'Тесты',homework:'ДЗ',flashcards:'Карточки',exam:'Финальный экзамен',bibliography:'Библиография',done:'Готово'};

// ========== SSE ==========
let _sseTimer=null,_sseRetries=0,_sseCurrentId=null,_sseReconnectTimer=null;
const _SSE_MAX_RETRIES=15;
function startSSE(id){
  _sseCurrentId=id;_sseRetries=0;_connectSSE(id);
}
function _connectSSE(id){
  if(_sseTimer){clearInterval(_sseTimer);_sseTimer=null}
  const el=document.getElementById('appContent');
  try{
    const es=new EventSource('/api/education/course/'+id+'/stream');
    let timeout=setTimeout(()=>{es.close();if(_sseCurrentId){_sseRetries++;if(_sseRetries<_SSE_MAX_RETRIES){const d=Math.min(30,1500*Math.pow(1.5,_sseRetries)/1000);_sseReconnectTimer=setTimeout(()=>_connectSSE(id),d*1000);const ph=document.getElementById('ssePhaseLabel');if(ph)ph.textContent='⚠️ Соединение прервано, восстановление...'}}},30000);
    es.onmessage=e=>{
      clearTimeout(timeout);timeout=setTimeout(()=>{es.close();if(_sseCurrentId){_sseRetries++;if(_sseRetries<_SSE_MAX_RETRIES){const d=Math.min(30,1500*Math.pow(1.5,_sseRetries)/1000);_sseReconnectTimer=setTimeout(()=>_connectSSE(id),d*1000)}}},30000);
      try{const d=JSON.parse(e.data);handleSSEEvent(d)}catch(err){}
    };
    es.onerror=()=>{es.close();if(_sseCurrentId){_sseRetries++;if(_sseRetries<_SSE_MAX_RETRIES){const d=Math.min(30,1500*Math.pow(1.5,_sseRetries)/1000);_sseReconnectTimer=setTimeout(()=>_connectSSE(id),d*1000);const ph=document.getElementById('ssePhaseLabel');if(ph)ph.textContent='⚠️ Соединение прервано, восстановление...'}}};
  }catch(e){}
}

function _updateLessonListState(lList, currentIdx, subphaseLabel){
  if(!lList)return;
  for(let i=0;i<lList.children.length;i++){
    const el=lList.children[i];
    el.classList.remove('done','active','pending');
    const badge=el.querySelector('.sse-subphase-badge');
    if(i<currentIdx){
      el.classList.add('done');
      el.style.background='var(--green-light)';el.style.color='var(--green)';el.style.border='none';
      el.querySelector('i').className='fas fa-check-circle';el.querySelector('i').style.color='var(--green)';
      if(badge){badge.textContent='✓';badge.style.opacity='1';badge.style.color='var(--green)'}
    }else if(i===currentIdx){
      el.classList.add('active');
      el.style.background='var(--accent-light)';el.style.color='var(--accent)';el.style.border='1px solid var(--accent)';
      el.querySelector('i').className='fas fa-spinner fa-pulse';el.querySelector('i').style.color='var(--accent)';
      if(badge){badge.textContent=subphaseLabel||'...';badge.style.opacity='1';badge.style.color='var(--accent)'}
    }else{
      el.classList.add('pending');
      el.style.background='var(--bg3)';el.style.color='var(--text3)';el.style.border='none';
      el.querySelector('i').className='fas fa-circle';el.querySelector('i').style.color='var(--text3)';
      if(badge){badge.textContent='';badge.style.opacity='0'}
    }
  }
}

function _updateCounters(lcEl, pfEl, done, total){
  if(lcEl)lcEl.textContent=done+'/'+total;
  if(pfEl)pfEl.style.width=total?Math.round(done/total*100)+'%':'0%';
}

function handleSSEEvent(d){
  const phLabel=document.getElementById('ssePhaseLabel');const statusMsg=document.getElementById('sseStatusMsg');
  const subMsg=document.getElementById('sseSubMsg');const phNotes=document.getElementById('sseNotes');
  const phLessons=document.getElementById('sseLessons');const lcEl=document.getElementById('sseLessonCount');
  const lList=document.getElementById('sseLessonList');const pfEl=document.getElementById('sseProgressFill');
  if(d.type==='phase'){
    const label=_PHASE_LABELS[d.phase]||d.phase;
    const icon=_PHASE_ICONS[d.phase]||'circle';
    if(phLabel)phLabel.textContent=label;
    if(statusMsg)statusMsg.innerHTML='<i class="fas fa-'+icon+'" style="color:var(--accent)"></i> '+(d.message||label);
    if(subMsg&&d.message)subMsg.textContent=d.message;
    if(phNotes)phNotes.style.display=d.phase==='notes'?'block':'none';
    const showLessons=d.phase==='lessons'||d.phase==='quizzes'||d.phase==='homework'||d.phase==='flashcards';
    if(phLessons)phLessons.style.display=showLessons?'block':'none';
    if(lcEl)lcEl.style.display=showLessons?'flex':'none';
    if(showLessons&&d.current!=null&&d.total){
      const subphaseMap={lessons:'Контент',quizzes:'Тест',homework:'ДЗ',flashcards:'Карточки'};
      const sp=subphaseMap[d.phase]||'...';
      _updateLessonListState(lList, d.current, sp);
      _updateCounters(lcEl, pfEl, d.current, d.total);
    }
    // Update gen-progress-ring dots
    const ring=document.querySelector('.gen-progress-ring');
    if(ring){
      const dots=ring.querySelectorAll('.gen-phase-dot');
      const curIdx=_PHASE_ORDER.indexOf(d.phase);
      _PHASE_ORDER.forEach((ph,i)=>{
        const dot=dots[i];if(!dot)return;
        const di=dot.querySelector('i');
        if(i<curIdx){dot.className='gen-phase-dot done';if(di)di.style.color='var(--green)'}
        else if(i===curIdx){dot.className='gen-phase-dot active';if(di)di.style.color='var(--accent)'}
        else{dot.className='gen-phase-dot pending';if(di)di.style.color='var(--text3)'}
      });
    }
  }else if(d.type==='notes_done'&&phNotes){
    phNotes.innerHTML='<div class="fb ok"><i class="fas fa-check-circle"></i> Материалы проанализированы</div>';
  }else if(d.type==='lesson_done'&&lList){
    const idx=d.index;const total=lList.children.length;
    const el=lList.children[idx];
    if(el){
      el.classList.remove('active');el.classList.add('done');
      el.style.background='var(--green-light)';el.style.color='var(--green)';el.style.border='none';
      el.querySelector('i').className='fas fa-check-circle';el.querySelector('i').style.color='var(--green)';
      const badge=el.querySelector('.sse-subphase-badge');
      if(badge){badge.textContent='✓';badge.style.opacity='1';badge.style.color='var(--green)'}
    }
    // Move active to next lesson if there is one
    if(idx+1<total){
      const next=lList.children[idx+1];
      next.classList.remove('pending');next.classList.add('active');
      next.style.background='var(--accent-light)';next.style.color='var(--accent)';next.style.border='1px solid var(--accent)';
      next.querySelector('i').className='fas fa-spinner fa-pulse';next.querySelector('i').style.color='var(--accent)';
      const badge=next.querySelector('.sse-subphase-badge');
      if(badge){badge.textContent='Контент';badge.style.opacity='1';badge.style.color='var(--accent)'}
    }
    const done=document.querySelectorAll('#sseLessonList .done').length;
    _updateCounters(lcEl, pfEl, done, total);
    const previewBtn=document.getElementById('previewReadyBtn');
    if(previewBtn&&done>0){previewBtn.style.display='block';previewBtn.querySelector('button').innerHTML='<i class="fas fa-eye"></i> Смотреть готовые уроки ('+done+'/'+total+')'}
  }else if(d.type==='progress'){
    if(subMsg)subMsg.textContent=d.message||'';
    if(statusMsg&&d.message)statusMsg.innerHTML='<i class="fas fa-spinner fa-pulse" style="color:var(--accent)"></i> '+esc(d.message);
  }else if(d.type==='error'){
    if(statusMsg)statusMsg.innerHTML='<span style="color:var(--red)">⚠️ Ошибка: '+esc(d.message||'')+'</span>';
  }else if(d.type==='done'){
    const el=document.getElementById('appContent');
    if(phLabel)phLabel.textContent='Готово!';
    if(statusMsg)statusMsg.innerHTML='<i class="fas fa-check-circle" style="color:var(--green)"></i> Курс готов!';
    if(pfEl)pfEl.style.width='100%';
    // Mark all lessons done
    if(lList)for(let i=0;i<lList.children.length;i++){
      const li=lList.children[i];
      li.classList.remove('active','pending');li.classList.add('done');
      li.style.background='var(--green-light)';li.style.color='var(--green)';li.style.border='none';
      li.querySelector('i').className='fas fa-check-circle';li.querySelector('i').style.color='var(--green)';
      const badge=li.querySelector('.sse-subphase-badge');
      if(badge){badge.textContent='✓';badge.style.opacity='1';badge.style.color='var(--green)'}
    }
    const banner=document.getElementById('genBanner');if(banner)banner.remove();
    if(el)loadCourseView(S.currentId);
  }else if(d.type==='resume'){
    const phase=d.phase;const done=d.lessons_done||0;const total=d.total_lessons||0;
    if(phLabel)phLabel.textContent=_PHASE_LABELS[phase]||phase;
    _updateCounters(lcEl, pfEl, done, total);
    // Update gen-progress-ring
    const ring=document.querySelector('.gen-progress-ring');
    if(ring){
      const dots=ring.querySelectorAll('.gen-phase-dot');
      const curIdx=_PHASE_ORDER.indexOf(phase);
      _PHASE_ORDER.forEach((ph,i)=>{
        const dot=dots[i];if(!dot)return;
        const di=dot.querySelector('i');
        if(i<curIdx){dot.className='gen-phase-dot done';if(di)di.style.color='var(--green)'}
        else if(i===curIdx){dot.className='gen-phase-dot active';if(di)di.style.color='var(--accent)'}
        else{dot.className='gen-phase-dot pending';if(di)di.style.color='var(--text3)'}
      });
    }
    if(lList){
      for(let i=0;i<lList.children.length;i++){
        const li=lList.children[i];
        const badge=li.querySelector('.sse-subphase-badge');
        if(i<done){
          li.className='done';li.style.background='var(--green-light)';li.style.color='var(--green)';li.style.border='none';
          li.querySelector('i').className='fas fa-check-circle';li.querySelector('i').style.color='var(--green)';
          if(badge){badge.textContent='✓';badge.style.opacity='1';badge.style.color='var(--green)'}
        }else if(i===done){
          li.className='active';li.style.background='var(--accent-light)';li.style.color='var(--accent)';li.style.border='1px solid var(--accent)';
          li.querySelector('i').className='fas fa-spinner fa-pulse';li.querySelector('i').style.color='var(--accent)';
          if(badge){badge.textContent='Контент';badge.style.opacity='1';badge.style.color='var(--accent)'}
        }else{
          li.className='pending';li.style.background='var(--bg3)';li.style.color='var(--text3)';li.style.border='none';
          li.querySelector('i').className='fas fa-circle';li.querySelector('i').style.color='var(--text3)';
          if(badge){badge.textContent='';badge.style.opacity='0'}
        }
      }
    }
  }else if(d.type==='paused'){
    if(statusMsg)statusMsg.innerHTML='<i class="fas fa-pause-circle" style="color:var(--yellow)"></i> ⏸ Генерация приостановлена';
    const banner=document.getElementById('genBanner');if(banner)banner.remove();
    const pBtn=document.getElementById('previewReadyBtn');
    if(pBtn){pBtn.style.display='block';const btn=pBtn.querySelector('button');if(btn)btn.innerHTML='<i class="fas fa-eye"></i> Смотреть готовые уроки'}
  }
}

const _PHASE_ICONS={notes:'file-alt',syllabus:'list',lessons:'book-open',quizzes:'question-circle',homework:'pencil-alt',flashcards:'layer-group',exam:'graduation-cap',bibliography:'bookmark'};

  // Phase progress ring
  h+=`<div class="gen-progress-ring" style="margin-bottom:16px">`;

  h+=`<p id="sseStatusMsg" style="font-size:13px;color:var(--text2);margin:8px 0 16px">${p==='done'?'Курс готов!':'Генерация курса...'}</p>`;
  h+=`<div class="progress-bar" style="height:8px;border-radius:4px;background:var(--bg4);margin-bottom:6px"><div class="fill" id="sseProgressFill" style="width:${pct}%;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),#a78bfa);transition:width 0.5s ease"></div></div>`;
  h+=`<span id="sseSubMsg" style="font-size:11px;color:var(--text3)">${esc(gp.message||'')}</span>`;
  h+=`</div>`;
  h+=`<div id="sseNotes" style="${p==='notes'?'':'display:none'};margin-top:4px"><textarea class="test-ta" style="min-height:50px" placeholder="Заметки к материалам..."></textarea></div>`;
  h+=`<div id="sseLessons" style="${p==='lessons'||p==='quizzes'||p==='homework'||p==='flashcards'?'':'display:none'};margin-top:12px">`;
  h+=`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:6px"><span>Прогресс уроков</span><span id="sseLessonCount">${ld}/${total}</span></div>`;
  h+=`<div id="sseLessonList" style="display:flex;flex-direction:column;gap:3px">`;
  (ls||[]).forEach((l,i)=>{
    const cls=i<ld?'done':i===ld?'active':'pending';
    const icon=i<ld?'fa-check-circle':i===ld?'fa-spinner fa-pulse':'fa-circle';
    const bg=i<ld?'var(--green-light)':i===ld?'var(--accent-light)':'var(--bg3)';

      <i class="fas ${icon}" style="font-size:11px;width:14px;text-align:center;color:${col}"></i>

  </div>`;
  h+=`</div>`;
  return h;

let _ssePersist=false;
function checkCourseReady(id){/* polling handles this */}

async function showPartialCourse(id){
  if(_sseCurrentId===id)_ssePersist=true;
  await loadCourseView(id,true);
}

async function loadCourseView(id,partial){
  if(!id)return;S._loadingCourse=true;
  try{
    const r=await fetch('/api/education/course/'+id);const c=await r.json();
    if(!c||c.id===undefined){S._loadingCourse=false;toast('Ошибка загрузки','err');loadCourses();return}
    S.currentId=c.id;S.chatId=c.id;S.lesson=c.progress?.current_lesson||0;
    S._quizAnswers={};S._quizSubmitted=false;S._quizPage=0;
    const chat=document.getElementById('chatMessages');chat.innerHTML='';
    if(c.chat_history&&c.chat_history.length>0)c.chat_history.forEach(m=>{chat.innerHTML+=`<div class="msg ${m.role}">${nl2br(m.content)}<div class="t">${new Date(m.time*1000).toLocaleTimeString()}</div></div>`});
    else chat.innerHTML='<div style="font-size:12px;color:var(--text3);text-align:center;padding:16px"><i class="fas fa-robot" style="font-size:24px;display:block;margin-bottom:8px;color:var(--accent)"></i>Задайте вопрос по курсу</div>';
    chat.scrollTop=chat.scrollHeight;
    const el=document.getElementById('appContent');
    if(c.status==='error'){
      el.innerHTML=`<button class="btn btn-sm" onclick="backToCourses()"><i class="fas fa-arrow-left"></i> К курсам</button>
        <div class="card" style="margin-top:12px;border-color:var(--red)"><div class="card-title"><i class="fas fa-exclamation-triangle" style="color:var(--red)"></i> Ошибка</div>
        <p>${esc(c.error||'Неизвестная ошибка')}</p><div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-sm btn-danger" onclick="deleteCourse('${id}')">Удалить</button>
        <button class="btn btn-sm" onclick="retryCourse('${id}')">Повторить</button></div></div>`;
      S._loadingCourse=false;return;
    }
    const gp=c.generation_progress||{};const ld=gp.lessons_done||0;const total=(c.plan?.lessons||[]).length;
    const isGenerating=c.status==='queued'||c.status==='analyzing'||c.status==='materials_loaded'||c.status==='analyzed'||c.status==='plan_ready'||(gp.phase&&gp.phase!=='done');
    const canPreview=partial||(total>0&&ld>0&&isGenerating);
    if(isGenerating&&!canPreview){
      const rb=document.getElementById('readingBtn');if(rb)rb.style.display='none';
      el.innerHTML=sseViewHTML(id,c);startSSE(id);checkCourseReady(id);
      S._loadingCourse=false;return;
    }
    S.courseView='content';S.currentCourse=c;
    // Show generation banner if course is still being generated
    if(isGenerating&&canPreview&&ld<total){
      if(!_ssePersist&&_sseCurrentId!==id){startSSE(id)}
      renderLesson(c,S.lesson,true);
      // Add banner
      const banner=document.createElement('div');banner.id='genBanner';banner.className='gen-banner';

      el.insertBefore(banner,el.firstChild);
    }else{
      renderLesson(c,S.lesson);
    }
  }catch(e){toast('Ошибка загрузки курса','err')}
  S._loadingCourse=false;
}
function backToSSEView(id){

}

function backToCourses(){

// ========== QUIZ PAGINATION ==========
function prevQuizPage(){
  S._quizPage=Math.max(0,(S._quizPage||0)-1);
  updateQuizVisibility();
}
function nextQuizPage(){
  const l=S.currentCourse?.plan?.lessons?.[S.lesson];if(!l)return;
  const maxP=Math.ceil((l.quiz||[]).length/5)-1;
  S._quizPage=Math.min(maxP,(S._quizPage||0)+1);
  updateQuizVisibility();
}
function updateQuizVisibility(){
  const qpp=5;const qp=S._quizPage||0;
  const l=S.currentCourse?.plan?.lessons?.[S.lesson];
  const qlen=(l?.quiz||[]).length;
  if(!qlen)return;
  for(let qi=0;qi<qlen;qi++){
    const el=document.getElementById('qq_'+qi);
    if(el)el.style.display=qi>=qp*qpp&&qi<(qp+1)*qpp?'':'none';
  }
  const info=document.getElementById('quizPageInfo');
  const maxP=Math.ceil(qlen/qpp)-1;
  if(info)info.textContent='Стр. '+(qp+1)+' из '+(maxP+1);
  const prevBtn=document.querySelector('#lessonQuiz .btn-sm[onclick*="prevQuizPage"]');
  if(prevBtn)prevBtn.disabled=qp<=0;
  const nextBtn=document.querySelector('#lessonQuiz .btn-sm[onclick*="nextQuizPage"]');
  if(nextBtn)nextBtn.disabled=qp>=maxP;
}

  if(tab)tab.classList.add('active');
  ['lessonContent','lessonQuiz','lessonHomework','lessonFlashcards'].forEach(id=>{

function startQuizTimer(minutes){
  if(!minutes||minutes<=0)return;

    S._quizTimeLeft--;

    el.textContent=m+':'+(s<10?'0':'')+s;

function closeGenTestsModal(){const m=document.getElementById('genTestsModal');if(m)m.remove()}
async function genTestsGenerate(){
  const desc=document.getElementById('gtDesc').value.trim();
  const count=parseInt(document.getElementById('gtCount').value)||20;
  const pid=currentProfileId();
  const btn=document.getElementById('gtGenBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-pulse"></i> Генерация...';
  const res=document.getElementById('gtResult');const st=document.getElementById('gtStatus');

    const d=await r.json();
    if(d.error){res.innerHTML='<div class="fb err">'+esc(d.error)+'</div>';st.textContent='';return}
    const tests=d.tests||[];
    if(!tests.length){res.innerHTML='<div class="fb err">ИИ не вернул тесты</div>';st.textContent='';return}
    _genTestsCtx.tests=tests;
    let h='<div class="fb ok" style="margin-bottom:8px">Сгенерировано: '+tests.length+' тестов. Проверьте и сохраните.</div>';
    h+='<div style="max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:8px">';
    tests.forEach((t,i)=>{h+='<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:13px"><strong>'+(i+1)+'.</strong> ['+esc(t.type||'')+'] '+esc(t.question||'')+'</div>'});
    h+='</div>';

    res.innerHTML=h;st.textContent='Готово';
  }catch(e){res.innerHTML='<div class="fb err">Ошибка: '+esc(e.message||e)+'</div>';st.textContent=''}finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-bolt"></i> Сгенерировать'}
}

async function startFinalExam(id){
  let c;

  const exam=c.plan.final_exam;const allQ=exam?.questions||[];

    const qType=q.type||'choice';
    if(qType==='choice'&&q.options){q.options.forEach((o,oi)=>{h+=`<div class="quiz-opt" onclick="examSelect(${qi},${oi})" id="eqo_${qi}_${oi}">${esc(o)}</div>`})}
    else if(qType==='multiple'&&q.options){q.options.forEach((o,oi)=>{h+=`<div class="quiz-opt" onclick="examToggle(${qi},${oi})" id="eqo_${qi}_${oi}">${esc(o)}</div>`})}

    else if(qType==='fill_in'){h+=`<input type="text" class="search-inp" id="eqi_${qi}" placeholder="Ваш ответ..." style="margin-top:8px">`}
    else{h+=`<textarea class="test-ta" id="eqi_${qi}" placeholder="Ваш ответ..."></textarea>`}

  });

  modal.innerHTML='<div class="modal-content" style="max-width:700px;max-height:85vh;overflow-y:auto">'+h+'</div>';
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
  document.body.appendChild(modal);

}
function examSelect(qi,val){window._examAnswers[qi]=val;document.querySelectorAll('[id^="eqo_'+qi+'_"]').forEach(el=>el.classList.remove('sel'));const el=document.getElementById('eqo_'+qi+'_'+val);if(el)el.classList.add('sel')}

// ========== VOICE INPUT ==========
let _mediaRecorder=null,_voiceChunks=[],_voiceBtnEl=null;
async function toggleVoiceRecord(){
  const btn=document.getElementById('voiceBtn');
  if(_mediaRecorder&&_mediaRecorder.state==='recording'){_mediaRecorder.stop();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _mediaRecorder=new MediaRecorder(stream);_voiceChunks=[];
    _mediaRecorder.ondataavailable=e=>_voiceChunks.push(e.data);
    _mediaRecorder.onstop=async()=>{
      const blob=new Blob(_voiceChunks,{type:'audio/webm'});
      stream.getTracks().forEach(t=>t.stop());_mediaRecorder=null;
      if(btn)btn.innerHTML='<i class="fas fa-microphone"></i>';btn?.classList?.remove('recording');
      if(blob.size<100)return;
      const inp=document.getElementById('chatInput');if(inp)inp.placeholder='Распознавание...';if(inp)inp.disabled=true;
      try{
        const fd=new FormData();fd.append('file',blob,'voice.webm');
        const r=await fetch('/api/stt/transcribe',{method:'POST',body:fd});const d=await r.json();
        const text=(d.text||d.result||'').trim();
        if(text&&inp){inp.value=text;inp.placeholder='Спросите о курсе...';inp.disabled=false;doAsk()}
        else{if(inp)inp.placeholder='Спросите о курсе...';if(inp)inp.disabled=false;toast('Не удалось распознать','err')}
      }catch(e){if(inp){inp.placeholder='Спросите о курсе...';inp.disabled=false}toast('Ошибка распознавания','err')}
    };
    _mediaRecorder.start();
    if(btn){btn.innerHTML='<i class="fas fa-stop" style="color:var(--red)"></i>';btn.classList.add('recording')}
  }catch(e){toast('Нет доступа к микрофону','err')}
}

// ========== TEXT-TO-SPEECH ==========
function ttsPlayText(t){
  if(!t||t.length<2)return;
  const btn=event?.target?.closest?.('.speak-btn');if(btn)btn.innerHTML='<i class="fas fa-spinner fa-pulse"></i>';
  const _eng=window.SpeechConfig?SpeechConfig.ttsEngine():'silero';
  const _spk=window.SpeechConfig?SpeechConfig.ttsSpeaker():'xenia';
  fetch('/api/tts?text='+encodeURIComponent(t.slice(0,500))+'&engine='+_eng+'&speaker='+encodeURIComponent(_spk))
    .then(r=>{if(!r.ok)throw new Error();return r.blob()})
    .then(blob=>{const url=URL.createObjectURL(blob);const audio=new Audio(url);audio.onended=()=>{URL.revokeObjectURL(url);if(btn)btn.innerHTML='<i class="fas fa-volume-up"></i>'};audio.play().catch(()=>{if(btn)btn.innerHTML='<i class="fas fa-volume-up"></i>'})})
    .catch(()=>{if(btn)btn.innerHTML='<i class="fas fa-volume-up"></i>';toast('Озвучивание недоступно','err')});
}
async function doAsk(){
  const inp=document.getElementById('chatInput');const q=inp?.value?.trim();
  if(!q||!S.currentId)return;
  const chat=document.getElementById('chatMessages');chat.innerHTML+=`<div class="msg user">${nl2br(q)}<div class="t">сейчас</div></div>`;inp.value='';

  try{const r=await fetch('/api/education/course/'+S.currentId+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});const d=await r.json();const th=document.getElementById('tutorThinking');if(th)th.remove();const ans=d.answer||'Нет ответа';chat.innerHTML+=`<div class="msg assistant">${nl2br(ans)}<div class="t"><button class="speak-btn" onclick="ttsPlayText('${jsEsc(ans).replace(/'/g,"\\'")}')"><i class="fas fa-volume-up"></i></button> сейчас</div></div>`;chat.scrollTop=chat.scrollHeight}catch(e){const th=document.getElementById('tutorThinking');if(th)th.remove();chat.innerHTML+=`<div class="msg assistant" style="color:var(--red)">Ошибка соединения</div>`}
