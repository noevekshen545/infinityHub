<!DOCTYPE html>
<html class="pg-page_memory_graph" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASIO Memory Graph</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#c9d1d9;--text2:#8b949e;--accent:#58a6ff;--purple:#8b5cf6;--green:#238636;--orange:#f97316;--gradient:linear-gradient(135deg,#58a6ff,#8b5cf6)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

.topnav{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px}
.topnav .logo{font-size:18px;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topnav .back{padding:6px 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:12px;text-decoration:none}

.container{display:flex;height:calc(100vh - 52px)}
.sidebar{width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-header h3{font-size:14px;margin-bottom:4px}
.sidebar-header p{font-size:11px;color:var(--text2)}
.sidebar-content{flex:1;overflow-y:auto;padding:16px}
.sidebar-content::-webkit-scrollbar{width:6px}
.sidebar-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.stat-card .label{font-size:10px;color:var(--text2);text-transform:uppercase;margin-bottom:4px}
.stat-card .value{font-size:20px;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.node-list{margin-top:16px}
.node-item{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .2s}
.node-item:hover{border-color:var(--accent);background:var(--bg3)}
.node-item .title{font-size:12px;font-weight:600;margin-bottom:2px}
.node-item .meta{font-size:10px;color:var(--text2)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;gap:8px;align-items:center}
.toolbar button{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-size:11px;font-weight:600}
.toolbar button:hover{border-color:var(--accent)}
.toolbar button.primary{background:var(--gradient);border-color:transparent;color:#fff}

.graph-container{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#graphCanvas{width:100%;height:100%}

.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-content{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:90%;max-width:500px;padding:20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h3{font-size:16px}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal-footer button{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-size:12px;font-weight:600}
.modal-footer button.primary{background:var(--gradient);border-color:transparent;color:#fff}

.tooltip{position:absolute;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;pointer-events:none;z-index:100;max-width:250px;display:none}
.tooltip .title{font-weight:600;margin-bottom:4px}
.tooltip .type{color:var(--accent);font-size:10px;text-transform:uppercase}
</style>
<script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="/static/js/mobile.js" defer></script>
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
</head>
<body>
<nav class="topnav">
  <a href="/agent" class="back"><i class="fa-solid fa-arrow-left"></i> К агенту</a>
  <div class="logo"><i class="fa-solid fa-brain"></i> Memory Graph</div>
</nav>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">
      <h3>Граф знаний</h3>
      <p>Визуализация связей между фактами</p>
    </div>
    <div class="sidebar-content">
      <div id="stats"></div>
      
      <div class="node-list">
        <h4 style="font-size:12px;margin-bottom:8px">Узлы графа</h4>
        <div id="nodeList"></div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <button class="primary" onclick="openAddNode()">+ Добавить узел</button>
      <button onclick="autoConnect()">🔗 Авто-связи</button>
      <button onclick="loadGraph()">🔄 Обновить</button>
      <button onclick="exportGraph()">💾 Экспорт</button>
    </div>
    <div class="graph-container">
      <canvas id="graphCanvas"></canvas>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>
</div>

<div class="modal" id="addNodeModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Добавить узел</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="form-group">
      <label>Название</label>
      <input type="text" id="nodeLabel" placeholder="Python, FastAPI, и т.д.">
    </div>
    <div class="form-group">
      <label>Тип</label>
      <select id="nodeType">
        <option value="fact">Факт</option>
        <option value="concept">Концепция</option>
        <option value="skill">Навык</option>
        <option value="project">Проект</option>
        <option value="person">Персона</option>
      </select>
    </div>
    <div class="form-group">
      <label>Свойства (JSON, опционально)</label>
      <textarea id="nodeProps" rows="3" placeholder='{"key": "value"}'></textarea>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal()">Отмена</button>
      <button class="primary" onclick="addNode()">Добавить</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('graphCanvas');
const ctx = canvas.getContext('2d');
let nodes = [];
let edges = [];
let selectedNode = null;
let draggingNode = null;
let hoveredNode = null;

const typeColors = {
  fact: '#58a6ff',
  concept: '#8b5cf6',
  skill: '#238636',
  project: '#f97316',
  person: '#da3633'
};

function resizeCanvas() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}

async function loadGraph() {
  try {
    const res = await fetch('/api/agent/memory-graph/data');
    const data = await res.json();
    nodes = data.nodes || [];
    edges = data.edges || [];
    
    // Random positions if not set
    nodes.forEach((n, i) => {
      if (!n.x) {
        n.x = 200 + Math.random() * (canvas.width - 400);
        n.y = 150 + Math.random() * (canvas.height - 300);
      }
    });
    
    drawGraph();
    loadStats();
    loadNodeList();
  } catch(e) {
    console.error('Load graph error:', e);
  }
}

async function loadStats() {
  try {
    const res = await fetch('/api/agent/memory-graph/stats');
    const stats = await res.json();
    
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="label">Узлов</div><div class="value">${stats.total_nodes || 0}</div></div>
      <div class="stat-card"><div class="label">Связей</div><div class="value">${stats.total_edges || 0}</div></div>
      <div class="stat-card"><div class="label">Ср. связей</div><div class="value">${(stats.avg_connections || 0).toFixed(1)}</div></div>
    `;
  } catch(e) {}
}

function loadNodeList() {
  const list = document.getElementById('nodeList');
  if (nodes.length === 0) {
    list.innerHTML = '<div style="color:var(--text2);font-size:11px;padding:10px">Нет узлов</div>';
    return;
  }
  
  list.innerHTML = nodes.slice(0, 20).map(n => `
    <div class="node-item" onclick="focusNode('${n.id}')">
      <div class="title" style="color:${typeColors[n.type] || '#58a6ff'}">${n.label}</div>
      <div class="meta">${n.type}</div>
    </div>
  `).join('');
}

function drawGraph() {
  resizeCanvas();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Draw edges
  edges.forEach(e => {
    const source = nodes.find(n => n.id === e.source);
    const target = nodes.find(n => n.id === e.target);
    if (!source || !target) return;
    
    ctx.beginPath();
    ctx.moveTo(source.x, source.y);
    ctx.lineTo(target.x, target.y);
    ctx.strokeStyle = hoveredNode && (e.source === hoveredNode.id || e.target === hoveredNode.id) ? '#58a6ff' : '#30363d';
    ctx.lineWidth = hoveredNode && (e.source === hoveredNode.id || e.target === hoveredNode.id) ? 3 : 1.5;
    ctx.stroke();
  });
  
  // Draw nodes
  nodes.forEach(n => {
    const r = n.size || 15;
    const color = typeColors[n.type] || '#58a6ff';
    const isHovered = n === hoveredNode;
    
    // Glow
    if (isHovered) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 8, 0, Math.PI * 2);
      ctx.fillStyle = color + '33';
      ctx.fill();
    }
    
    // Circle
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = isHovered ? '#fff' : '#0d1117';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Label
    ctx.fillStyle = '#c9d1d9';
    ctx.font = `${isHovered ? 'bold ' : ''}11px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText(n.label, n.x, n.y + r + 15);
  });
}

function focusNode(id) {
  const node = nodes.find(n => n.id === id);
  if (node) {
    hoveredNode = node;
    drawGraph();
  }
}

function openAddNode() {
  document.getElementById('addNodeModal').classList.add('open');
}

function closeModal() {
  document.getElementById('addNodeModal').classList.remove('open');
}

async function addNode() {
  const label = document.getElementById('nodeLabel').value;
  const type = document.getElementById('nodeType').value;
  let props = {};
  try {
    props = JSON.parse(document.getElementById('nodeProps').value || '{}');
  } catch(e) {}
  
  if (!label) {
    alert('Введите название');
    return;
  }
  
  const nodeId = `node_${Date.now()}`;
  
  try {
    await fetch('/api/agent/memory-graph/add-node', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: nodeId, label, type, properties: props })
    });
    
    closeModal();
    loadGraph();
    document.getElementById('nodeLabel').value = '';
    document.getElementById('nodeProps').value = '';
  } catch(e) {
    alert('Ошибка: ' + e.message);
  }
}

async function autoConnect() {
  try {
    await fetch('/api/agent/memory-graph/auto-connect', { method: 'POST' });
    loadGraph();
  } catch(e) {}
}

function exportGraph() {
  const data = { nodes, edges };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'memory_graph.json';
  a.click();
}

// Mouse interactions
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  if (draggingNode) {
    draggingNode.x = x;
    draggingNode.y = y;
    drawGraph();
    return;
  }
  
  hoveredNode = null;
  for (const n of nodes) {
    const dx = x - n.x, dy = y - n.y;
    if (dx*dx + dy*dy < (n.size + 5) ** 2) {
      hoveredNode = n;
      break;
    }
  }
  
  drawGraph();
  
  // Tooltip
  const tooltip = document.getElementById('tooltip');
  if (hoveredNode) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 10) + 'px';
    tooltip.style.top = (e.clientY + 10) + 'px';
    tooltip.innerHTML = `
      <div class="title">${hoveredNode.label}</div>
      <div class="type">${hoveredNode.type}</div>
    `;
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mousedown', e => {
  if (hoveredNode) {
    draggingNode = hoveredNode;
  }
});

canvas.addEventListener('mouseup', () => {
  draggingNode = null;
});

canvas.addEventListener('mouseleave', () => {
  draggingNode = null;
  hoveredNode = null;
  drawGraph();
});

// Init
window.addEventListener('load', () => {
  resizeCanvas();
  loadGraph();
});
window.addEventListener('resize', drawGraph);
</script>
</body>
</html>
