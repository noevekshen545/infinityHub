<!DOCTYPE html>
<html class="pg-page_api_docs" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Documentation — Infinity</title>
<link rel="stylesheet" href="/static/css/font-awesome.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#c9d1d9;--text2:#8b949e;--text3:#484f58;
  --accent:#58a6ff;--accent2:#1f6feb;--green:#238636;--orange:#f97316;--red:#da3633;--purple:#8b5cf6;
  --get:#238636;--post:#d29922;--delete:#da3633;--put:#8b5cf6;--patch:#f97316;
  --gradient:linear-gradient(135deg,#58a6ff,#8b5cf6);
  --font-sans:system-ui,-apple-system,sans-serif;--font-mono:'JetBrains Mono','Cascadia Code',monospace;
}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh}
.toolbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.toolbar .logo{font-size:18px;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.toolbar .sub{font-size:12px;color:var(--text2);margin-left:4px}
.toolbar .back{padding:6px 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:12px;text-decoration:none;transition:all 0.2s}
.toolbar .back:hover{border-color:var(--accent)}
.toolbar .badge{font-size:10px;padding:2px 8px;background:var(--bg3);border-radius:10px;color:var(--text2);margin-left:auto}
.container{display:flex;height:calc(100vh - 53px)}
.sidebar{width:280px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sidebar-search{padding:12px;border-bottom:1px solid var(--border)}
.sidebar-search input{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;outline:none;font-family:var(--font-sans)}
.sidebar-search input:focus{border-color:var(--accent)}
.sidebar-category{padding:8px 12px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);border-bottom:1px solid var(--border);background:var(--bg3)}
.sidebar-item{padding:7px 12px;font-size:12px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 0.15s;border-left:2px solid transparent}
.sidebar-item:hover{background:var(--bg3);color:var(--text)}
.sidebar-item.active{background:var(--bg3);color:var(--text);border-left-color:var(--accent)}
.sidebar-item .method-tag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff;min-width:38px;text-align:center}
.method-tag.get{background:var(--get)}
.method-tag.post{background:var(--post)}
.method-tag.delete{background:var(--delete)}
.method-tag.put{background:var(--put)}
.method-tag.patch{background:var(--patch)}
.main{flex:1;overflow-y:auto;padding:24px}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.stats-bar{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;flex:1;min-width:100px}
.stat-card .num{font-size:20px;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:11px;color:var(--text2);margin-top:2px}
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent)}
.route-group{margin-bottom:24px}
.route-group h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.route-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px;transition:all 0.2s}
.route-card:hover{border-color:var(--accent)}
.route-card .top{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.route-card .path{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--text)}
.route-card .method{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff;text-transform:uppercase}
.route-card .name{font-size:11px;color:var(--text2)}
.route-card .desc{font-size:12px;color:var(--text2);margin-top:4px}
.route-card .copy-btn{padding:3px 8px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:10px;margin-left:auto;transition:all 0.2s}
.route-card .copy-btn:hover{background:var(--accent);color:#fff;border-color:transparent}
.no-results{padding:40px;text-align:center;color:var(--text2)}
.no-results i{font-size:32px;display:block;margin-bottom:12px;opacity:0.3}
</style>
<script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="/static/js/mobile.js" defer></script>
</head>
<body>
<nav class="toolbar">
  <a href="/settings" class="back"><i class="fas fa-arrow-left"></i></a>
  <span class="logo"><i class="fas fa-book"></i> API Documentation</span>
  <span class="sub">Infinity AI</span>
  <span class="badge" id="routeCount">— роутов</span>
</nav>
<div class="container">
  <aside class="sidebar">
    <div class="sidebar-search">
      <input type="text" placeholder="Поиск endpoint..." id="searchInput" oninput="filterRoutes()">
    </div>
    <div style="padding:8px 12px;border-bottom:1px solid var(--border)">
      <select id="methodFilter" onchange="filterRoutes()" style="width:100%;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;outline:none">
        <option value="">Все методы</option>
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="DELETE">DELETE</option>
        <option value="PATCH">PATCH</option>
      </select>
    </div>
    <div id="sidebarList"></div>
  </aside>
  <main class="main">
    <div class="stats-bar" id="statsBar"></div>
    <div class="filter-bar">
      <input type="text" placeholder="Поиск..." id="searchInput2" oninput="document.getElementById('searchInput').value=this.value;filterRoutes()">
      <select onchange="document.getElementById('methodFilter').value=this.value;filterRoutes()">
        <option value="">Все методы</option>
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="DELETE">DELETE</option>
        <option value="PATCH">PATCH</option>
      </select>
      <span style="font-size:11px;color:var(--text2)" id="resultCount"></span>
    </div>
    <div id="routesContainer"></div>
  </main>
</div>
<script>
const METHOD_COLORS = { GET: '#238636', POST: '#d29922', DELETE: '#da3633', PUT: '#8b5cf6', PATCH: '#f97316' };

async function loadApiDocs() {
  try {
    const r = await fetch('/api/extensions/api-docs');
    const d = await r.json();
    const routes = d.routes || [];
    window._allRoutes = routes;
    renderRoutes(routes);
  } catch (e) {
    console.error('API docs error:', e);
    document.getElementById('routesContainer').innerHTML = '<div class="no-results"><i class="fas fa-exclamation-triangle"></i>Ошибка загрузки документации</div>';
  }
}

function groupRoutes(routes) {
  const groups = {};
  for (const r of routes) {
    const parts = r.path.split('/').filter(Boolean);
    let category = 'other';
    if (parts.length >= 1) {
      if (parts[0] === 'api') {
        if (parts.length >= 2) {
          if (['agent','extensions'].includes(parts[1])) {
            category = parts[1] === 'agent' ? 'agent' : 'extensions';
            if (parts[1] === 'agent' && parts.length >= 3) {
              category = 'agent/' + parts[2];
            }
            if (parts[1] === 'extensions') category = 'extensions';
          } else {
            category = parts[1];
          }
        } else {
          category = 'api';
        }
      } else {
        category = parts[0];
      }
    }
    if (!groups[category]) groups[category] = [];
    groups[category].push(r);
  }
  return groups;
}

function renderRoutes(routes) {
  // Stats
  const stats = { GET: 0, POST: 0, DELETE: 0, PUT: 0, PATCH: 0 };
  for (const r of routes) {
    if (stats[r.method] !== undefined) stats[r.method]++;
  }
  const total = routes.length;
  document.getElementById('routeCount').textContent = total + ' роутов';
  document.getElementById('statsBar').innerHTML = Object.entries(stats).map(([m, c]) =>
    `<div class="stat-card"><div class="num" style="color:${METHOD_COLORS[m]}">${c}</div><div class="label">${m}</div></div>`
  ).join('');

  // Group
  const groups = groupRoutes(routes);
  const CATEGORY_NAMES = {
    agent: 'Agent System', 'agent/sessions': 'Agent Sessions', 'agent/chat': 'Agent Chat',
    'agent/memory': 'Agent Memory', 'agent/plugins': 'Agent Plugins', 'agent/provider': 'Agent Provider',
    'agent/code': 'Agent Code', 'agent/research': 'Agent Research', 'agent/tools': 'Agent Tools',
    'agent/teams': 'Agent Teams', 'agent/dreams': 'Agent Dreams', 'agent/scheduled-tasks': 'Agent Tasks',
    extensions: 'Extensions', search: 'Search', config: 'Config', health: 'Health',
    books: 'Books', media: 'Media', notes: 'Notes', zim: 'ZIM', profiles: 'Profiles',
    notifications: 'Notifications', stats: 'Statistics', analytics: 'Analytics',
    collections: 'Collections', collection: 'Collections', other: 'Other'
  };

  // Sidebar
  const categoryOrder = ['agent','agent/sessions','agent/chat','agent/memory','agent/plugins','agent/provider','agent/code','agent/research','agent/tools','agent/teams','agent/dreams','agent/scheduled-tasks','extensions','search','config','health','books','media','notes','zim','profiles','notifications','stats','analytics','collections','collection','other'];
  const sortedCategories = Object.keys(groups).sort((a, b) => {
    const ia = categoryOrder.indexOf(a); const ib = categoryOrder.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  document.getElementById('sidebarList').innerHTML = sortedCategories.map(cat => {
    const count = groups[cat].length;
    const name = CATEGORY_NAMES[cat] || cat.charAt(0).toUpperCase() + cat.slice(1);
    return `<div class="sidebar-category">${name} (${count})</div>` +
      groups[cat].map(r => `
        <div class="sidebar-item" onclick="document.getElementById('route-${cssEscape(r.path)}-${r.method}').scrollIntoView({behavior:'smooth',block:'center'});this.closest('.sidebar-item')?.classList.remove('active');this.classList.add('active')">
          <span class="method-tag ${r.method.toLowerCase()}">${r.method}</span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.path}</span>
        </div>
      `).join('');
  }).join('');

  // Main content
  document.getElementById('routesContainer').innerHTML = sortedCategories.map(cat => {
    const name = CATEGORY_NAMES[cat] || cat;
    return `<div class="route-group">
      <h2><i class="fas fa-folder"></i> ${name} <span style="font-size:12px;color:var(--text2);font-weight:400">(${groups[cat].length})</span></h2>
      ${groups[cat].map(r => `
        <div class="route-card" id="route-${cssEscape(r.path)}-${r.method}">
          <div class="top">
            <span class="method" style="background:${METHOD_COLORS[r.method]}">${r.method}</span>
            <span class="path">${r.path}</span>
            <span class="name">${r.endpoint || r.name || ''}</span>
            <button class="copy-btn" onclick="copyPath('${r.path}')"><i class="fas fa-copy"></i> Копировать</button>
          </div>
          <div class="desc">${r.name ? 'Handler: ' + r.endpoint || r.name : 'No description'}</div>
        </div>
      `).join('')}
    </div>`;
  }).join('');

  document.getElementById('resultCount').textContent = 'Показано: ' + total;
}

function filterRoutes() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const method = document.getElementById('methodFilter').value;
  const routes = (window._allRoutes || []).filter(r => {
    if (method && r.method !== method) return false;
    if (q && !r.path.toLowerCase().includes(q) && !(r.name || '').toLowerCase().includes(q) && !(r.endpoint || '').toLowerCase().includes(q)) return false;
    return true;
  });
  renderRoutes(routes);
}

function copyPath(path) {
  navigator.clipboard.writeText(path).then(() => {
    const btn = event.target.closest('.copy-btn');
    if (btn) { btn.textContent = 'Скопировано!'; setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> Копировать', 1500); }
  }).catch(() => {});
}

function cssEscape(str) {
  return str.replace(/[^\w-]/g, '_');
}

loadApiDocs();
</script>
</body>
</html>
