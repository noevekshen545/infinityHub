<style>
* { margin: 0; padding: 0; box-sizing: border-box }
:root {
--bg: #fafbfc; --bg2: #ffffff; --bg3: #f3f4f6; --bg4: #e5e7eb;
--border: rgba(0, 0, 0, 0.06); --border2: rgba(0, 0, 0, 0.1);
--text: #111827; --text2: #4b5563; --text3: #9ca3af;
--accent: #4f46e5; --accent2: #4338ca;
--accent-glow: rgba(79, 70, 229, 0.15); --accent-light: rgba(79, 70, 229, 0.1);
--link: #4338ca; --card: rgba(255, 255, 255, 0.8); --hover: rgba(0, 0, 0, 0.03);
--red: #dc2626; --red-light: rgba(220, 38, 38, 0.08);
--green: #059669; --green-light: rgba(5, 150, 105, 0.08);
--yellow: #d97706; --yellow-light: rgba(217, 119, 6, 0.08);
--purple: #7c3aed; --purple-light: rgba(124, 58, 237, 0.08);
--blue: #2563eb; --orange: #ea580c;
--shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
--shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
--shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.08);
--shadow-glow: 0 0 40px rgba(79, 70, 229, 0.1);
--radius: 16px; --radius-sm: 10px; --radius-lg: 24px; --radius-xl: 32px;
--tr: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
--tr-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
--glass: rgba(255, 255, 255, 0.72); --glass-border: rgba(0, 0, 0, 0.08);
--glass-hover: rgba(255, 255, 255, 0.85);
--font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
--font-mono: 'JetBrains Mono', monospace;
}
body.dark {
--bg: #0a0e14; --bg2: #111820; --bg3: #1a222e; --bg4: #252f3d;
--border: rgba(255, 255, 255, 0.06); --border2: rgba(255, 255, 255, 0.1);
--text: #e8ecf4; --text2: #a0aec0; --text3: #64748b;
--accent: #818cf8; --accent2: #6366f1;
--accent-glow: rgba(129, 140, 248, 0.2); --accent-light: rgba(129, 140, 248, 0.12);
--link: #a5b4fc; --card: rgba(17, 24, 32, 0.7); --hover: rgba(255, 255, 255, 0.04);
--red: #f87171; --red-light: rgba(248, 113, 113, 0.12);
--green: #34d399; --green-light: rgba(52, 211, 153, 0.12);
--yellow: #fbbf24; --yellow-light: rgba(251, 191, 36, 0.12);
--purple: #a78bfa; --purple-light: rgba(167, 139, 250, 0.12);
--blue: #60a5fa; --orange: #fb923c;
--shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
--shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
--shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
--glass: rgba(17, 24, 32, 0.65); --glass-border: rgba(255, 255, 255, 0.08);
--glass-hover: rgba(26, 34, 46, 0.8);
}
html { scroll-behavior: smooth }
body {
font-family: var(--font-sans); background: var(--bg); color: var(--text);
min-height: 100vh; transition: background 0.4s, color 0.4s;
line-height: 1.6; -webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale; overflow-x: hidden;
}
body::before {
content: ''; position: fixed; inset: 0;
background:
  radial-gradient(ellipse 80% 50% at 20% -10%, var(--accent-glow), transparent),
  radial-gradient(ellipse 60% 40% at 85% 85%, rgba(168, 85, 247, 0.06), transparent),
  radial-gradient(ellipse 50% 50% at 50% 50%, rgba(59, 130, 246, 0.03), transparent);
pointer-events: none; z-index: 0; transition: opacity 0.4s;
}
::selection { background: var(--accent); color: #fff }
a { color: var(--accent); text-decoration: none; transition: var(--tr) }
a:hover { color: var(--link) }
button { font-family: inherit; border: none; cursor: pointer; outline: none; background: none }
input, textarea { font-family: inherit; outline: none }

::-webkit-scrollbar { width: 8px; height: 8px }
::-webkit-scrollbar-track { background: transparent }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; border: 2px solid var(--bg) }
::-webkit-scrollbar-thumb:hover { background: var(--accent) }

/* ===== FLOATING TOOLBAR ===== */
.toolbar {
position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
z-index: 1000; background: var(--glass);
backdrop-filter: blur(28px) saturate(180%);
-webkit-backdrop-filter: blur(28px) saturate(180%);
border: 1px solid var(--glass-border);
border-radius: var(--radius-xl); padding: 6px;
display: flex; align-items: center; gap: 4px; flex-wrap: nowrap;
box-shadow: var(--shadow-lg), 0 0 0 0.5px rgba(0,0,0,0.05);
max-width: calc(100vw - 24px);
transition: var(--tr);
}
.toolbar:hover { box-shadow: var(--shadow-lg), 0 0 60px var(--accent-glow) }
.toolbar .btn {
background: transparent; border: 1px solid transparent;
color: var(--text2); padding: 8px 14px; border-radius: 12px;
cursor: pointer; font-size: 13px; font-weight: 500; transition: var(--tr);
display: inline-flex; align-items: center; gap: 7px;
font-family: inherit; text-decoration: none; white-space: nowrap;
position: relative;
}
.toolbar .btn i { font-size: 14px; transition: var(--tr) }
.toolbar .btn:hover { background: var(--hover); color: var(--text); transform: translateY(-1px) }
.toolbar .btn:hover i { color: var(--accent) }
.toolbar .btn.active {
background: linear-gradient(135deg, var(--accent), var(--accent2));
border-color: transparent; color: #fff;
box-shadow: 0 4px 16px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.15);
}
.toolbar .btn.active i { color: #fff }
.toolbar .btn-icon {
background: transparent; border: 1px solid transparent;
color: var(--text2); padding: 8px 10px; border-radius: 12px;
cursor: pointer; font-size: 15px; transition: var(--tr);
display: inline-flex; align-items: center; justify-content: center;
width: 36px; height: 36px;
}
.toolbar .btn-icon:hover { background: var(--hover); color: var(--accent); transform: rotate(15deg) }
.toolbar .sep { width: 1px; height: 20px; background: linear-gradient(to bottom, transparent, var(--border2), transparent); margin: 0 2px; flex-shrink: 0 }
.toolbar .status-chip {
font-size: 11px; padding: 4px 10px; border-radius: 20px;
background: var(--bg3); color: var(--text2); white-space: nowrap;
}
.toolbar .status-chip.good { background: var(--green-light); color: var(--green) }
.toolbar .status-chip.bad { background: var(--red-light); color: var(--red) }

/* ===== MAIN CONTENT ===== */
.main-content {
max-width: 1400px; margin: 0 auto;
padding: 90px 24px 200px; position: relative; z-index: 1;
}
@keyframes fadeInSection { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
.section { animation: fadeInSection 0.4s ease }

.page-header {
display: flex; align-items: center; justify-content: space-between;
margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
}
.page-header h1 {
font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
background: linear-gradient(135deg, var(--text), var(--text2));
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
background-clip: text;
display: flex; align-items: center; gap: 12px;
}
.page-header h1 i { -webkit-text-fill-color: initial }
.page-header .subtitle { font-size: 14px; color: var(--text3); margin-top: 4px }

/* ===== CATEGORY TABS ===== */
.tabs {
display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap;
background: var(--glass); backdrop-filter: blur(12px);
border: 1px solid var(--glass-border);
border-radius: var(--radius); padding: 4px;
width: fit-content;
}
.tabs .tab {
padding: 9px 18px; border-radius: 12px;
background: transparent; border: none;
color: var(--text2); cursor: pointer; font-size: 13px;
font-weight: 500; transition: var(--tr); font-family: inherit;
display: inline-flex; align-items: center; gap: 6px;
}
.tabs .tab:hover { background: var(--hover); color: var(--text) }
.tabs .tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px var(--accent-glow) }
.tabs .tab .cnt { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: rgba(0,0,0,0.1); font-weight: 700; transition: var(--tr) }
.tabs .tab.active .cnt { background: rgba(255,255,255,0.25) }
.tabs { gap: 6px }
.tabs .tab { border-radius: 999px }
.torrent-item { position: relative; animation: dlCardIn .25s ease }
.torrent-item:hover { transform: translateY(-1px) }
@keyframes dlCardIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
.f-card { transition: border-color var(--tr), box-shadow var(--tr), transform var(--tr) }
.selbar { animation: dlSelIn .25s ease }
@keyframes dlSelIn { from { opacity: 0; transform: translate(-50%, 12px) } to { opacity: 1; transform: translate(-50%, 0) } }

/* ===== SECTION TITLES ===== */
.sec-title {
display: flex; align-items: center; justify-content: space-between;
gap: 12px; margin: 26px 0 12px; flex-wrap: wrap;
}
.sec-title h2 { font-size: 17px; display: flex; align-items: center; gap: 8px; font-weight: 700 }
.sec-title .sub { font-size: 12px; color: var(--text3) }

/* ===== TORRENTS LIST ===== */
.torrent-list { display: flex; flex-direction: column; gap: 12px }
.torrent-item {
background: var(--bg2); border: 1px solid var(--border);
border-radius: var(--radius); padding: 16px;
display: flex; flex-direction: column; gap: 10px; transition: var(--tr);
}
.torrent-item:hover { border-color: var(--accent); box-shadow: var(--shadow-sm) }
.torrent-item-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.torrent-icon {
width: 36px; height: 36px; border-radius: var(--radius-sm);
display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
color: var(--accent);
}
.torrent-name { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.torrent-status { font-size: 12px; padding: 3px 10px; border-radius: 20px; color: var(--text2); background: var(--bg3); white-space: nowrap }
.torrent-status.dl { background: var(--accent-light); color: var(--accent) }
.torrent-status.seed { background: var(--green-light); color: var(--green) }
.torrent-status.done { background: var(--bg3); color: var(--text2) }
.torrent-progress { height: 6px; background: var(--bg3); border-radius: 4px; overflow: hidden }
.torrent-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); border-radius: 4px; transition: width 0.5s }
.torrent-meta { display: flex; gap: 16px; font-size: 12px; color: var(--text3); flex-wrap: wrap; align-items: center }
.torrent-meta span { display: flex; align-items: center; gap: 5px }

/* ===== FILES GRID ===== */
.files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px }
.f-card {
background: var(--glass); backdrop-filter: blur(12px);
border: 1px solid var(--glass-border); border-radius: var(--radius);
padding: 14px; display: flex; flex-direction: column; gap: 8px;
position: relative; transition: var(--tr);
}
.f-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-sm) }
.f-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light) }
.f-card .chk { position: absolute; top: 10px; right: 10px; width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer }
.f-card .f-icon {
width: 40px; height: 40px; border-radius: var(--radius-sm);
background: linear-gradient(135deg, var(--accent-light), transparent);
display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.f-card .f-name { font-size: 13px; font-weight: 600; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.f-card .f-size { font-size: 11px; color: var(--text3) }
.f-card .f-path { font-size: 10px; color: var(--text3); word-break: break-all; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; opacity: .8 }

/* ===== EMPTY STATE ===== */
.empty-state {
text-align: center; padding: 70px 24px; color: var(--text3);
background: var(--glass); backdrop-filter: blur(12px);
border: 1px dashed var(--border); border-radius: var(--radius-lg);
}
.empty-state .icon { font-size: 56px; margin-bottom: 16px; opacity: .6 }
.empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 6px; font-weight: 600 }
.empty-state p { font-size: 14px; margin-bottom: 18px }
.empty-state .btn { margin-top: 6px }

/* ===== BUTTONS ===== */
.btn {
background: linear-gradient(135deg, var(--accent), var(--accent2));
color: #fff; border: none;
padding: 9px 18px; border-radius: 12px;
cursor: pointer; font-size: 13px; font-weight: 600;
transition: var(--tr); font-family: inherit;
display: inline-flex; align-items: center; gap: 8px;
box-shadow: 0 2px 8px var(--accent-glow);
text-decoration: none;
position: relative; overflow: hidden;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); color: #fff }
.btn:active { transform: translateY(0) }
.btn.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); box-shadow: none }
.btn.btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); box-shadow: none }
.btn.btn-danger { background: linear-gradient(135deg, var(--red), #b91c1c); box-shadow: 0 2px 8px var(--red-light) }
.btn.btn-danger:hover { color: #fff }
.torrent-meta .btn, .torrent-actions .btn { font-size: 11px; padding: 5px 12px }

/* ===== SELECTION BAR ===== */
.selbar {
position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
z-index: 2000; display: none;
align-items: center; gap: 12px;
background: var(--glass); backdrop-filter: blur(24px) saturate(180%);
-webkit-backdrop-filter: blur(24px) saturate(180%);
border: 1px solid var(--glass-border); border-radius: var(--radius);
padding: 10px 16px; font-size: 13px;
box-shadow: var(--shadow-lg), 0 0 0 0.5px rgba(0,0,0,0.05);
white-space: nowrap;
}

/* ===== MODAL ===== */
.modal-overlay {
position: fixed; inset: 0; background: rgba(0,0,0,.5);
display: none; align-items: center; justify-content: center;
z-index: 3000; backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
}
.modal-overlay.active { display: flex }
.modal {
background: var(--bg2); border-radius: var(--radius-lg);
padding: 28px; max-width: 460px; width: 92%;
box-shadow: var(--shadow-lg); border: 1px solid var(--glass-border);
}
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px }
.modal .bar { height: 8px; background: var(--bg3); border-radius: 5px; overflow: hidden; margin: 14px 0 8px }
.modal .bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); border-radius: 5px; transition: width .3s }
.modal .pct { font-size: 13px; color: var(--text2); margin-bottom: 18px }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap }
.modal .row .btn { flex: 1; justify-content: center; min-width: 130px }

/* ===== NOTIFICATIONS ===== */
.notification {
position: fixed; top: 84px; right: 20px; z-index: 5000;
background: var(--bg2); border: 1px solid var(--glass-border);
border-left: 3px solid var(--accent);
border-radius: 12px; padding: 12px 16px;
box-shadow: var(--shadow-lg); font-size: 13px;
display: flex; align-items: center; gap: 10px;
animation: notifIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); max-width: 360px;
}
@keyframes notifIn { from { opacity: 0; transform: translateX(120%) } to { opacity: 1; transform: translateX(0) } }
.notification.success { border-left-color: var(--green) }
.notification.error { border-left-color: var(--red) }

@media (max-width: 640px) {
.main-content { padding: 76px 14px 160px }
.toolbar .btn span { display: none }
.toolbar .btn { padding: 6px 8px }
.toolbar .status-chip { display: none }
}
</style>

<script>
const CATS = [
  ['music','Музыка','fa-music','#e879f9'],
  ['video','Фильмы и сериалы','fa-film','#60a5fa'],
  ['software','Программы','fa-floppy-disk','#34d399'],
  ['games','Игры','fa-gamepad','#f472b6'],
  ['books','Книги','fa-book','#fb923c'],
  ['photos','Фото','fa-image','#38bdf8'],
  ['documents','Документы','fa-file-lines','#a3e635'],
  ['archives','Архивы','fa-file-zipper','#fbbf24'],
  ['other','Прочее','fa-file','#94a3b8']
];
const TYPE_ICONS = {music:'fa-music', video:'fa-film', software:'fa-floppy-disk', games:'fa-gamepad', books:'fa-book', photos:'fa-image', documents:'fa-file-lines', archives:'fa-file-zipper', other:'fa-file'};
const TYPE_COLORS = {music:'#e879f9', video:'#60a5fa', software:'#34d399', games:'#f472b6', books:'#fb923c', photos:'#38bdf8', documents:'#a3e635', archives:'#fbbf24', other:'#94a3b8'};

let curCat = 'music';
let filesCache = null, filesFetchedAt = 0;
let torrentsCache = null, torrentsFetchedAt = 0;
let selFiles = Object.create(null);
let createResult = null, createPollTimer = null;

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Для ВСТРАИВАНИЯ в inline-onclick в одинарных кавычках (пути Windows).
   esc() экранирует ' как HTML-сущность &#39;, но НЕ экранирует обратный слэш —
   а в JS-литерале '\c' это escape и путь 'E:\data\x.html' превращается в
   'E:datax.html'. Обратный слэш экранируем первым. */
function escJs(v){ if(v==null) return ''; return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'').replace(/\n/g,'\\n').replace(/</g,'\\u003c').replace(/>/g,'\\u003e'); }
function fmtBytes(b){ if(!b) return '0 Б'; const u=['Б','КБ','МБ','ГБ','ТБ']; let i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;} return (i===0?b:b.toFixed(1))+' '+u[i]; }
function fmtSpeed(b){ if(!b) return '0 КБ/с'; if(b<1024) return Math.round(b)+' Б/с'; if(b<1048576) return (b/1024).toFixed(1)+' КБ/с'; return (b/1048576).toFixed(2)+' МБ/с'; }
function fmtETA(ms){ if(ms<=0) return '—'; const s=Math.ceil(ms/1000); if(s<60) return s+' с'; const m=Math.floor(s/60); if(m<60) return m+' мин'; return Math.floor(m/60)+' ч'; }
function toggleTheme(){
  document.body.classList.toggle('dark');
  const dark = document.body.classList.contains('dark');
  localStorage.setItem('infinity-theme', dark ? 'dark' : 'light');
  const ic = $('#themeIcon');
  if(ic) ic.className = 'fa-solid ' + (dark ? 'fa-sun' : 'fa-moon');
}
(function(){ if(localStorage.getItem('infinity-theme') === 'dark') document.body.classList.add('dark'); })();

let notifTimer = null;
function showNotification(msg, type='info'){
  const n = document.createElement('div');
  n.className = `notification ${type}`;
  const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
  n.innerHTML = `<i class="fa-solid ${icon}"></i><span>${esc(msg)}</span>`;
  document.body.appendChild(n);
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => {
    n.style.opacity = '0';
    n.style.transition = 'all 0.3s ease';
    setTimeout(() => n.remove(), 300);
  }, 3500);
}
function toast(msg, type){ showNotification(msg, type === 'err' ? 'error' : type === 'ok' ? 'success' : 'info'); }

async function checkHelper(){
  const chip = $('#helperChip');
  try{
    const r = await fetch('/api/torrent/list');
    const d = await r.json();
    const n = (d.torrents || []).length;
    chip.textContent = 'Активно: ' + n;
    chip.className = 'status-chip ' + (d.error || !Array.isArray(d.torrents) ? 'bad' : 'good');
  }catch(e){
    chip.textContent = 'Хелпер недоступен';
    chip.className = 'status-chip bad';
  }
}

async function fetchFiles(force){
  const now = Date.now();
  if(!force && filesCache && now - filesFetchedAt < 10000) return filesCache;
  try{
    const r = await fetch('/api/torrent/files');
    const d = await r.json();
    filesCache = d.files || [];
    filesFetchedAt = now;
  }catch(e){ filesCache = filesCache || []; }
  return filesCache;
}
async function fetchTorrents(force){
  const now = Date.now();
  if(!force && torrentsCache && now - torrentsFetchedAt < 4000) return torrentsCache;
  try{
    const r = await fetch('/api/torrent/list');
    const d = await r.json();
    torrentsCache = Array.isArray(d.torrents) ? d.torrents : [];
    torrentsFetchedAt = now;
  }catch(e){ torrentsCache = torrentsCache || []; }
  return torrentsCache;
}

function renderTabs(counts){
  const tabs = $('#tabs');
  let html = '';
  for(const [cat,label,icon] of CATS){
    const cnt = counts[cat] || 0;
    html += `<button class="tab ${cat===curCat?'active':''}" data-cat="${cat}" onclick="setCat('${cat}')">
      <i class="fa-solid ${icon}" style="color:${cat===curCat?'#fff':(TYPE_COLORS[cat]||'var(--text3)')}"></i> ${label}
      <span class="cnt">${cnt}</span></button>`;
  }
  tabs.innerHTML = html;
}

function setCat(cat){ curCat = cat; render(); }

function torrentItemHtml(t){
  const pct = Math.round((t.progress || 0) * 100);
  const isSeeding = t.complete && (t.uploadSpeed > 0 || t.numPeers > 0);
  const label = isSeeding ? 'Раздаю' : t.complete ? 'Завершено' : (t.progress > 0 ? 'Скачивается' : 'Ожидание');
  const statusClass = isSeeding ? 'seed' : t.complete ? 'done' : 'dl';
  const icon = TYPE_ICONS[t.type] || 'fa-file';
  return `<div class="torrent-item" id="ti_${esc(t.infoHash)}">
    <div class="torrent-item-header">
      <div class="torrent-icon"><i class="fa-solid ${icon}" style="color:${TYPE_COLORS[t.type]||'var(--accent)'}"></i></div>
      <div class="torrent-name" title="${esc(t.name)}">${esc(t.name)}${t.paused?' (пауза)':''}</div>
      <span class="torrent-status ${statusClass}">${label}</span>
    </div>
    ${t.complete ? '' : `<div class="torrent-progress"><div class="torrent-progress-fill" style="width:${pct}%"></div></div>`}
    <div class="torrent-meta">
      <span><i class="fa-solid fa-down-long"></i> ${fmtSpeed(t.downloadSpeed||0)}</span>
      <span><i class="fa-solid fa-up-long"></i> ${fmtSpeed(t.uploadSpeed||0)}</span>
      <span><i class="fa-solid fa-hard-drive"></i> ${fmtBytes(t.downloaded||0)}/${fmtBytes(t.totalLength||0)}</span>
      <span><i class="fa-solid fa-users"></i> ${t.numPeers||0} пиров</span>
      ${t.complete ? '' : `<span><i class="fa-solid fa-clock"></i> ${fmtETA(t.timeRemaining)}</span><span>${pct}%</span>`}
    </div>
    <div class="torrent-actions">
      ${t.complete ? `<button class="btn btn-outline" onclick="pauseTorrent('${esc(t.infoHash)}')"><i class="fa-solid fa-pause"></i> Пауза</button>` : `<button class="btn btn-outline" onclick="resumeTorrent('${esc(t.infoHash)}')"><i class="fa-solid fa-play"></i> Возобновить</button>`}
      <button class="btn btn-danger" onclick="removeTorrent('${esc(t.infoHash)}')"><i class="fa-solid fa-trash"></i> Удалить</button>
    </div>
  </div>`;
}

function filesHtml(cat){
  const files = (filesCache || []).filter(f => (f.kind === cat));
  if(!files.length) return '';
  return files.map(f => {
    const ic = TYPE_ICONS[f.kind] || 'fa-file';
    const col = TYPE_COLORS[f.kind] || 'var(--text3)';
    const sel = !!selFiles[f.path];
    return `<div class="f-card ${sel?'selected':''}">
      <input type="checkbox" class="chk" ${sel?'checked':''} data-path="${esc(f.path)}" onclick="toggleFile('${escJs(f.path)}', this.checked)">
      <div class="f-icon"><i class="fa-solid ${ic}" style="color:${col}"></i></div>
      <div class="f-name" title="${esc(f.name)}">${esc(f.name)}</div>
      <div class="f-size">${fmtBytes(f.size||0)}</div>
      <div class="f-path" title="${esc(f.path)}">${esc(f.path)}</div>
    </div>`;
  }).join('');
}

let softBusy = false, lastActiveSig = '', lastFilesSig = '';
function patchDlProgress(active){
  for(const t of active){
    const el = document.getElementById('ti_' + t.infoHash);
    if(!el) continue;
    const fill = el.querySelector('.torrent-progress-fill');
    if(fill) fill.style.width = Math.round((t.progress||0)*100) + '%';
    const meta = el.querySelector('.torrent-meta');
    if(meta){
      meta.innerHTML =
        `<span><i class="fa-solid fa-down-long"></i> ${fmtSpeed(t.downloadSpeed||0)}</span>` +
        `<span><i class="fa-solid fa-up-long"></i> ${fmtSpeed(t.uploadSpeed||0)}</span>` +
        `<span><i class="fa-solid fa-hard-drive"></i> ${fmtBytes(t.downloaded||0)}/${fmtBytes(t.totalLength||0)}</span>` +
        `<span><i class="fa-solid fa-users"></i> ${t.numPeers||0} пиров</span>` +
        `<span><i class="fa-solid fa-clock"></i> ${fmtETA(t.timeRemaining)}</span><span>${Math.round((t.progress||0)*100)}%</span>`;
    }
  }
}
async function softRefresh(){
  if(softBusy) return;
  softBusy = true;
  try{
    await Promise.all([fetchFiles(), fetchTorrents()]);
    const counts = {};
    for(const f of (filesCache||[])){ if(f.kind in counts) counts[f.kind]++; }
    document.querySelectorAll('#tabs .tab').forEach(tb => {
      const cat = tb.getAttribute('data-cat');
      const c = tb.querySelector('.cnt');
      if(cat && c) c.textContent = counts[cat] || 0;
    });
    const active = (torrentsCache||[]).filter(t => t.type === curCat && !t.complete);
    const asig = active.map(t => t.infoHash).join('|');
    const aw = $('#activeWrap');
    if(aw && asig !== lastActiveSig){
      lastActiveSig = asig;
      aw.innerHTML = active.length ? '<div class="torrent-list">' + active.map(torrentItemHtml).join('') + '</div>'
        : '<div class="empty-state"><div class="icon">⚡</div><h3>Нет активных загрузок</h3><p>Загрузки этой категории появятся здесь</p></div>';
    } else if(aw){
      patchDlProgress(active);
    }
    const catFiles = (filesCache||[]).filter(f => f.kind === curCat);
    const fsig = catFiles.map(f => (f.path||'') + ':' + (f.size||0)).sort().join('|');
    const fw = $('#filesWrap');
    if(fw && fsig !== lastFilesSig){
      lastFilesSig = fsig;
      fw.innerHTML = filesHtml(curCat) || '<div class="empty-state"><div class="icon">📂</div><h3>В этой категории пока пусто</h3><p>Файлы появятся здесь после скачивания торрентов</p><a class="btn" href="/media">Перейти к торрентам</a></div>';
    }
    const fs = $('#filesSub');
    if(fs) fs.innerHTML = catFiles.length + ' файлов · <a href="/media" style="color:var(--accent)">добавить ещё</a>';
  }catch(e){ /* silent */ }
  finally{ softBusy = false; }
}

async function render(){
  await Promise.all([fetchFiles(), fetchTorrents()]);
  const counts = {music:0,video:0,software:0,games:0,books:0,photos:0,documents:0,archives:0,other:0};
  for(const f of (filesCache||[])){ if(f.kind in counts) counts[f.kind]++; }
  renderTabs(counts);
  const catMeta = CATS.find(c => c[0] === curCat) || [];
  const active = (torrentsCache||[]).filter(t => t.type === curCat && !t.complete);
  const done = (torrentsCache||[]).filter(t => t.type === curCat && t.complete);
  const view = $('#view');
  let html = '';
  html += `<div class="sec-title"><h2><i class="fa-solid fa-bolt" style="color:var(--accent)"></i> Активные торренты</h2><span class="sub">${active.length} ${active.length === 1 ? 'загрузка' : 'загрузок'}</span></div>`;
  html += `<div id="activeWrap">` + (active.length ? `<div class="torrent-list">` + active.map(torrentItemHtml).join('') + '</div>'
    : `<div class="empty-state"><div class="icon">⚡</div><h3>Нет активных загрузок</h3><p>Добавьте торрент категории «${catMeta[1] || curCat}» на странице Торренты</p><a class="btn" href="/media">Добавить торрент</a></div>`) + `</div>`;
  html += `<div class="sec-title"><h2><i class="fa-solid ${catMeta[2] || 'fa-file'}" style="color:${TYPE_COLORS[curCat] || 'var(--text3)'}"></i> Скачанные файлы</h2>
    <span class="sub" id="filesSub">${(filesCache||[]).filter(f=>f.kind===curCat).length} файлов · <a href="/media" style="color:var(--accent)">добавить ещё</a></span></div>`;
  html += `<div id="filesWrap">` + (filesHtml(curCat) || `<div class="empty-state"><div class="icon">📂</div><h3>В этой категории пока пусто</h3><p>Файлы появятся здесь после скачивания торрентов</p><a class="btn" href="/media">Перейти к торрентам</a></div>`) + `</div>`;
  view.innerHTML = html;
  lastActiveSig = active.map(t => t.infoHash).join('|');
  lastFilesSig = (filesCache||[]).filter(f=>f.kind===curCat).map(f => (f.path||'') + ':' + (f.size||0)).sort().join('|');
  updateSelBar();
}

function toggleFile(path, checked){
  if(checked) selFiles[path] = true;
  else delete selFiles[path];
  const box = document.querySelector(`.chk[data-path="${CSS.escape(path)}"]`);
  if(box) box.checked = checked;
  const card = box ? box.closest('.f-card') : null;
  if(card) card.classList.toggle('selected', checked);
  updateSelBar();
}
function clearSel(){ selFiles = Object.create(null); render(); }
function selCount(){ return Object.keys(selFiles).length; }
function updateSelBar(){
  const bar = $('#selbar');
  $('#selCount').textContent = selCount();
  bar.style.display = selCount() > 0 ? 'flex' : 'none';
}

async function pauseTorrent(infoHash){
  try{
    const r = await fetch('/api/torrent/pause', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({infoHash})});
    const d = await r.json();
    if(d.error) toast('Ошибка: ' + d.error, 'err');
    else { torrentsCache = null; render(); }
  }catch(e){ toast('Ошибка: ' + e.message, 'err'); }
}
async function resumeTorrent(infoHash){
  try{
    const r = await fetch('/api/torrent/resume', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({infoHash})});
    const d = await r.json();
    if(d.error) toast('Ошибка: ' + d.error, 'err');
    else { torrentsCache = null; render(); }
  }catch(e){ toast('Ошибка: ' + e.message, 'err'); }
}
async function removeTorrent(infoHash){
  if(!confirm('Удалить торрент?')) return;
  try{
    const r = await fetch('/api/torrent/remove', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({infoHash})});
    const d = await r.json();
    if(d.error) toast('Ошибка: ' + d.error, 'err');
    else { torrentsCache = null; render(); }
  }catch(e){ toast('Ошибка: ' + e.message, 'err'); }
}

function b64toBlob(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: 'application/x-bittorrent'});
}

let autoCopyMagnet = false;
async function createTorrentFromSel(){
  const paths = Object.keys(selFiles);
  if(!paths.length){ toast('Сначала выберите файлы', 'err'); return; }
  createTorrentFromSelCore(paths);
}
async function magnetFromSel(){
  const paths = Object.keys(selFiles);
  if(!paths.length){ toast('Сначала выберите файлы', 'err'); return false; }
  autoCopyMagnet = true;
  createTorrentFromSelCore(paths);
  return true;
}
async function createTorrentFromSelCore(paths){
  createResult = null;
  $('#modalOverlay').classList.add('active');
  $('#mActions').style.display = 'none';
  $('#mBar').style.width = '0%';
  $('#mPct').textContent = '0% — хешируем файлы…';
  try{
    const r = await fetch('/api/torrent/create', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({files: paths})});
    const d = await r.json();
    if(d.error){ $('#mPct').textContent = 'Ошибка: ' + d.error; return; }
    const taskId = d.taskId;
    createPollTimer = setInterval(() => pollCreate(taskId), 700);
    pollCreate(taskId);
  }catch(e){
    $('#mPct').textContent = 'Ошибка: ' + e.message;
  }
}
async function pollCreate(taskId){
  try{
    const r = await fetch('/api/torrent/create/status?taskId=' + encodeURIComponent(taskId));
    const d = await r.json();
    if(d.error){ clearInterval(createPollTimer); $('#mPct').textContent = 'Ошибка: ' + d.error; return; }
    const pct = Math.round((d.percent || 0) * 100);
    $('#mBar').style.width = pct + '%';
    $('#mPct').textContent = pct + '% — хешируем файлы…';
    if(d.infoHash){
      clearInterval(createPollTimer);
      createResult = d;
      $('#mBar').style.width = '100%';
      if(autoCopyMagnet){
        autoCopyMagnet = false;
        await copyCreatedMagnet();
        closeModal();
        toast('Magnet-ссылка скопирована', 'ok');
        return;
      }
      $('#mPct').textContent = 'Готово: ' + d.infoHash.slice(0, 10) + '…';
      $('#mActions').style.display = 'flex';
      $('#mDownload').onclick = () => downloadCreated();
      $('#mCopy').onclick = () => copyCreatedMagnet();
    }
  }catch(e){
    clearInterval(createPollTimer);
    $('#mPct').textContent = 'Ошибка: ' + e.message;
  }
}
function downloadCreated(){
  if(!createResult || !createResult.torrentFileBase64) return;
  const url = URL.createObjectURL(b64toBlob(createResult.torrentFileBase64));
  const a = document.createElement('a');
  a.href = url;
  a.download = (createResult.name || createResult.infoHash || 'torrent') + '.torrent';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
async function copyCreatedMagnet(){
  if(!createResult || !createResult.magnetUri) return;
  try{
    await navigator.clipboard.writeText(createResult.magnetUri);
    toast('Magnet-ссылка скопирована', 'ok');
  }catch(e){
    await InfinityDialogs.prompt({label:'Скопируйте magnet-ссылку:', value:createResult.magnetUri});
  }
}
function closeModal(){
  clearInterval(createPollTimer);
  $('#modalOverlay').classList.remove('active');
}
$('#modalOverlay').addEventListener('click', e => { if(e.target === $('#modalOverlay')) closeModal(); });

render();
checkHelper();
setInterval(checkHelper, 10000);
setInterval(() => { if(document.visibilityState === 'visible') softRefresh(); }, 5000);
</script>
</body>
</html>
