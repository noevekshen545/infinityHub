// === COLLAB INVITE NOTIFICATIONS ===
let notifInbox = [];
let notifTimer = null;

function toggleNotifPanel() {
  const p = document.getElementById('notifPanel');
  if (!p) return;
  p.classList.toggle('show');
  if (p.classList.contains('show')) {
    notifRefreshBadge(true);
    notifFetch();
  }
}

function notifFetch() {
  return fetch('/api/collab/inbox')
    .then(r => r.json())
    .then(d => {
      const invites = (d.invites || []).map(inv => ({
        id: String(inv.collab_note_id || inv.item_id || (inv.share_id || inv.collab_token || '')),
        title: String(inv.title || inv.collab_note_id || 'Заметка'),
        noteId: String(inv.collab_note_id || inv.item_id || ''),
        token: String(inv.collab_token || ''),
        shareId: String(inv.share_id || ''),
        remoteNode: inv.collab_remote ? String(inv.collab_remote.node || '') : '',
        ts: inv.shared_at || Date.now() / 1000
      }));
      const prev = notifInbox.map(n => n.id);
      const fresh = invites.filter(n => !prev.includes(n.id));
      notifInbox = invites;
      notifRender();
      if (fresh.length) notifShowFresh(fresh);
    })
    .catch(() => {});
}

function notifSeenIds() {
  try { const s = JSON.parse(localStorage.getItem('notifSeen') || '[]'); return Array.isArray(s) ? s : [] } catch (e) { return [] }
}

function notifRefreshBadge() {
  const badge = document.getElementById('notifBadge');
  if (!badge) return;
  const seen = notifSeenIds();
  const unread = notifInbox.filter(n => n.id && !seen.includes(n.id)).length;
  badge.style.display = unread ? 'block' : 'none';
  badge.textContent = unread > 99 ? '99+' : unread;
}

function notifShowFresh(fresh) {
  const seen = notifSeenIds();
  const reallyNew = fresh.filter(n => n.id && !seen.includes(n.id));
  if (reallyNew.length) {
    localStorage.setItem('notifSeen', JSON.stringify(seen.concat(reallyNew.map(n => n.id)).slice(-100)));
    reallyNew.forEach(n => {
      try {
        if (typeof toast === 'function') toast('Приглашение: ' + n.title, 'info');
      } catch (e) { }
      try {
        if ('Notification' in window) {
          if (Notification.permission === 'granted') {
            const ntf = new Notification('Приглашение в совместную заметку', { body: n.title });
            ntf.onclick = () => { window.focus(); openRouteInvite(n); };
          } else if (Notification.permission === 'default') {
            Notification.requestPermission().then(p => {
              if (p === 'granted') {
                const ntf = new Notification('Приглашение в совместную заметку', { body: n.title });
                ntf.onclick = () => { window.focus(); openRouteInvite(n); };
              }
            });
          }
        }
      } catch (e) { }
    });
  }
  notifRefreshBadge();
}

function notifRender() {
  const list = document.getElementById('notifList');
  if (!list) return;
  if (!notifInbox.length) {
    list.innerHTML = '<div class="notif-empty">Нет уведомлений</div>';
    return;
  }
  const seen = notifSeenIds();
  list.innerHTML = notifInbox.map(n => `
    <div class="notif-item">
      <div class="n-title"><i class="fas fa-people-group"></i> Приглашение в совместную заметку</div>
      <div>${esc(n.title)}</div>
      <div class="n-actions">
        <button class="n-open" onclick="openRouteInvite(${JSON.stringify(n).replace(/'/g, '&#39;')})">Открыть</button>
        ${n.noteId ? `<button class="n-read" onclick="notifDeclineInvite(${JSON.stringify(n).replace(/'/g, '&#39;')})">Отклонить</button>` : ''}
        ${n.id && !seen.includes(n.id) ? `<button class="n-read" onclick="notifMarkOne('${String(n.id).replace(/'/g, "\\'")}')">Прочитано</button>` : ''}
      </div>
    </div>`).join('');
  notifRefreshBadge();
}

function openRouteInvite(n) {
  if (n.noteId && n.token) {
    let url = '/notes/edit?id=' + encodeURIComponent(n.noteId) + '&collab=' + encodeURIComponent(n.token);
    if (n.remoteNode) url += '&remote=1&node=' + encodeURIComponent(n.remoteNode);
    location.href = url;
  } else {
    location.href = '/notes';
  }
}

function notifMarkOne(id) {
  const seen = notifSeenIds();
  if (!seen.includes(id)) {
    seen.push(id);
    localStorage.setItem('notifSeen', JSON.stringify(seen.slice(-100)));
  }
  notifRender();
  notifRefreshBadge();
}

async function notifDeclineInvite(n) {
  if (!n.noteId) return;
  if (!confirm('Отклонить приглашение к этой заметке?')) return;
  try {
    const r = await fetch('/api/collab/decline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ note_id: n.noteId, share_id: n.shareId || '', token: n.token || '' })
    });
    const d = await r.json();
    if (d.ok) {
      toast('Приглашение отклонено', 'success');
      notifFetch(true);
    } else {
      toast(d.error || 'Ошибка', 'error');
    }
  } catch (e) {
    toast('Ошибка сети', 'error');
  }
}

function notifMarkAllSeen() {
  localStorage.setItem('notifSeen', JSON.stringify(notifInbox.map(n => n.id)));
  notifRender();
  notifRefreshBadge();
}

function notifRefresh() {
  notifRender();
  notifRefreshBadge();
}

setInterval(() => {
  notifFetch();
}, 20000);
setTimeout(() => notifFetch(), 2500);
