<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1319">
<title>HA Web Panel — умный дом</title>
<link rel="icon" href="/ha/favicon.ico">
<link rel="stylesheet" href="/static/css/ha_panel.css">
</head>
<body data-ha-base="{{ha_base}}">
<div id="app">
 <aside id="sidebar">
  <div class="logo"><div class="logo-ic">🏠</div><div>HA Web Panel<small>умный дом · v1.0</small></div></div>
  <nav id="nav"></nav>
  <div class="side-foot"><span id="footStatus">…</span></div>
 </aside>
 <main id="main">
  <header id="topbar">
   <button class="icon-btn" id="burger">☰</button>
   <div id="pageTitle">Обзор</div>
   <div class="spacer"></div>
   <span class="chip" id="wsChip"><span class="dot"></span><span id="wsTxt">соединение…</span></span>
   <button class="icon-btn" id="themeBtn" title="Тема системы">🌙</button>
  </header>
  <div id="view"><div class="loading">Загрузка…</div></div>
 </main>
</div>
<div id="dialogWrap" class="hidden"><div id="dialogBackdrop"></div><div id="dialog"></div></div>
<div id="toasts"></div>
<div id="chartTip" class="hidden"></div>
<script src="/static/js/ha_panel.js" defer></script>
</body></html>
