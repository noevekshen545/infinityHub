<!DOCTYPE html>
<html class="pg-page_statistics" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статистика — Infinity</title>
<link rel="stylesheet" href="/static/css/font-awesome.min.css">
<script src="/static/libs/plotly.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box }
:root {
  --bg: #0f1419; --bg2: #151b23; --bg3: #1c242f; --bg4: #232d3a;
  --border: rgba(255,255,255,0.08); --text: #e4e8ef; --text2: #a0aec0; --text3: #6b7280;
  --accent: #6366f1; --accent2: #4f46e5; --red: #ef4444; --green: #10b981;
  --yellow: #f59e0b; --purple: #a855f7; --blue: #3b82f6; --orange: #f97316;
  --radius: 14px; --radius-sm: 8px; --font-sans: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
}
body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px }
.container { max-width: 1400px; margin: 0 auto }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border) }
.header h1 { font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 12px }
.header h1 i { color: var(--accent) }
.header-right { display: flex; align-items: center; gap: 12px }
.period-select { padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg2); color: var(--text); font-size: 14px; cursor: pointer }
.btn { padding: 8px 20px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: all .2s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px }
.btn-primary { background: var(--accent); color: #fff }
.btn-primary:hover { background: var(--accent2) }
.btn-ghost { background: var(--bg3); color: var(--text); border: 1px solid var(--border) }
.btn-ghost:hover { background: var(--bg4) }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px }
.stat-card { background: var(--bg2); border-radius: var(--radius); padding: 24px; border: 1px solid var(--border); transition: all .2s }
.stat-card:hover { border-color: var(--accent); box-shadow: 0 4px 20px rgba(99,102,241,0.1) }
.stat-card .label { font-size: 13px; color: var(--text2); margin-bottom: 8px; display: flex; align-items: center; gap: 8px }
.stat-card .value { font-size: 32px; font-weight: 700; letter-spacing: -0.5px }
.stat-card .sub { font-size: 12px; color: var(--text3); margin-top: 4px }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px }
.chart-box { background: var(--bg2); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border) }
.chart-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--text2) }
.chart-box .chart-container { width: 100%; height: 350px }
.genre-list { background: var(--bg2); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); margin-bottom: 32px }
.genre-list h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--text2) }
.genre-table { width: 100%; border-collapse: collapse }
.genre-table th, .genre-table td { padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px }
.genre-table th { color: var(--text3); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px }
.genre-table td { color: var(--text) }
.genre-table tr:hover td { background: var(--bg3) }
.genre-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); opacity: 0.7; margin-right: 12px; vertical-align: middle }
.module-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600 }
.module-badge.books { background: rgba(99,102,241,0.15); color: #4338ca }
.module-badge.media { background: rgba(16,185,129,0.15); color: #34d399 }
.module-badge.zim { background: rgba(245,158,11,0.15); color: #fbbf24 }
.loading { text-align: center; padding: 80px; color: var(--text3); font-size: 18px }
.loading i { font-size: 48px; margin-bottom: 16px; color: var(--accent); opacity: 0.5 }
@media (max-width: 900px) { .chart-row { grid-template-columns: 1fr } }
</style>
<script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="/static/js/mobile.js" defer></script>
  <script src="/static/js/dialogs.js" defer></script>
<link rel="stylesheet" href="/static/fonts/site-fonts.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fas fa-chart-pie"></i> Статистика</h1>
    <div class="header-right">
      <select class="period-select" id="periodSelect" onchange="loadStats()">
        <option value="7">За неделю</option>
        <option value="30" selected>За месяц</option>
        <option value="90">За 3 месяца</option>
        <option value="365">За год</option>
        <option value="all">За всё время</option>
      </select>
      <a href="/api/stats/recommendations/books" class="btn btn-ghost" target="_blank"><i class="fas fa-lightbulb"></i> Рекомендации</a>
      <button class="btn btn-ghost" onclick="location.href='/settings'"><i class="fas fa-arrow-left"></i> Настройки</button>
    </div>
  </div>

  <div class="stats-grid" id="summaryCards"></div>

  <div class="chart-row">
    <div class="chart-box">
      <h3><i class="fas fa-clock"></i> Активность по дням</h3>
      <div class="chart-container" id="chartDaily"></div>
    </div>
    <div class="chart-box">
      <h3><i class="fas fa-chart-donut"></i> Распределение по модулям</h3>
      <div class="chart-container" id="chartModules"></div>
    </div>
  </div>

  <div class="chart-row">
    <div class="chart-box">
      <h3><i class="fas fa-book"></i> Жанры книг</h3>
      <div class="chart-container" id="chartBookGenres"></div>
    </div>
    <div class="chart-box">
      <h3><i class="fas fa-music"></i> Жанры музыки</h3>
      <div class="chart-container" id="chartMediaGenres"></div>
    </div>
  </div>

  <div class="genre-list" id="genreDetailSection">
    <h3><i class="fas fa-list"></i> Детальная статистика по жанрам</h3>
    <div id="genreDetailTable"><p style="color:var(--text3);padding:20px">Загрузка...</p></div>
  </div>
</div>

<script>
let _currentData = null;
const COLORS = ['#6366f1','#10b981','#f59e0b','#ef4444','#a855f7','#3b82f6','#f97316','#ec4899','#14b8a6','#84cc16'];

function formatTime(seconds) {
  if (!seconds) return '0 мин';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + 'ч ' + m + 'мин';
  return m + ' мин';
}

function loadStats() {
  const days = document.getElementById('periodSelect').value;
  const params = days === 'all' ? '' : '?days=' + days;

  document.getElementById('summaryCards').innerHTML = '<div class="loading" style="grid-column:1/-1"><i class="fas fa-spinner fa-spin"></i><br>Загрузка статистики...</div>';

  Promise.all([
    fetch('/api/stats/summary' + params).then(r => r.json()),
    fetch('/api/stats/genre' + (days === 'all' ? '' : '?days=' + days)).then(r => r.json()),
    fetch('/api/stats/daily' + params).then(r => r.json()),
  ]).then(([summary, genreStats, dailyStats]) => {
    _currentData = { summary, genreStats, dailyStats };
    renderSummary(summary);
    renderDailyChart(dailyStats);
    renderModuleChart(summary);
    renderGenreCharts(genreStats);
    renderGenreTable(genreStats);
  }).catch(err => {
    document.getElementById('summaryCards').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text3)"><i class="fas fa-exclamation-triangle" style="font-size:48px;color:var(--yellow);margin-bottom:16px"></i><br>Ошибка загрузки статистики. Возможно, данные ещё не собраны.</div>';
  });
}

function renderSummary(summary) {
  const byModule = summary.by_module || {};
  const totalSec = summary.total_seconds || 0;
  const booksSec = byModule.book || 0;
  const mediaSec = byModule.media || 0;
  const zimSec = byModule.zim || 0;
  const genreCount = Object.keys(summary.genres || {}).length;
  const authorCount = Object.keys(summary.authors || {}).length;

  document.getElementById('summaryCards').innerHTML = `
    <div class="stat-card"><div class="label"><i class="fas fa-clock" style="color:var(--accent)"></i> Всего времени</div><div class="value">${formatTime(totalSec)}</div><div class="sub">за выбранный период</div></div>
    <div class="stat-card"><div class="label"><i class="fas fa-book" style="color:#818cf8"></i> Книги</div><div class="value">${formatTime(booksSec)}</div><div class="sub">${Math.round(booksSec/(totalSec||1)*100)}% от всего времени</div></div>
    <div class="stat-card"><div class="label"><i class="fas fa-music" style="color:#34d399"></i> Музыка/Видео</div><div class="value">${formatTime(mediaSec)}</div><div class="sub">${Math.round(mediaSec/(totalSec||1)*100)}% от всего времени</div></div>
    <div class="stat-card"><div class="label"><i class="fas fa-newspaper" style="color:#fbbf24"></i> ZIM статьи</div><div class="value">${formatTime(zimSec)}</div><div class="sub">${Math.round(zimSec/(totalSec||1)*100)}% от всего времени</div></div>
    <div class="stat-card"><div class="label"><i class="fas fa-tags" style="color:var(--purple)"></i> Жанров</div><div class="value">${genreCount}</div><div class="sub">уникальных жанров</div></div>
    <div class="stat-card"><div class="label"><i class="fas fa-user" style="color:var(--orange)"></i> Авторов</div><div class="value">${authorCount}</div><div class="sub">уникальных авторов/исполнителей</div></div>
  `;
}

function renderDailyChart(dailyStats) {
  const dates = Object.keys(dailyStats || {}).sort();
  if (!dates.length) {
    document.getElementById('chartDaily').innerHTML = '<p style="color:var(--text3);padding:40px;text-align:center">Нет данных</p>';
    return;
  }
  const modules = new Set();
  dates.forEach(d => (dailyStats[d] || []).forEach(item => modules.add(item.module)));
  const traces = [];
  const moduleColors = { book: '#818cf8', media: '#34d399', zim: '#fbbf24' };
  modules.forEach(mod => {
    const vals = dates.map(d => {
      const found = (dailyStats[d] || []).find(i => i.module === mod);
      return found ? Math.round(found.seconds / 60) : 0;
    });
    traces.push({
      x: dates, y: vals, type: 'bar', name: mod === 'book' ? 'Книги' : mod === 'media' ? 'Музыка' : 'ZIM',
      marker: { color: moduleColors[mod] || '#6366f1' }
    });
  });
  const layout = {
    paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
    font: { color: '#a0aec0', family: 'Inter, sans-serif' },
    barmode: 'stack', margin: { t: 20, r: 10, b: 40, l: 50 },
    xaxis: { gridcolor: 'rgba(255,255,255,0.05)', tickfont: { size: 10 } },
    yaxis: { title: 'Минуты', gridcolor: 'rgba(255,255,255,0.05)', tickfont: { size: 10 } },
    legend: { orientation: 'h', y: 1.1, font: { size: 11 } }
  };
  Plotly.newPlot('chartDaily', traces, layout, { responsive: true, displayModeBar: false });
}

function renderModuleChart(summary) {
  const byModule = summary.by_module || {};
  const labels = [], vals = [], colors = [];
  const map = { book: ['Книги', '#4338ca'], media: ['Музыка/Видео', '#047857'], zim: ['ZIM', '#b45309'] };
  let hasData = false;
  Object.entries(byModule).forEach(([k, v]) => {
    if (v > 0 && map[k]) {
      labels.push(map[k][0]); vals.push(v); colors.push(map[k][1]); hasData = true;
    }
  });
  if (!hasData) {
    document.getElementById('chartModules').innerHTML = '<p style="color:var(--text3);padding:40px;text-align:center">Нет данных</p>';
    return;
  }
  const data = [{ type: 'pie', labels, values: vals, marker: { colors }, textinfo: 'label+percent', textposition: 'outside', hole: 0.4 }];
  const layout = {
    paper_bgcolor: 'transparent', font: { color: '#a0aec0', family: 'Inter, sans-serif' },
    margin: { t: 10, r: 10, b: 10, l: 10 }, showlegend: false
  };
  Plotly.newPlot('chartModules', data, layout, { responsive: true, displayModeBar: false });
}

function renderGenreCharts(genreStats) {
  ['chartBookGenres', 'chartMediaGenres'].forEach(id => {
    Plotly.newPlot(id, [], { paper_bgcolor: 'transparent', font: { color: '#a0aec0' }, margin: { t: 10 } }, { responsive: true, displayModeBar: false });
  });
  const bookGenres = (genreStats.book || []).slice(0, 10);
  const mediaGenres = (genreStats.media || []).slice(0, 10);

  if (bookGenres.length) {
    Plotly.newPlot('chartBookGenres', [{
      y: bookGenres.map(g => g.genre).reverse(), x: bookGenres.map(g => Math.round(g.seconds / 60)).reverse(),
      type: 'bar', orientation: 'h', marker: { color: '#818cf8' },
      text: bookGenres.map(g => formatTime(g.seconds)).reverse(), textposition: 'outside'
    }], {
      paper_bgcolor: 'transparent', plot_bgcolor: 'transparent', font: { color: '#a0aec0', family: 'Inter, sans-serif' },
      margin: { t: 10, r: 80, b: 10, l: 120 }, xaxis: { gridcolor: 'rgba(255,255,255,0.05)', showticklabels: false },
      yaxis: { gridcolor: 'rgba(255,255,255,0.05)', tickfont: { size: 11 } }
    }, { responsive: true, displayModeBar: false });
  }

  if (mediaGenres.length) {
    Plotly.newPlot('chartMediaGenres', [{
      y: mediaGenres.map(g => g.genre).reverse(), x: mediaGenres.map(g => Math.round(g.seconds / 60)).reverse(),
      type: 'bar', orientation: 'h', marker: { color: '#34d399' },
      text: mediaGenres.map(g => formatTime(g.seconds)).reverse(), textposition: 'outside'
    }], {
      paper_bgcolor: 'transparent', plot_bgcolor: 'transparent', font: { color: '#a0aec0', family: 'Inter, sans-serif' },
      margin: { t: 10, r: 80, b: 10, l: 120 }, xaxis: { gridcolor: 'rgba(255,255,255,0.05)', showticklabels: false },
      yaxis: { gridcolor: 'rgba(255,255,255,0.05)', tickfont: { size: 11 } }
    }, { responsive: true, displayModeBar: false });
  }
}

function renderGenreTable(genreStats) {
  const allGenres = [];
  Object.entries(genreStats || {}).forEach(([mod, genres]) => {
    genres.forEach(g => allGenres.push({ ...g, module: mod }));
  });
  allGenres.sort((a, b) => b.seconds - a.seconds);
  if (!allGenres.length) {
    document.getElementById('genreDetailTable').innerHTML = '<p style="color:var(--text3);padding:20px">Нет данных о жанрах</p>';
    return;
  }
  const maxSec = allGenres[0].seconds || 1;
  let html = '<table class="genre-table"><thead><tr><th>Модуль</th><th>Жанр</th><th>Время</th><th>Кол-во</th><th></th></tr></thead><tbody>';
  allGenres.slice(0, 30).forEach(g => {
    const modClass = g.module === 'book' ? 'books' : g.module === 'media' ? 'media' : 'zim';
    const modLabel = g.module === 'book' ? 'Книги' : g.module === 'media' ? 'Музыка' : 'ZIM';
    const pct = Math.round(g.seconds / maxSec * 100);
    html += `<tr><td><span class="module-badge ${modClass}">${modLabel}</span></td><td>${esc(g.genre)}</td><td><strong>${formatTime(g.seconds)}</strong></td><td style="color:var(--text3)">${g.count}</td><td style="width:200px"><span class="genre-bar" style="width:${pct}%"></span></td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('genreDetailTable').innerHTML = html;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

loadStats();
</script>
</body>
</html>
