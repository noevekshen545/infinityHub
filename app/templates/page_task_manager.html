<!DOCTYPE html>
<html class="pg-page_task_manager" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диспетчер задач — Infinity</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#c9d1d9;--text2:#8b949e;--text3:#484f58;--accent:#58a6ff;--purple:#8b5cf6;--green:#238636;--orange:#f97316;--red:#da3633;--gradient:linear-gradient(135deg,#58a6ff,#8b5cf6)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.topnav{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.topnav .logo{font-size:18px;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topnav .back{padding:6px 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:12px;text-decoration:none}
.topnav .actions{margin-left:auto;display:flex;gap:6px}
.topnav .actions button{padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.topnav .actions .refresh{background:var(--gradient);color:#fff}
.topnav .actions .clear-all{background:var(--bg3);border:1px solid var(--border);color:var(--text)}
.main{max-width:1400px;margin:0 auto;padding:20px}
h1{font-size:24px;margin-bottom:6px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:var(--text2);font-size:13px;margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gradient)}
.stat-card .icon{font-size:20px;margin-bottom:6px}
.stat-card .label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .value.green{color:var(--green)}
.stat-card .value.orange{color:var(--orange)}
.stat-card .value.red{color:var(--red)}
.stat-card .value.accent{color:var(--accent)}
.section-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.task-list{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
.task-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.task-item:last-child{border-bottom:none}
.task-item:hover{background:var(--bg3)}
.task-header{display:flex;align-items:center;gap:8px}
.task-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.task-status.running{background:var(--accent);animation:pulse 1.5s infinite}
.task-status.done{background:var(--green)}
.task-status.error{background:var(--red)}
.task-status.cancelled{background:var(--orange)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.task-name{font-size:13px;font-weight:500;flex:1}
.task-time{font-size:10px;color:var(--text3);white-space:nowrap}
.task-cancel{padding:3px 8px;border-radius:4px;border:1px solid var(--red);background:transparent;color:var(--red);cursor:pointer;font-size:10px;opacity:0;transition:var(--tr)}
.task-item:hover .task-cancel{opacity:1}
.task-cancel:hover{background:var(--red);color:#fff}
.task-progress{display:flex;align-items:center;gap:8px}
.progress-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .5s ease}
.progress-fill.running{background:var(--accent)}
.progress-fill.done{background:var(--green)}
.progress-fill.error{background:var(--red)}
.progress-fill.cancelled{background:var(--orange)}
.progress-label{font-size:10px;color:var(--text2);min-width:32px;text-align:right}
.task-msg{font-size:11px;color:var(--text2);padding-left:16px}
.empty-state{padding:24px;text-align:center;color:var(--text3);font-size:13px}
.empty-state .empty-icon{font-size:32px;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
@media(max-width:768px){.row{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="/static/js/mobile.js" defer></script>
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
  <script src="/static/js/dialogs.js" defer></script>
</head>
<body>
<nav class="topnav">
  <a href="/agent" class="back"><i class="fa-solid fa-arrow-left"></i> К агенту</a>
  <div class="logo"><i class="fa-solid fa-bolt"></i> Диспетчер задач</div>
  <div class="actions">
    <button class="clear-all" onclick="clearCompleted()"><i class="fa-solid fa-trash-can" style="margin-right:6px"></i>Завершённые</button>
    <button class="refresh" onclick="loadAll()"><i class="fa-solid fa-rotate" style="margin-right:6px"></i>Обновить</button>
  </div>
</nav>
<main class="main">
  <h1>Мониторинг системы</h1>
  <p class="subtitle">Фоновые задачи, пулы потоков и состояние кэша</p>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="row">
    <div>
      <div class="section-title">🔄 Активные задачи</div>
      <div class="task-list" id="activeTasks"></div>
    </div>
    <div>
      <div class="section-title">📋 Последние задачи</div>
      <div class="task-list" id="historyTasks"></div>
    </div>
  </div>
</main>
<script>
let autoRefresh = null;
let ws = null;
let wsReconnectTimer = null;

function connectWS() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/api/worker-pool/ws');
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'ping') return;
      // Real-time update on task change
      loadTasks();
    } catch(_) {}
  };
  ws.onclose = () => {
    ws = null;
    // Fallback to polling
    if (!autoRefresh) autoRefresh = setInterval(loadAll, 3000);
  };
  ws.onopen = () => {
    // WebSocket connected — stop polling
    if (autoRefresh) { clearInterval(autoRefresh); autoRefresh = null; }
    loadTasks();
  };
  ws.onerror = () => {
    ws && ws.close();
  };
}

async function loadAll() {
  await Promise.all([loadTasks(), loadStats()]);
}

async function loadTasks() {
  try {
    const res = await fetch('/api/worker-pool/tasks');
    const tasks = await res.json();
    const entries = Object.values(tasks);
    const running = entries.filter(t => t.status === 'running');
    const done = entries.filter(t => t.status !== 'running').sort((a, b) => (b.finished_at || b.started_at) - (a.finished_at || a.started_at));

    const activeEl = document.getElementById('activeTasks');
    if (running.length === 0) {
      activeEl.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div>Нет активных задач</div>';
    } else {
      activeEl.innerHTML = running.map(t => renderTask(t)).join('');
    }

    const histEl = document.getElementById('historyTasks');
    if (done.length === 0) {
      histEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div>Нет завершённых задач</div>';
    } else {
      histEl.innerHTML = done.slice(0, 20).map(t => renderTask(t)).join('');
    }
  } catch(e) {
    console.error('loadTasks error:', e);
  }
}

function renderTask(t) {
  const status = t.status || 'running';
  const pct = t.progress || 0;
  const name = t.message || t.id || 'Задача';
  const started = t.started_at ? new Date(t.started_at * 1000).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
  const elapsed = t.started_at ? (t.finished_at || Date.now()/1000) - t.started_at : 0;
  const timeStr = elapsed > 0 ? (elapsed > 60 ? Math.round(elapsed/60) + 'м' : Math.round(elapsed) + 'с') : '';

  const icons = {running:'🔄', done:'✅', error:'❌', cancelled:'⏹'};
  const icon = icons[status] || '🔄';

  const cancelBtn = status === 'running' ? `<button class="task-cancel" onclick="cancelTask('${t.id}')">✕</button>` : '';

  return `<div class="task-item">
    <div class="task-header">
      <span class="task-status ${status}"></span>
      <span class="task-name">${icon} ${escHtml(name)}</span>
      ${cancelBtn}
      <span class="task-time">${started} ${timeStr ? '· ' + timeStr : ''}</span>
    </div>
    <div class="task-progress">
      <div class="progress-bar">
        <div class="progress-fill ${status}" style="width:${pct}%"></div>
      </div>
      <span class="progress-label">${pct}%</span>
    </div>
    ${t.error ? `<div class="task-msg" style="color:var(--red)">⚠ ${escHtml(t.error)}</div>` : ''}
  </div>`;
}

async function cancelTask(id) {
  if (!confirm('Отменить задачу ' + id + '?')) return;
  try {
    await fetch('/api/worker-pool/task/' + id + '/cancel', {method:'POST'});
    loadTasks();
  } catch(e) {
    console.error('cancel error:', e);
  }
}

async function clearCompleted() {
  try {
    const res = await fetch('/api/worker-pool/tasks');
    const tasks = await res.json();
    for (const [id, t] of Object.entries(tasks)) {
      if (t.status !== 'running') {
        await fetch('/api/worker-pool/task/' + id + '/cancel', {method:'POST'});
      }
    }
    loadTasks();
  } catch(e) {
    console.error('clear error:', e);
  }
}

async function loadStats() {
  try {
    const [tasksRes, cacheRes, loadRes] = await Promise.all([
      fetch('/api/worker-pool/tasks'),
      fetch('/api/system/cache-stats'),
      fetch('/api/system/load')
    ]);
    const tasks = await tasksRes.json();
    const cache = await cacheRes.json();
    const sysload = await loadRes.json();

    const entries = Object.values(tasks);
    const running = entries.filter(t => t.status === 'running').length;
    const done = entries.filter(t => t.status === 'done').length;
    const errors = entries.filter(t => t.status === 'error').length;

    const cacheDefault = cache.default || {};
    const cacheTts = cache.tts || {};
    const cacheSearch = cache.search || {};

    const cpu = sysload.cpu_percent !== undefined ? sysload.cpu_percent : null;
    const mem = sysload.memory || {};
    const memUsed = mem.total ? ((mem.total - mem.available) / mem.total * 100).toFixed(0) : '?';
    const memTotalGb = mem.total ? (mem.total / (1024**3)).toFixed(1) : '?';
    const memAvailGb = mem.available ? (mem.available / (1024**3)).toFixed(1) : '?';
    const highMax = sysload.high_pool ? sysload.high_pool.max_workers : '?';
    const lowMax = sysload.low_pool ? sysload.low_pool.max_workers : '?';

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card">
        <div class="icon">🔥</div>
        <div class="label">HIGH Pool</div>
        <div class="value accent">${running}/${highMax}</div>
        <div style="font-size:10px;color:var(--text3)">активных/макс</div>
      </div>
      <div class="stat-card">
        <div class="icon">⏳</div>
        <div class="label">LOW Pool</div>
        <div class="value accent">0/${lowMax}</div>
        <div style="font-size:10px;color:var(--text3)">фоновых воркеров</div>
      </div>
      <div class="stat-card">
        <div class="icon">📦</div>
        <div class="label">Кэш (по умолч.)</div>
        <div class="value">${cacheDefault.size || 0}</div>
        <div style="font-size:10px;color:var(--text3)">hits: ${cacheDefault.hits || 0} | misses: ${cacheDefault.misses || 0}</div>
      </div>
      <div class="stat-card">
        <div class="icon">🔊</div>
        <div class="label">TTS Кэш</div>
        <div class="value">${cacheTts.size || 0}</div>
        <div style="font-size:10px;color:var(--text3)">hits: ${cacheTts.hits || 0}</div>
      </div>
      <div class="stat-card">
        <div class="icon">🔍</div>
        <div class="label">Поиск Кэш</div>
        <div class="value">${cacheSearch.size || 0}</div>
        <div style="font-size:10px;color:var(--text3)">hits: ${cacheSearch.hits || 0}</div>
      </div>
      <div class="stat-card">
        <div class="icon">💻</div>
        <div class="label">CPU</div>
        <div class="value ${cpu !== null ? (cpu > 80 ? 'red' : cpu > 50 ? 'orange' : 'green') : ''}">${cpu !== null ? cpu + '%' : 'N/A'}</div>
      </div>
      <div class="stat-card">
        <div class="icon">🧠</div>
        <div class="label">RAM</div>
        <div class="value ${memUsed > 80 ? 'red' : memUsed > 50 ? 'orange' : 'green'}">${memUsed}%</div>
        <div style="font-size:10px;color:var(--text3)">${memAvailGb}G свободно / ${memTotalGb}G</div>
      </div>
      <div class="stat-card">
        <div class="icon">📊</div>
        <div class="label">Всего задач</div>
        <div class="value">${entries.length}</div>
        <div style="font-size:10px;color:var(--text3)">✅ ${done} | ❌ ${errors} | 🟢 ${running}</div>
      </div>
    `;
  } catch(e) {
    console.error('loadStats error:', e);
  }
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

// WebSocket real-time + polling fallback
document.addEventListener('DOMContentLoaded', () => {
  loadAll();
  // Polling for stats (every 5s), WebSocket for tasks
  autoRefresh = setInterval(loadStats, 5000);
  connectWS();
});
</script>
</body>
</html>
