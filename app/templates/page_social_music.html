<!DOCTYPE html>
<html class="pg-page_social_music" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Музыка — Infinity AI</title>
<link rel="stylesheet" href="/static/css/font-awesome.min.css">
<link rel="stylesheet" href="/static/css/social-theme.css?v=9">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:var(--bg-gradient)}
.toolbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius-xl);padding:6px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 24px);transition:var(--tr)}
.toolbar:hover{box-shadow:var(--shadow-lg),0 0 60px var(--accent-glow)}
.toolbar .brand{font-size:15px;font-weight:800;color:var(--accent);padding:6px 12px;border-radius:10px;cursor:pointer;transition:var(--tr);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.toolbar .brand:hover{background:var(--accent-light);transform:scale(1.05)}
.toolbar .sep{width:1px;height:20px;background:var(--border2);margin:0 4px}
.toolbar .btn{background:transparent;border:1px solid transparent;color:var(--text2);padding:8px 14px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:500;transition:var(--tr);display:inline-flex;align-items:center;gap:7px;font-family:inherit;text-decoration:none;white-space:nowrap}
.toolbar .btn:hover{background:var(--hover);color:var(--text);transform:translateY(-1px)}
.toolbar .btn:hover i{color:var(--accent)}
.toolbar .btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px var(--accent-glow)}
.toolbar .btn.active i{color:#fff}
.toolbar .btn-icon{background:transparent;border:1px solid transparent;color:var(--text2);padding:8px 10px;border-radius:12px;cursor:pointer;font-size:15px;transition:var(--tr);display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px}
.toolbar .btn-icon:hover{background:var(--hover);color:var(--accent);transform:rotate(15deg)}
body{padding-top:76px}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme-btn{padding:14px 10px;border:2px solid var(--border);border-radius:14px;cursor:pointer;font-size:12px;font-weight:600;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg);color:var(--text)}
.theme-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.theme-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.theme-btn .icon{font-size:26px}

.container{max-width:85%;margin:0 auto;padding:20px}
.page-title{font-size:28px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.page-sub{color:var(--text2);font-size:14px;margin-bottom:24px}
.search-bar{display:flex;gap:10px;margin-bottom:24px}
.search-bar input{flex:1;padding:12px 18px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:var(--tr)}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.search-bar input::placeholder{color:var(--text3)}
.search-bar button{padding:12px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--radius-md);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;transition:var(--tr)}
.search-bar button:hover{transform:translateY(-2px);box-shadow:0 4px 16px var(--accent-glow)}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat-card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:16px 20px;flex:1;min-width:140px;text-align:center}
.stat-card .num{font-size:24px;font-weight:800;color:var(--accent)}
.stat-card .label{font-size:12px;color:var(--text2);margin-top:4px}
.track-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:16px}
.track-card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:var(--tr);text-align:center}
.track-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px var(--shadow);border-color:var(--accent)}
.track-card .cover{width:100%;aspect-ratio:1;border-radius:var(--radius-md);background:var(--surface);margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text3);overflow:hidden;position:relative}
.track-card .cover img{width:100%;height:100%;object-fit:cover}
.track-card .cover .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:var(--tr)}
.track-card:hover .cover .play-overlay{opacity:1}
.track-card .cover .play-overlay i{font-size:36px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
.track-card .title{font-size:14px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-card .artist{font-size:12px;color:var(--text2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-card .album{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-card .genre{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--accent-light);color:var(--accent);font-size:10px;font-weight:600;margin-top:8px}
.track-card .duration{font-size:11px;color:var(--text3);margin-top:4px}

.player-bar{position:fixed;bottom:0;left:0;right:0;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);border-top:1px solid var(--glass-border);padding:12px 24px;display:flex;align-items:center;gap:16px;z-index:1001;display:none}
.player-bar .info{flex:1;min-width:0}
.player-bar .info .ptitle{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-bar .info .partist{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-bar .controls{display:flex;align-items:center;gap:12px}
.player-bar .controls button{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:8px;border-radius:50%;transition:var(--tr);width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.player-bar .controls button:hover{background:var(--hover);color:var(--accent)}
.player-bar .controls button.play-btn{background:var(--accent);color:#fff;font-size:16px}
.player-bar .controls button.play-btn:hover{transform:scale(1.1);box-shadow:0 0 20px var(--accent-glow)}
.player-bar .progress{flex:2;display:flex;align-items:center;gap:10px;min-width:120px}
.player-bar .progress input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none}
.player-bar .progress input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
.player-bar .progress .time{font-size:11px;color:var(--text2);min-width:35px;text-align:center}
.player-bar .close{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:8px;transition:var(--tr)}
.player-bar .close:hover{color:var(--text)}

@media(max-width:768px){
  .container{padding:12px;max-width:100%}
  .track-grid{grid-template-columns:repeat(2,1fr)}
  .toolbar{gap:2px;padding:4px}
  .toolbar .btn span{display:none}
  .stats{flex-direction:column}
}
</style>
<script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="/static/js/mobile.js" defer></script>
  <script src="/static/js/dialogs.js" defer></script>
<link rel="stylesheet" href="/static/fonts/site-fonts.css">
</head>
<body>
<div class="toolbar">
  <a class="brand" href="/social/feed"><i class="fas fa-users"></i> Social</a>
  <div class="sep"></div>
  <a class="btn" href="/social/feed"><i class="fas fa-newspaper"></i><span>Лента</span></a>
  <a class="btn" href="/social/profile"><i class="fas fa-user"></i><span>Профиль</span></a>
  <a class="btn" href="/social/friends"><i class="fas fa-user-friends"></i><span>Друзья</span></a>
  <a class="btn" href="/social/messages"><i class="fas fa-envelope"></i><span>Сообщения</span></a>
  <a class="btn" href="/social/friends?tab=groups"><i class="fas fa-users"></i><span>Группы</span></a>
  <a class="btn" href="/social/friends?tab=channels"><i class="fas fa-bullhorn"></i><span>Каналы</span></a>
  <div class="sep"></div>
  <a class="btn active" href="/social/music"><i class="fas fa-music"></i><span>Музыка</span></a>
  <a class="btn" href="/social/video"><i class="fas fa-video"></i><span>Видео</span></a>
  <div class="sep"></div>
  <button class="btn-icon" onclick="openThemePicker()" title="Тема"><i class="fas fa-palette"></i></button>
  <a class="btn-icon" href="/" title="На главную"><i class="fas fa-home"></i></a>
</div>

<!-- PAGE_START -->
<div class="container">
  <h1 class="page-title"><i class="fas fa-music"></i> Музыка</h1>
  <p class="page-sub">Вся ваша музыкальная коллекция</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Поиск по названию, исполнителю, альбому..." onkeydown="if(event.key==='Enter')searchTracks()">
    <button onclick="searchTracks()"><i class="fas fa-search"></i> Поиск</button>
  </div>
  <div class="stats" id="stats">
    <div class="stat-card"><div class="num" id="totalTracks">0</div><div class="label">Треков</div></div>
    <div class="stat-card"><div class="num" id="totalArtists">0</div><div class="label">Исполнителей</div></div>
    <div class="stat-card"><div class="num" id="totalAlbums">0</div><div class="label">Альбомов</div></div>
    <div class="stat-card"><div class="num" id="totalGenres">0</div><div class="label">Жанров</div></div>
  </div>
  <div class="track-grid" id="trackGrid"></div>
</div>

<div class="player-bar" id="playerBar">
  <div class="info">
    <div class="ptitle" id="nowPlayingTitle">—</div>
    <div class="partist" id="nowPlayingArtist">—</div>
  </div>
  <div class="controls">
    <button onclick="playPrev()"><i class="fas fa-step-backward"></i></button>
    <button class="play-btn" onclick="togglePlay()"><i class="fas fa-play" id="playIcon"></i></button>
    <button onclick="playNext()"><i class="fas fa-step-forward"></i></button>
<button onclick="keepPlayingInDock()" title="Продолжить слушать в плавающем плеере на других страницах"><i class="fas fa-arrow-up-right-from-square"></i></button>
  </div>
  <div class="progress">
    <span class="time" id="currentTime">0:00</span>
    <input type="range" id="seekBar" value="0" oninput="seek(event)">
    <span class="time" id="totalTime">0:00</span>
  </div>
  <button class="close" onclick="closePlayer()"><i class="fas fa-times"></i></button>
</div>
<audio id="audioPlayer" style="display:none"></audio>

<!-- PAGE_END -->
<div class="modal-overlay" id="themeModal">
  <div class="modal">
    <div class="modal-title"><i class="fas fa-palette"></i> Выбор темы</div>
    <div class="theme-grid">
      <div class="theme-btn" data-theme="dark" onclick="setTheme('dark')"><span class="icon"><i class="fas fa-moon"></i></span>Тёмная</div>
      <div class="theme-btn" data-theme="light" onclick="setTheme('light')"><span class="icon"><i class="fas fa-sun"></i></span>Светлая</div>
      <div class="theme-btn" data-theme="sepia" onclick="setTheme('sepia')"><span class="icon"><i class="fas fa-scroll"></i></span>Сепия</div>
      <div class="theme-btn" data-theme="warm" onclick="setTheme('warm')"><span class="icon"><i class="fas fa-fire"></i></span>Тёплая</div>
      <div class="theme-btn" data-theme="paper" onclick="setTheme('paper')"><span class="icon"><i class="fas fa-file"></i></span>Бумага</div>
      <div class="theme-btn" data-theme="ocean" onclick="setTheme('ocean')"><span class="icon"><i class="fas fa-water"></i></span>Океан</div>
      <div class="theme-btn" data-theme="forest" onclick="setTheme('forest')"><span class="icon"><i class="fas fa-tree"></i></span>Лес</div>
      <div class="theme-btn" data-theme="midnight" onclick="setTheme('midnight')"><span class="icon"><i class="fas fa-star"></i></span>Полночь</div>
      <div class="theme-btn" data-theme="rose" onclick="setTheme('rose')"><span class="icon"><i class="fas fa-rose"></i></span>Роза</div>
    </div>
    <div class="m-actions"><button class="btn-primary" onclick="closeThemePicker()"><i class="fas fa-check"></i> Готово</button></div>
  </div>
</div>

<script>
const savedTheme = localStorage.getItem('infinity_theme') || 'dark';
document.body.className = '';
if (savedTheme !== 'dark') document.body.classList.add(savedTheme);

function getTheme() { return localStorage.getItem('infinity_theme') || 'dark' }
function setTheme(t) {
  document.body.className = '';
  if (t !== 'dark') document.body.classList.add(t);
  localStorage.setItem('infinity_theme', t);
  document.querySelectorAll('.theme-btn').forEach(el => el.classList.toggle('active', el.dataset.theme === t));
}
function openThemePicker() {
  openModal('themeModal');
  document.querySelectorAll('.theme-btn').forEach(el => el.classList.toggle('active', el.dataset.theme === getTheme()));
}
function closeThemePicker() { closeModal('themeModal') }

let allTracks = [];
let filteredTracks = [];
let currentIndex = -1;
let isPlaying = false;
const audio = document.getElementById('audioPlayer');
const playIcon = document.getElementById('playIcon');

function formatTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function getStreamUrl(track) {
  const encoded = btoa(unescape(encodeURIComponent(track.filepath))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return '/api/media/stream/' + encoded;
}

function getCoverUrl(track) {
  if (track.has_cover && track.cover_path) return '/api/media/cover/' + track.id;
  return null;
}

function renderTracks(tracks) {
  const grid = document.getElementById('trackGrid');
  if (!tracks.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3)"><i class="fas fa-music" style="font-size:48px;display:block;margin-bottom:16px"></i>Треки не найдены</div>';
    return;
  }
  grid.innerHTML = tracks.map((t, i) => {
    const coverUrl = getCoverUrl(t);
    const coverHtml = coverUrl
      ? '<img src="' + coverUrl + '" alt="cover" loading="lazy">'
      : '<i class="fas fa-music"></i>';
    const genre = t.genre || '';
    return '<div class="track-card" onclick="playTrack(' + i + ')">' +
      '<div class="cover">' + coverHtml +
      '<div class="play-overlay"><i class="fas fa-play-circle"></i></div></div>' +
      '<div class="title">' + (t.title || 'Unknown') + '</div>' +
      '<div class="artist">' + (t.artist || 'Unknown Artist') + '</div>' +
      '<div class="album">' + (t.album || '') + '</div>' +
      (genre ? '<div class="genre">' + genre + '</div>' : '') +
      '<div class="duration">' + formatTime(t.duration) + '</div></div>';
  }).join('');
}

function loadTracks() {
  fetch('/api/media/music-index')
    .then(r => r.json())
    .then(data => {
      allTracks = data.tracks || [];
      filteredTracks = allTracks;
      updateStats();
      renderTracks(filteredTracks);
    })
    .catch(err => {
      console.error('Error loading tracks:', err);
      document.getElementById('trackGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--red)"><i class="fas fa-exclamation-triangle" style="font-size:48px;display:block;margin-bottom:16px"></i>Ошибка загрузки треков</div>';
    });
}

function searchTracks() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) {
    filteredTracks = allTracks;
    updateStats();
    renderTracks(filteredTracks);
    return;
  }
  fetch('/api/media/search?q=' + encodeURIComponent(q))
    .then(r => r.json())
    .then(data => {
      filteredTracks = data.tracks || data || [];
      if (!Array.isArray(filteredTracks)) filteredTracks = allTracks;
      updateStats();
      renderTracks(filteredTracks);
    })
    .catch(() => {
      filteredTracks = allTracks.filter(t => {
        const lq = q.toLowerCase();
        return (t.title && t.title.toLowerCase().includes(lq)) ||
               (t.artist && t.artist.toLowerCase().includes(lq)) ||
               (t.album && t.album.toLowerCase().includes(lq));
      });
      updateStats();
      renderTracks(filteredTracks);
    });
}

function updateStats() {
  const artists = new Set(filteredTracks.map(t => t.artist).filter(Boolean));
  const albums = new Set(filteredTracks.map(t => t.album).filter(Boolean));
  const genres = new Set(filteredTracks.map(t => t.genre).filter(Boolean));
  document.getElementById('totalTracks').textContent = filteredTracks.length;
  document.getElementById('totalArtists').textContent = artists.size;
  document.getElementById('totalAlbums').textContent = albums.size;
  document.getElementById('totalGenres').textContent = genres.size;
}

/* Передать текущий трек в плавающий плеер — music продолжит играть на других страницах */
function keepPlayingInDock(){
  if(!window.SocialDock){toast('Плеер недоступен','error');return}
  if(!audio.src){toast('Сначала включите трек','error');return}
  const t=filteredTracks[currentIndex]||{};
  SocialDock.setAudio({
    src:audio.src,
    title:t.title||document.getElementById('nowPlayingTitle').textContent||'Трек',
    artist:t.artist||document.getElementById('nowPlayingArtist').textContent||'',
    cover:t.cover||t.album_art||''
  });
  toast('Плеер работает на всех страницах','success');
}

function playTrack(idx) {
  currentIndex = idx;
  const track = filteredTracks[idx];
  if (!track) return;
  document.getElementById('nowPlayingTitle').textContent = track.title || 'Unknown';
  document.getElementById('nowPlayingArtist').textContent = track.artist || 'Unknown Artist';
  audio.src = getStreamUrl(track);
  audio.play().then(() => {
    isPlaying = true;
    playIcon.className = 'fas fa-pause';
    document.getElementById('playerBar').style.display = 'flex';
  }).catch(console.error);
}

function togglePlay() {
  if (!audio.src) return;
  if (audio.paused) {
    audio.play();
    isPlaying = true;
    playIcon.className = 'fas fa-pause';
  } else {
    audio.pause();
    isPlaying = false;
    playIcon.className = 'fas fa-play';
  }
}

function playNext() {
  if (currentIndex < filteredTracks.length - 1) playTrack(currentIndex + 1);
}

function playPrev() {
  if (currentIndex > 0) playTrack(currentIndex - 1);
}

function seek(e) {
  if (audio.duration) {
    audio.currentTime = (e.target.value / 100) * audio.duration;
  }
}

function closePlayer() {
  audio.pause();
  audio.src = '';
  isPlaying = false;
  document.getElementById('playerBar').style.display = 'none';
}

audio.addEventListener('timeupdate', function() {
  if (audio.duration) {
    document.getElementById('seekBar').value = (audio.currentTime / audio.duration) * 100;
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
    document.getElementById('totalTime').textContent = formatTime(audio.duration);
  }
});

audio.addEventListener('ended', playNext);

function openModal(id) { document.getElementById(id).classList.add('active') }
function closeModal(id) { document.getElementById(id).classList.remove('active') }
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active') });
});

loadTracks();
</script>
<script src="/static/js/social-ui.js?v=6"></script>
<script src="/static/js/social-dock.js?v=7"></script>
</body>
</html>
